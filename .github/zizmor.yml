# Narrow ignores for zizmor (https://docs.zizmor.sh/configuration/), one per finding that cannot or should not be fixed, each with its reason.
# No rule is disabled wholesale; an ignore names a FILE (not a line: line numbers shifted with every edit and broke the audit), so a new finding of the same rule in
# another file fails the audit, while one more in a listed file does not (review the diff of that file by eye).
rules:
  # `uses: ./.github/actions/setup-tool`: zizmor suggests the `$/...` self-repository syntax. The local
  # path resolves to the SAME commit as the workflow, which is the property that matters here, and the `$` form is not used anywhere else in
  # this repository or tested; changing 31 call sites to an unverified syntax would risk every build for a style finding (severity: help).
  self-repository:
    ignore:
      - action.yml
      - build-dx.yml
      - build-gx.yml
      - dx-image.yml
      - build-nvidia-dx.yml
      - build-nvidia-gx.yml
      - build-dx-gx.yml
      - build-nvidia.yml
      - build.yml
      - bump-pins.yml
      - publish-latest.yml
      - rollback-latest.yml
      - test.yml
  # These jobs push branches with git (bump pull requests): the persisted checkout credential of the default GITHUB_TOKEN IS the
  # mechanism (permissions contents: write for this job only), there is no other credential in the workflow.
  artipacked:
    ignore:
      - bump-pins.yml
  # The only writes to $GITHUB_PATH/$GITHUB_ENV: setup-tool adds its own pinned tool directory under $HOME to PATH (no input reaches the value).
  # build-nvidia-dx.yml and build-nvidia-gx.yml export values it computed itself (digests, tags, image names from its own scripts and `skopeo inspect`), never text of a pull request.
  github-env:
    ignore:
      - action.yml
      - build-nvidia-dx.yml
      - build-nvidia-gx.yml
  # build-nvidia-dx.yml and build-nvidia-gx.yml start on `workflow_run` of "Build NVIDIA variant", restricted to branches [main], i.e. after a build of this
  # repository's own main finished; nothing from a fork or a pull request reaches it, and it checks out `inputs.sha`/main commits of this repository only.
  dangerous-triggers:
    ignore:
      - build-nvidia-dx.yml
      - build-nvidia-gx.yml
