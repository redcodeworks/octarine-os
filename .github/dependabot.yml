# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    # the workflows (/) and the composite action setup-tool, whose `uses:` lines Dependabot does not look at otherwise
    directories:
      - "/"
      - "/.github/actions/setup-tool"
    target-branch: "testing"
    schedule:
      interval: "weekly"
    # a new action release is proposed only after a week, so a compromised release is more likely to be pulled before it is offered
    cooldown:
      default-days: 7
