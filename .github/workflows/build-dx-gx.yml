---
name: Build dx-gx image
# EXPERIMENTAL, dispatch only. The combined developer and gamer image (ghcr.io/<owner>/octarine-os-dx-gx, user-facing alias `fx`): the SAME gx layer as octarine-os-gx
# (variants/gx, the lists of the pinned octarine-bins-gx image) on top of the developer image octarine-os-dx instead of octarine-os (layering order: os, dx, gx). Built like
# build-nvidia-gx.yml, which is the gx layer on the NVIDIA base: a thin caller of the reusable dx-image.yml (variant gx, base_name octarine-os-dx), its own concurrency group.
# It starts by manual dispatch on `main` only: no schedule, no workflow_run, no push, no pull request, no `testing` channel (so no promote from testing), and it never posts the required check
# `Build gx and push image` or a commit status (its result job has another name), so it can neither satisfy nor block a promotion pull request. Nothing rebuilds it when the dx image
# changes: dispatch it again. The plan job (.github/scripts/plan-dx.sh, variant gx, promote_from_testing off) skips when the octarine-os-dx digest and the gx inputs are unchanged
# (`force` builds anyway). Signing is this file's own `sign` job (an environment secret did not reach a reusable-workflow job). Design in CLAUDE.md ("dx-gx image (experimental)").
on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the octarine-os-dx digest and the gx inputs are unchanged
        type: boolean
        default: false

# A run that is already building is never cancelled (a newer trigger waits, only one can wait)
concurrency:
  group: build-dx-gx
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # plan and build: the reusable workflow. A dispatch on `main` only. Signing is the `sign` job below.
  dx_gx:
    name: dx-gx
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dx-image.yml
    permissions:
      contents: read
      packages: write
    with:
      base_name: octarine-os-dx
      dx_name: octarine-os-dx-gx
      variant: gx
      channel: latest
      sha: ${{ github.sha }}
      force: ${{ inputs.force }}
      promote_from_testing: false
      tags: latest-{sha} latest-{date}-{sha} {date}-{sha} {date} latest latest-{date}
      description: octarineOS developer tools, Steam, gamescope, MangoHud, GameMode and Sunshine (experimental developer and gamer image, built on request from octarine-os-dx)
      # the gx smoke test runs by itself (variant gx); this second one checks that the developer layer below it is intact (toolchain, virtualization, dev recipe)
      extra_smoke: .github/scripts/dx-smoke.sh
      # measured locally at 14.4 GiB (default 8.9, dx 11.4): the default limit of 15 GiB would sit on the edge
      max_image_gib: 18

  # Signing lives here, not in the reusable workflow: an environment secret did not reach a job inside dx-image.yml (observed 2026-11-16 on two runs).
  # A build signs every pushed digest, a promotion only verifies the digest that was signed when the testing image was published; both then
  # verify every tag. Skipped when nothing was built or promoted (plan skipped, nothing to do, dry run, failures before it).
  sign:
    name: Sign and verify dx-gx image
    needs: dx_gx
    if: >-
      always() && needs.dx_gx.result == 'success' &&
      (needs.dx_gx.outputs.build == 'success' || needs.dx_gx.outputs.promote == 'success')
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify
        uses: ./.github/actions/sign-images
        with:
          image: ${{ needs.dx_gx.outputs.image }}
          digests: ${{ needs.dx_gx.outputs.digests }}
          tags: ${{ needs.dx_gx.outputs.alias_tags }}
          mode: ${{ needs.dx_gx.outputs.build == 'success' && 'sign' || 'verify' }}
          private-key: ${{ secrets.SIGNING_SECRET }}

  # The one result of a run; always runs. Green when the image was built and signed or legitimately skipped (octarine-os-dx digest and gx inputs
  # unchanged). It is NOT named `Build dx and push image` and posts no commit status: that context belongs to build-dx.yml and is a required check on main.
  dx_gx_result:
    name: dx-gx build result
    needs: [dx_gx, sign]
    if: always()
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the result
        env:
          PLAN: ${{ needs.dx_gx.result == 'skipped' && 'skipped' || needs.dx_gx.outputs.plan || 'failure' }}
          BUILD_WANTED: ${{ needs.dx_gx.outputs.build_wanted }}
          PROMOTE_WANTED: "false"
          BUILD: ${{ needs.dx_gx.result == 'skipped' && 'skipped' || needs.dx_gx.outputs.build || 'failure' }}
          PROMOTE: skipped
          SIGN: ${{ needs.sign.result }}
        run: .github/scripts/aggregate-dx.sh
