---
name: Prune daily images
# Images built by the scheduled daily build carry an extra tag `daily-YYYYMMDD` (octarine-os, and octarine-os-dx and octarine-os-gx built on it). Weekly, only the
# newest 14 of them are kept: older ones and their cosign signatures are deleted (.github/scripts/prune-daily.py). Testing builds, the
# NVIDIA images, the bare `latest` and anything else are never touched. Scheduled runs delete for real; start it by hand with dry_run on
# (the default) to see the plan: `gh workflow run prune-daily.yml -f dry_run=true`. A failed run is just a red scheduled run.
#
# Two jobs. `plan` is the ONE place that lists the package names: it reads what must survive (the digest behind each image's own `latest`, and the default image that each
# variant's `latest` stands on, any failed lookup stops the run) and passes the names and that protect list on. `prune` is a matrix with ONE JOB PER PACKAGE (a new image is
# one more name in `plan`; a name the prune script cannot read turns only its own job red). Each job lists and deletes only its own package, so they share nothing; each makes a
# few list calls and at most 30 deletes, so parallel runs stay far from the rate limits (the `gh` calls are not retried: a failed one fails that job; the registry reads in
# `plan` are retried by registry_read.py).
on:
  schedule:
    - cron: '0 5 * * 0'  # Sundays 05:00 UTC (scheduled runs come from the default branch)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        type: boolean
        default: true

concurrency:
  group: prune-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan the prune
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      names: ${{ steps.plan.outputs.names }}
      protect: ${{ steps.plan.outputs.protect }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: List the packages and what must survive
        id: plan
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          # The only list of packages to prune.
          names="octarine-os octarine-os-dx octarine-os-gx"
          # Images that must survive: the digest behind each image's own `latest`, and the default images that the variants' `latest` stand on (the base digest
          # is a label of the variant). The images publish independently, so these are different digests. Any failed lookup stops the run: never prune without
          # knowing what is live.
          protect=""
          for name in ${names}; do
            image="ghcr.io/${owner}/${name}"
            rc=0; digest=$(IMAGE="${image}" uv run --frozen --no-dev python -I .github/scripts/registry_digest.py latest) || rc=$?
            [[ "${rc}" == 0 && "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::cannot read ${image}:latest (status ${rc})"; exit 1; }
            protect="${protect} ${digest}"
            if [[ "${name}" != octarine-os ]]; then
              base=$(uv run --frozen --no-dev python -I .github/scripts/registry_read.py config "${image}@${digest}" | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty')
              [[ "${base}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${image}@${digest} has no readable base digest label"; exit 1; }
              protect="${protect} ${base}"
            fi
          done
          echo "Protected: ${protect# }"
          echo "names=$(jq -cn --arg n "${names}" '$n | split(" ")')" >> "${GITHUB_OUTPUT}"
          echo "protect=${protect# }" >> "${GITHUB_OUTPUT}"

  prune:
    name: Prune ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      NAME: ${{ matrix.name }}
      PROTECT: ${{ needs.plan.outputs.protect }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prune
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          kind=$(gh api "users/${OWNER}" --jq '.type')
          if [[ "${kind}" == "Organization" ]]; then scope="orgs/${OWNER}"; else scope="users/${OWNER}"; fi
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then export DRY_RUN="${INPUT_DRY_RUN}"; else export DRY_RUN=false; fi
          export API_BASE="${scope}/packages/container/${NAME}"
          echo "== ${API_BASE}, dry run: ${DRY_RUN}"
          echo "Protected: ${PROTECT}"
          gh api --paginate "${API_BASE}/versions?per_page=100" | python3 .github/scripts/prune-daily.py
