name: Check upstream releases
# Weekly: for every component of binaries/ (binaries/scx, binaries/extest; Ghostty and its Zig toolchain have their own step, see ghostty-check.sh) ask upstream for its latest release and, when it is
# newer than the pin in binaries/<name>/upstream.env (extest: asked of the real project, and only once our fork redcodeworks/extest
# has the commit; the fork is never written to), open or update ONE bump pull request on the branch bump/<name> into `testing`.
# It changes only upstream.env; nothing is built or published here (the merge into testing changes the tree hash of binaries/, and
# the build after it builds and signs the new binaries image). Monday 07:00 UTC; scheduled workflows run only from `main`, so
# the first scheduled run follows the first promotion that carries this file. workflow_dispatch works from any branch that has it.
#
# Token: only the default GITHUB_TOKEN (no personal token). Its pushes and pull requests start no push or pull_request workflow,
# except workflow_dispatch, so bump-upstream.sh dispatches the Test workflow on the bump branch: the required checks `test` and
# `secrets` then run on the head commit. NOT verified on GitHub: whether a dispatched run satisfies the required checks of the pull
# request. The repository setting "Allow GitHub Actions to create and approve pull requests" must be on (it is).
on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-check
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    name: Check upstream releases
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing
          fetch-depth: 0

      - name: Ask upstream and open bump pull requests
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=0
          {
            echo "## Upstream check"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          for envfile in binaries/*/upstream.env; do
            dir=$(dirname "${envfile}")
            # Ghostty has its own rules (stable tags only, the Zig toolchain follows from the tag): see below
            [[ "${dir}" != binaries/ghostty ]] || continue
            decision=$(.github/scripts/upstream-check.sh "${dir}")
            echo "${dir}: ${decision}"
            echo "- \`${dir}\`: ${decision}" >> "${GITHUB_STEP_SUMMARY}"
            read -r verb tag commit _ <<<"${decision}"
            case "${verb}" in
              bump)
                if ! .github/scripts/bump-upstream.sh "${dir}" "${tag}" "${commit}"; then
                  echo "::error::could not open or update the bump pull request for ${dir}"
                  failed=1
                fi
                ;;
              forkbehind)
                fork=$(sed -n 's/^UPSTREAM_REPO=//p' "${envfile}")
                echo "::notice::${dir}: the fork ${fork} is behind upstream: sync it (gh repo sync ${fork}) and rerun"
                echo "- \`${dir}\`: the fork ${fork} is behind upstream: sync it (\`gh repo sync ${fork}\`) and rerun" >> "${GITHUB_STEP_SUMMARY}"
                ;;
              unreachable) echo "::warning::${dir}: ${decision}" ;;
              *) echo "::notice::${dir}: nothing to bump (${decision})" ;;
            esac
          done

          # Ghostty and its Zig toolchain (ghostty-check.sh): a newer STABLE tag (v<major>.<minor>.<patch>) moves upstream.env and zig.env in ONE
          # pull request (the Zig minor follows from the tag); a newer patch of the pinned Zig minor is a separate low-priority one; a tag whose Zig
          # minor has no published tarball yet opens nothing and says so here. An optional component: a failed bump never touches an image.
          decision=$(.github/scripts/ghostty-check.sh)
          echo "binaries/ghostty: ${decision}"
          echo "- \`binaries/ghostty\`: ${decision}" >> "${GITHUB_STEP_SUMMARY}"
          read -r verb a1 a2 a3 a4 a5 a6 <<<"${decision}"
          case "${verb}" in
            bump)
              if ! .github/scripts/bump-ghostty.sh ghostty "${a1}" "${a2}" "${a3}" "${a4}" "${a5}" "${a6}"; then
                echo "::error::could not open or update the Ghostty bump pull request"
                failed=1
              fi
              ;;
            zigbump)
              if ! .github/scripts/bump-ghostty.sh zig "${a1}" "${a2}" "${a3}" "${a4}"; then
                echo "::error::could not open or update the Zig bump pull request"
                failed=1
              fi
              ;;
            wait) echo "::notice::binaries/ghostty: ${decision#wait }" ;;
            unreachable) echo "::warning::binaries/ghostty: ${decision}" ;;
            *) echo "::notice::binaries/ghostty: nothing to bump (${decision})" ;;
          esac
          exit "${failed}"
