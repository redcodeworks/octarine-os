name: Test
# The run of a push is named after the commit; a dispatch with `ref` (the bump workflow tests a bump branch tip from the testing ref, see bump-checks.sh) is named "Test of <sha>" so
# bump-checks.sh finds it. A dispatch on a branch itself (no ref) still works.
run-name: ${{ inputs.ref && format('Test of {0}', inputs.ref) || github.event.head_commit.message || 'Test' }}

# The fast lane: every push to a dev branch runs the quick checks (just check, bash -n, tests/*.sh) and a secret scan. A push to `testing` runs them too (since 2026-11-15):
# the squash merges of several PRs can break each other, and the tip of testing is what the promotion PR into main carries. That run is a result to look at, not a
# gate (the ruleset requires `test` and `secrets` on the pull requests into testing, which are the runs of the feature branches); it never cancels an earlier one.
# No pull_request trigger: the push check run is reported on the commit, so the pull request sees it and nothing runs
# twice. The image build is build.yml (testing and main pushes).
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to test (default: the commit of the ref the run was started on)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  # a newer push to a feature branch replaces the older run; the runs on the testing tip all finish (each merge deserves its own result)
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/testing' }}

permissions:
  contents: read

jobs:
  # How much of the test job a push needs (.github/scripts/test-scope.sh): `docs` when every changed file is documentation text, else `full`
  # (a dispatch, a mixed push, a failing detection). For `docs` the jobs `base` and `test` are SKIPPED by a job-level `if` (a skipped job
  # reports "Skipped", which satisfies the required check; a path filter on the workflow would leave it missing) and the light job `docs`
  # runs the documentation tests on the host runner: no base image pull, no dnf install.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Documentation only?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          scope=$(.github/scripts/test-scope.sh "${EVENT}" "${BEFORE}" "${AFTER}") || scope=full
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "Test scope: ${scope}" | tee -a "${GITHUB_STEP_SUMMARY}"

  # The base the images are built on, resolved ONCE per run to a digest and signature-checked (base-pin.sh, the same script and the same BASE_IMAGE/FEDORA_VERSION
  # defaults and repository variables as build.yml): the test job runs inside that image, so the tests see the Fedora, the niri, fish and shellcheck the image build sees
  # (and a Fedora update that breaks them shows here before the image build does). build-beta.yml runs the same tests (the test-suite action) on ITS base.
  base:
    name: base
    needs: [scope]
    # always(): a failed scope job means the full run; only a documentation-only scope skips
    if: always() && needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      BASE_IMAGE: ${{ vars.BASE_IMAGE || 'ghcr.io/ublue-os/silverblue-main' }}
      FEDORA_VERSION: ${{ vars.FEDORA_VERSION || '45' }}
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Resolve the base image to a digest and verify it
        id: pin
        run: |
          pin_line=$(.github/scripts/base-pin.sh)
          BASE_PIN=${pin_line#BASE_PIN=}
          [[ "${BASE_PIN}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no base digest from base-pin.sh"; exit 1; }
          echo "image=${BASE_IMAGE}@${BASE_PIN}" >> "${GITHUB_OUTPUT}"
          echo "Tests run on ${BASE_IMAGE}:${FEDORA_VERSION} = ${BASE_PIN}" | tee -a "${GITHUB_STEP_SUMMARY}"

  test:
    name: test
    needs: [scope, base]
    # always(): a failed scope job means the full run; only a documentation-only scope skips (the `docs` job below runs instead)
    if: always() && needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    container: ${{ needs.base.outputs.image }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Run the tests
        uses: ./.github/actions/test-suite

  # Documentation-only push: the tests that read the documentation (derived by grep in test-scope.sh --doc-tests, never a fixed list) and a sanity
  # check of the text, straight on the runner (no container, no dnf; the pinned just is a cached download).
  docs:
    name: docs
    needs: [scope]
    if: needs.scope.outputs.scope == 'docs'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # the one tool the documentation tests need that the runner lacks: a cached download of the pinned just (a few seconds)
      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Run the tests that read the documentation
        run: |
          mapfile -t doc_tests < <(.github/scripts/test-scope.sh --doc-tests)
          echo "Documentation only: running ${#doc_tests[@]} tests that read the documentation"
          .github/scripts/run-tests.sh --jobs 4 "${doc_tests[@]}"

      - name: Sanity check of the documentation text
        run: .github/scripts/docs-sanity.sh

  secrets:
    name: secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
