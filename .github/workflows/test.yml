name: Test

# The fast lane: every push to a dev branch runs the quick checks (just check, bash -n, tests/*.sh) and a secret scan.
# No pull_request trigger: the push check run is reported on the commit, so the pull request sees it and nothing runs
# twice. The image build is build.yml (testing and main pushes).
on:
  push:
    branches-ignore:
      - main
      - testing
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # How much of the test job a push needs (.github/scripts/test-scope.sh): `docs` when every changed file is documentation text, else `full`
  # (a first push of a branch, a dispatch, a mixed push, a failing detection). The job `test` below always runs and keeps its name: it is a
  # required check, and a path filter on the workflow would leave it missing.
  scope:
    name: scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Documentation only?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          scope=$(.github/scripts/test-scope.sh "${EVENT}" "${BEFORE}" "${AFTER}") || scope=full
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          echo "Test scope: ${scope}" | tee -a "${GITHUB_STEP_SUMMARY}"

  test:
    name: test
    needs: scope
    # always: a failed scope job means the full run, never a missing required check
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container: fedora:45
    env:
      DOCS_ONLY: ${{ needs.scope.outputs.scope == 'docs' }}
    steps:
      - name: Install the tools the tests need
        run: |
          for attempt in 1 2 3; do
            dnf -y install --setopt=install_weak_deps=False --setopt=retries=5 \
              just jq fish zsh niri git python3 python3-pyyaml shellcheck gawk dconf bash-completion \
              findutils diffutils which tar gzip zstd curl ca-certificates util-linux shadow-utils binutils nodejs && exit 0
            echo "::warning::dnf install failed (attempt ${attempt}); retrying in 20 s"
            sleep 20
          done
          echo "::error::dnf install failed three times"
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The container runs as root, but recipes and tests check that they are not run as root (no session bus), so
      # everything after the install runs as an ordinary user, like on the desktop.
      - name: Create the ordinary user the checks run as
        run: |
          useradd --create-home ci
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"
          chown -R ci: "${GITHUB_WORKSPACE}"

      - name: Install the pinned just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Make the pinned just usable by that user
        run: install -m 0755 "$(command -v just)" /usr/local/bin/just && just --version

      - name: just check
        if: env.DOCS_ONLY != 'true'
        run: runuser -u ci -- just check

      - name: bash -n on every script
        if: env.DOCS_ONLY != 'true'
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then echo "FAIL bash -n $f"; fail=1; fi
          done < <(git ls-files '*.sh' githooks/pre-push)
          # shell blocks of the workflows are checked by the tests that read them; scripts only here
          [ "$fail" = 0 ] && echo "bash -n: all scripts parse"
          exit "$fail"

      # four at a time, output buffered per test, results in a fixed order (.github/scripts/run-tests.sh)
      - name: Run every tests/*.sh
        if: env.DOCS_ONLY != 'true'
        shell: runuser -u ci -- bash -e {0}
        run: .github/scripts/run-tests.sh --jobs 4

      # documentation-only push: the tests that read the documentation (derived by grep, never a fixed list) and a quick sanity check of the text
      - name: Run the tests that read the documentation
        if: env.DOCS_ONLY == 'true'
        shell: runuser -u ci -- bash -e {0}
        run: |
          mapfile -t doc_tests < <(.github/scripts/test-scope.sh --doc-tests)
          echo "Documentation only: running ${#doc_tests[@]} tests that read the documentation"
          .github/scripts/run-tests.sh --jobs 4 "${doc_tests[@]}"

      - name: Sanity check of the documentation text
        if: env.DOCS_ONLY == 'true'
        run: |
          bad=0
          for f in *.md docs/*.md; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ]; then echo "::error file=$f::empty"; bad=1; fi
            if grep -qE '^(<<<<<<<|=======|>>>>>>>)( |$)' "$f"; then echo "::error file=$f::merge conflict marker"; bad=1; fi
          done
          exit "$bad"

  secrets:
    name: secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
