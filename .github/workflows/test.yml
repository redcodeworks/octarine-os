name: Test
# The run of a push is named after the commit; a dispatch with `ref` (the bump workflow tests a bump branch tip from the testing ref, see bump-checks.sh) is named "Test of <sha>" so
# bump-checks.sh finds it. A dispatch on a branch itself (no ref) still works.
run-name: ${{ inputs.ref && format('Test of {0}', inputs.ref) || github.event.head_commit.message || 'Test' }}

# The fast lane: every push to a dev branch runs the quick sanity check (bash -n, workflow parse) and the behavior tests and a secret scan. A push to `testing` runs them too (since 2026-11-15):
# the squash merges of several PRs can break each other, and the tip of testing is what the promotion PR into main carries. That run is a result to look at, not a
# gate (the ruleset requires `test` and `secrets` on the pull requests into testing, which are the runs of the feature branches); it never cancels an earlier one.
# No pull_request trigger: the push check run is reported on the commit, so the pull request sees it and nothing runs
# twice. The image build is build.yml (testing and main pushes).
# The workflow audit (job `zizmor`, formerly its own workflow file) lives here too, to keep one workflow for every check on a branch: it runs on every push
# (about 8 s, so no path filter) and, alone, on the weekly schedule (new audits and advisories arrive without a change here); the other jobs skip on the schedule.
on:
  push:
    branches-ignore:
      - main
  schedule:
    - cron: "0 6 * * 3"  # Wednesdays 06:00 UTC: only the zizmor job runs
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to test (default: the commit of the ref the run was started on)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  # a newer push to a branch (testing included) replaces the older run of that ref; only the tip's result matters. A dispatched run is grouped by the
  # commit it tests (inputs.ref), so a push never cancels it and it never cancels a push run.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 1 of the pipeline (the required check): only the OBVIOUS, in about 10 s (.github/scripts/sanity.py): `bash -n` on the shell scripts, a compile of the Python ones and a parse of the workflow files.
  # Stage 2 is the image build on testing, which shows the complicated problems.
  # It runs for every push (a documentation-only one included: it is fast) and for the dispatched `Test of <sha>` runs of the bump workflow.
  test:
    name: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Sanity checks
        run: uv run --frozen --no-dev python -I .github/scripts/sanity.py

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Check Just format
        run: just check

  # The groups of the behavior tests: one per directory under tests/ (tests/{pipeline,supply,image,recipes}/; the directory tree is the only list). The job fails when a
  # tests/*.sh sits outside a group or a group has no *.sh. Not run for the dispatched bump runs, like `suite`.
  plan-tests:
    name: plan-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: List the test groups
        id: plan
        run: uv run --frozen --no-dev python -I .github/scripts/plan_tests.py

  # The behavior tests (tests/<group>/*.sh), one matrix job per group (`suite (<group>)`), on a plain Fedora container (floating tag on purpose: a Fedora change that breaks a
  # script shows here). NOT a required check: it is informative and freely cancelable (a newer push replaces it; a watching agent may cancel it and merge once `test` and
  # `secrets` pass). Not run for the dispatched bump runs (they only need `test` and `secrets`).
  suite:
    name: suite (${{ matrix.group }})
    needs: plan-tests
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan-tests.outputs.groups) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install the tools the tests need
        run: |
          # a plain loop: the repository (and its retry.py) is not checked out yet
          for attempt in 1 2 3; do
            dnf -y install --setopt=install_weak_deps=False --setopt=retries=5 \
              jq git python3 python3-pyyaml gawk \
              findutils diffutils tar gzip curl ca-certificates util-linux shadow-utils binutils nodejs openssl && exit 0
            echo "::warning::dnf install failed (attempt ${attempt}); retrying in 20 s"
            sleep 20
          done
          echo "::error::dnf install failed three times"
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # The container runs as root, but recipes and tests check that they are not run as root (no session bus), so
      # everything after the install runs as an ordinary user, like on the desktop.
      - name: Create the ordinary user the checks run as
        run: |
          useradd --create-home ci
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"
          chown -R ci: "${GITHUB_WORKSPACE}"

      - name: Install the pinned just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Make the pinned just usable by that user
        run: install -m 0755 "$(command -v just)" /usr/bin/just && just --version

      - name: Run every test of the group
        shell: runuser -u ci -- bash {0}
        env:
          GROUP: ${{ matrix.group }}
        run: |
          unset GITHUB_OUTPUT GITHUB_ENV GITHUB_STEP_SUMMARY GITHUB_PATH
          fail=0
          for t in tests/"${GROUP}"/*.sh; do
            if out=$(timeout 600 bash "$t" 2>&1); then echo "PASS $t"; else echo "FAIL $t"; echo "$out"; fail=1; fi
          done
          exit "$fail"

  secrets:
    name: secrets
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan the full history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

  # zizmor (https://github.com/zizmorcore/zizmor) audits .github/workflows and .github/actions for security problems: template injection, excessive permissions,
  # credential persistence (artipacked), unpinned actions, known-vulnerable actions and the like. NOT a required status check (the ruleset is the owner's). Not run for the
  # dispatched bump runs (they only need `test` and `secrets`); runs on pushes and on the weekly schedule.
  # The binary is a pinned release verified by its sha256 (the way the gitleaks job does it); to move it, read the release and replace both lines.
  # A finding that is fixed in the workflow is fixed; one that cannot or should not be fixed gets a narrow, documented entry in .github/zizmor.yml
  # (rule and file and line), never a disabled rule.
  zizmor:
    name: zizmor
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          f="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "${RUNNER_TEMP}/${f}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${f}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${f}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/zizmor"
          tar -xzf "${RUNNER_TEMP}/${f}" -C "${RUNNER_TEMP}/zizmor"
          echo "${RUNNER_TEMP}/zizmor" >> "${GITHUB_PATH}"

      # exits non-zero on any finding; GH_TOKEN lets the online audits (known-vulnerable actions, impostor commits) ask the API
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --version && zizmor --no-progress --config .github/zizmor.yml .github
