name: Prebuilt binaries component
# ONE component of the prebuilt binaries (binaries/<component>), called once per component by binaries.yml (a matrix over
# binaries/components.tsv). It builds the component into its own signed FROM scratch image, pushed to the SAME package as the assembled
# image (ghcr.io/redcodeworks/octarine-os-binaries) under the content tag c-<component>-<key>, where the key is made by
# .github/scripts/binaries-key.sh (the component's directory, lib/ and builder.env: a change to another component does not touch it).
#
# Jobs: check (key, lookup: published and signed under the tag means nothing to build), build (podman build in the pinned builder, layout
# check, push; its steps never fail the job, they record `ok`), sign (environment `signing`), fallback (the component's own last good image,
# tag last-good-<component>, verified and checked against THIS tree's installer), result (binaries-decide.sh: what became of the
# component, uploaded as the artifact binres-<component> for the assemble job). The job fails only for a decision that stops the run: a
# required component that is neither built, reused nor validly fallen back (decided in binaries-decide.sh, with the table in its header).
#
# When the fallback applies (the workflow's `if`, the decision is binaries-decide.sh):
#   required component  only the scheduled daily run on main (the caller passes allow_fallback), as before (Kevin, 2026-11-14)
#   optional component  every PUBLISHING run (testing and main, not an own validation run): last good image if one exists, else the component
#                       is left out of the image (status absent); an optional component never blocks an image build
#   rehearsal           a dispatch with fallback_dry_run reports the decision on any branch and changes nothing
# The loud annotation and the issue come from binaries.yml's track job, on main only.
on:
  workflow_call:
    secrets:
      SIGNING_SECRET:
        description: "the cosign private key of the images (the sign job needs it)"
        required: false
    inputs:
      component:
        description: "the component name (a directory of binaries/ and a line of binaries/components.tsv)"
        type: string
        required: true
      optional:
        description: "true for an optional component (binaries/components.tsv)"
        type: boolean
        default: false
      allow_fallback:
        description: "true on the scheduled daily build: a failed build of a REQUIRED component on main may fall back to its last good image"
        type: boolean
        default: false
      validate_only:
        description: "Validation: ignore the reuse shortcut and build again; publish, sign and track nothing"
        type: boolean
        default: false
      simulate:
        description: "Rehearsal: comma separated components (or all) whose build fails on purpose (a dispatch only)"
        type: string
        default: ""
      fallback_dry_run:
        description: "Rehearsal: when the build failed, run the fallback checks on the last good image and report; never publishes or uses it"
        type: boolean
        default: false

env:
  IMAGE_NAME: octarine-os-binaries
  COMPONENT: ${{ inputs.component }}

jobs:
  check:
    name: Look for the ${{ inputs.component }} image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      tag: ${{ steps.key.outputs.tag }}
      image: ${{ steps.key.outputs.image }}
      usable: ${{ steps.final.outputs.usable }}
      nopublish: ${{ steps.final.outputs.nopublish }}
      knownfail: ${{ steps.final.outputs.knownfail }}
      digest: ${{ steps.lookup.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Content key of the component
        id: key
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          key=$(.github/scripts/binaries-key.sh "${COMPONENT}")
          echo "key=${key}" >> "${GITHUB_OUTPUT}"
          echo "tag=c-${COMPONENT}-${key}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Published and signed already?
        id: lookup
        env:
          IMAGE: ${{ steps.key.outputs.image }}
          TAG: ${{ steps.key.outputs.tag }}
        run: .github/scripts/binaries-lookup.sh "${IMAGE}" "${TAG}"

      # A failed BUILD of an OPTIONAL component is remembered per content key AND ISO week (an Actions cache entry that only has to exist, nothing in it is
      # used): a later push with the SAME key in the same week does not build it again (about 3.5 minutes of the critical path of every run while the component
      # is broken); the daily scheduled run, any change of the component (a new key) and the next week (the week is in the key: a time limit) try again. Only a failure
      # of the build step itself is remembered, never a push or network failure of the run (so one hiccup cannot make testing ship without the component).
      - name: Week of the failure marker
        id: week
        if: inputs.optional
        run: echo "w=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Did this exact key fail before (this week)?
        id: knownfail
        if: inputs.optional
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/known-fail
          key: known-fail-${{ inputs.component }}-${{ steps.key.outputs.key }}-${{ steps.week.outputs.w }}
          lookup-only: true

      # a rehearsal of a failed build must not be short-circuited by an existing signed image of this key
      - name: Usable (not for a rehearsal)
        id: final
        env:
          LOOKUP: ${{ steps.lookup.outputs.usable }}
          SIMULATE_LIST: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate || '' }}
          # github.workflow is the top-level workflow's name, also in a nested call: true only for binaries.yml's own runs
          OWN: ${{ github.workflow == 'Prebuilt binaries' }}
          EVENT: ${{ github.event_name }}
          VALIDATE_ONLY: ${{ inputs.validate_only == true }}
          OPTIONAL: ${{ inputs.optional }}
          KNOWN_FAIL_HIT: ${{ steps.knownfail.outputs.cache-hit }}
        run: |
          usable=${LOOKUP}
          [[ "${KNOWN_FAIL_HIT}" != true ]] || echo "::warning::${COMPONENT}: this exact key failed to BUILD earlier this week and is not built again on a push (the daily run, a change of the component or the next week retry): an image built from this commit leaves ${COMPONENT} out unless an older good one exists"
          simulate=false
          if [[ "${SIMULATE_LIST}" == all || "${SIMULATE_LIST}" == true || ",${SIMULATE_LIST// /}," == *",${COMPONENT},"* ]]; then simulate=true; fi
          # own push and schedule runs and validate_only never publish; the schedule run and validate_only also ignore the reuse shortcut
          nopublish=false force=false
          if [[ "${OWN}" == true && ( "${EVENT}" == push || "${EVENT}" == schedule ) ]]; then nopublish=true; fi
          if [[ "${VALIDATE_ONLY}" == true || ( "${OWN}" == true && "${EVENT}" == schedule ) ]]; then nopublish=true; force=true; fi
          [[ "${simulate}" != true ]] || force=true
          [[ "${force}" != true ]] || { usable=false; echo "validation or rehearsal: the reuse is skipped"; }
          echo "usable=${usable}" >> "${GITHUB_OUTPUT}"
          echo "nopublish=${nopublish}" >> "${GITHUB_OUTPUT}"
          echo "simulate=${simulate}" >> "${GITHUB_OUTPUT}"
          # skip a build that failed before with this same key: optional components only, never the daily schedule, a rehearsal or a validation
          knownfail=false
          if [[ "${OPTIONAL}" == true && "${KNOWN_FAIL_HIT}" == true && "${usable}" != true && "${EVENT}" != schedule && "${simulate}" != true && "${VALIDATE_ONLY}" != true ]]; then knownfail=true; fi
          echo "knownfail=${knownfail}" >> "${GITHUB_OUTPUT}"
          echo "usable=${usable} nopublish=${nopublish} force=${force} simulate=${simulate} knownfail=${knownfail}"

  build:
    name: Build the ${{ inputs.component }} image
    needs: check
    if: needs.check.outputs.usable != 'true' && needs.check.outputs.knownfail != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      ok: ${{ steps.record.outputs.ok }}
      published: ${{ steps.channel.outputs.publish }}
      digest: ${{ steps.push.outputs.digests }}
      started: ${{ steps.started.outputs.at }}
    steps:
      - name: Note the start time
        id: started
        run: echo "at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Choose channel
        id: channel
        env:
          REF: ${{ github.ref }}
          NOPUBLISH: ${{ needs.check.outputs.nopublish }}
        run: |
          publish=false
          case "${REF}" in
            refs/heads/main | refs/heads/testing) publish=true ;;
          esac
          [[ "${NOPUBLISH}" != true ]] || publish=false
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish} (only testing and main publish; any other ref builds for validation)"

      # Downloaded dependencies only (never dnf packages, never compiled output): the verified-on-use package cache of the Ghostty build (its fetch phase is
      # about 22 percent of the job). The cache is an optimisation: build.sh trusts nothing in it (every package is re-hashed and compared with the hash the
      # pinned source expects, a mismatch is discarded and downloaded), and an empty cache builds as before. Saved only by runs that publish (push to testing or main).
      - name: Key of the dependency cache
        id: depkey
        run: |
          mkdir -p "${RUNNER_TEMP}/dep-cache"
          echo "key=$(.github/scripts/binaries-dep-key.sh "${COMPONENT}")" >> "${GITHUB_OUTPUT}"

      - name: Restore the dependency cache
        id: depcache
        if: steps.depkey.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dep-cache
          key: dep-${{ inputs.component }}-${{ steps.depkey.outputs.key }}

      # The build and the layout check. A failure here must not fail the job (a handled degradation keeps the whole run green):
      # the step is continue-on-error and the record step says whether it worked; binaries-decide.sh decides what a failure means.
      - name: Build
        id: build
        continue-on-error: true
        env:
          KEY: ${{ needs.check.outputs.key }}
          TAG: ${{ needs.check.outputs.tag }}
          SIMULATE_LIST: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate || '' }}
        run: |
          set -euo pipefail
          if [[ "${SIMULATE_LIST}" == all || "${SIMULATE_LIST}" == true || ",${SIMULATE_LIST// /}," == *",${COMPONENT},"* ]]; then
            echo "::error::simulated build failure of ${COMPONENT} (simulate_build_failure)"
            exit 1
          fi
          builder=$(sed -n 's/^BUILDER=//p' binaries/builder.env)
          [[ "${builder}" =~ ^registry\.fedoraproject\.org/fedora:[0-9]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::binaries/builder.env has no digest-pinned BUILDER"; exit 1; }
          podman build \
            --volume "${RUNNER_TEMP}/dep-cache:/dep-cache" \
            --build-arg "BUILDER=${builder}" \
            --build-arg "IMAGE_VERSION=${KEY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.octarineos.binaries-component-key=${KEY}" \
            --tag "${IMAGE_NAME}:${TAG}" \
            --file "binaries/${COMPONENT}/Containerfile" binaries
          id=$(podman create "${IMAGE_NAME}:${TAG}" /nonexistent)
          podman export "${id}" | tar -t > "${RUNNER_TEMP}/listing.txt"
          podman rm "${id}" > /dev/null
          .github/scripts/binaries-layout.sh "${RUNNER_TEMP}/listing.txt" binaries/scx/schedulers.tsv "${COMPONENT}"

      - name: Login to GitHub Container Registry
        if: steps.build.outcome == 'success' && steps.channel.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One push under the content tag: one manifest digest, which the signature belongs to
      - name: Push
        id: push
        if: steps.build.outcome == 'success' && steps.channel.outputs.publish == 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
          IMAGE: ${{ needs.check.outputs.image }}
        run: .github/scripts/push-tags.sh "${IMAGE_NAME}:${TAG}" "${IMAGE}" "${TAG}"

      - name: Save the dependency cache
        if: steps.build.outcome == 'success' && steps.channel.outputs.publish == 'true' && steps.depkey.outputs.key != '' && steps.depcache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dep-cache
          key: dep-${{ inputs.component }}-${{ steps.depkey.outputs.key }}

      - name: Record whether the build worked
        id: record
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUBLISH: ${{ steps.channel.outputs.publish }}
        run: |
          ok=false
          if [[ "${BUILD_OUTCOME}" == success && ( "${PUBLISH}" != true || "${PUSH_OUTCOME}" == success ) ]]; then ok=true; fi
          echo "ok=${ok}" >> "${GITHUB_OUTPUT}"
          [[ "${ok}" == true ]] || echo "::warning::the ${COMPONENT} build did not succeed (build ${BUILD_OUTCOME}, push ${PUSH_OUTCOME}): binaries-decide.sh decides what that means"

      # only when the BUILD STEP failed (a push or network failure after a good build is not a verdict on the component), and the key carries the week
      - name: Remember the failure of this key (optional components, not on pull requests)
        if: always() && steps.build.outcome == 'failure' && inputs.optional && github.event_name != 'pull_request'
        run: mkdir -p "${RUNNER_TEMP}/known-fail" && date -u +%Y-%m-%dT%H:%M:%SZ > "${RUNNER_TEMP}/known-fail/failed"

      - name: Week of the failure marker
        id: week
        if: always() && steps.build.outcome == 'failure' && inputs.optional && github.event_name != 'pull_request'
        run: echo "w=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Save the failure marker
        if: always() && steps.build.outcome == 'failure' && inputs.optional && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/known-fail
          key: known-fail-${{ inputs.component }}-${{ needs.check.outputs.key }}-${{ steps.week.outputs.w }}

  sign:
    name: Sign the ${{ inputs.component }} image
    needs: [check, build]
    if: needs.build.result == 'success' && needs.build.outputs.ok == 'true' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    environment: signing
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.sign.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Sign and verify
        id: sign
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.check.outputs.image }}
          TAG: ${{ needs.check.outputs.tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No pushed digest to sign"; exit 1; }
          # the old bundle format, as for the images (https://github.com/containers/container-libs/issues/388)
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify --key cosign.pub "${IMAGE}:${TAG}" > /dev/null
          echo "signed: ${IMAGE}:${TAG} = ${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  # The component's own fallback: only after a failed BUILD of this component (not a failed signing, not a failed lookup). The
  # step may fail (no last good image yet, a signature or layout refusal) without failing the job: binaries-decide.sh reads the outcome.
  fallback:
    name: Last good ${{ inputs.component }} image
    needs: [check, build]
    if: >-
      always() && needs.check.result == 'success' && needs.build.result == 'success' && needs.build.outputs.ok == 'false' &&
      ((inputs.optional && needs.check.outputs.nopublish != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')) ||
       (inputs.allow_fallback && github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.fallback_dry_run))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      ok: ${{ steps.record.outputs.ok }}
      digest: ${{ steps.pick.outputs.digest }}
      key: ${{ steps.pick.outputs.key }}
      created: ${{ steps.pick.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and check the last good image
        id: pick
        continue-on-error: true
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          # an optional component without a last good image yet is expected, not an error
          FALLBACK_REFUSAL_LEVEL: ${{ inputs.optional && 'warning' || 'error' }}
        run: .github/scripts/binaries-fallback.sh "${IMAGE}" "last-good-${COMPONENT}" "${COMPONENT}" binaries/scx/schedulers.tsv build_files/install-binaries.sh

      - name: Record
        id: record
        if: always()
        env:
          PICK: ${{ steps.pick.outcome }}
        run: echo "ok=$([[ "${PICK}" == success ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

  result:
    name: Result of ${{ inputs.component }}
    needs: [check, build, sign, fallback]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          OPTIONAL: ${{ inputs.optional }}
          CHECK: ${{ needs.check.result }}
          USABLE: ${{ needs.check.outputs.usable }}
          CHECK_DIGEST: ${{ needs.check.outputs.digest }}
          KEY: ${{ needs.check.outputs.key }}
          BUILD: ${{ needs.build.result == 'skipped' && needs.check.outputs.usable == 'true' && 'success' || needs.build.result }}
          BUILD_OK: ${{ needs.build.outputs.ok }}
          PUBLISHED: ${{ needs.build.outputs.published }}
          SIGN: ${{ needs.sign.result }}
          SIGN_DIGEST: ${{ needs.sign.outputs.digest }}
          FALLBACK: ${{ needs.fallback.result }}
          FB_OK: ${{ needs.fallback.outputs.ok }}
          KNOWN_FAIL: ${{ needs.check.outputs.knownfail }}
          FB_DIGEST: ${{ needs.fallback.outputs.digest }}
          FB_KEY: ${{ needs.fallback.outputs.key }}
          FB_CREATED: ${{ needs.fallback.outputs.created }}
          DRY_RUN: ${{ inputs.fallback_dry_run == true }}
          EVENT: ${{ github.event_name }}
          RESULT_DIR: ${{ runner.temp }}/binres
        run: .github/scripts/binaries-decide.sh

      - name: Hand the result to the assemble job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binres-${{ inputs.component }}
          path: ${{ runner.temp }}/binres/${{ inputs.component }}.tsv
          if-no-files-found: ignore
          retention-days: 3
