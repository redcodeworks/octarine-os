---
name: Roll back latest
# The sanctioned way to put the `latest` of ONE image (the default image octarine-os, the dx image octarine-os-dx or the gx image octarine-os-gx) back on an OLDER dated build of that
# same image. Publish latest (publish-latest.yml) never moves `latest` backwards; this workflow does, on purpose, by hand: a dispatch on main with the
# image and its dated tag. Each image is rolled back on its own (the images publish independently); modelled on Bazzite's retag workflow (a re-point of
# the tags from an old tag with a short cancel window).
#
#   image     default, dx or gx: the image whose `latest` moves back (nothing else moves)
#   tag       the dated tag of THAT image (latest-<sha7>, latest-<date>-<sha7> or <date>-<sha7>); testing-* and latest are refused
#   reason    free text (required), goes into the summary
#   dry_run   true (default): plan and report only, nothing is written
#
# What is the same as publish-latest.yml, because it is the same script (publish-latest.sh with ALLOW_BACKWARDS=true): the signature is verified before
# anything moves (cosign.pub), a dx or gx image must stand on a signed default image built from main, a default image was built from main, the digest is
# preserved (skopeo copy --all --preserve-digests, the tag read back), nothing is signed (so no `signing` environment), nothing is written on any ref but
# main, one move at a time per image (the same concurrency group as publish-latest). New: the first job is a 30-second cancel window (cancel the run in that
# time and nothing happens). The next green build of that image on main moves its `latest` forward again: roll back, then fix main, or hold the daily build.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image's latest moves back"
        type: choice
        options:
          - default
          - dx
          - gx
        default: default
      tag:
        description: "Dated tag of that image to roll back to (latest-<sha7>, latest-<date>-<sha7>, <date>-<sha7>)"
        type: string
        required: true
      reason:
        description: "Why (free text, required)"
        type: string
        required: true
      dry_run:
        description: "Plan and report only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  window:
    name: Cancel window
    runs-on: ubuntu-26.04
    steps:
      - name: Say what is about to happen, then wait 30 seconds (cancel the run to stop it)
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
          DRY: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Roll back latest"
            echo "- image: ${IMAGE}, tag: \`${TAG}\` (only that image's latest moves)"
            echo "- reason: ${REASON}"
            echo "- dry run: ${DRY}; ref: ${REF} (anything but main only plans)"
            [[ "${DRY}" == true ]] || echo "- **Cancel this run within 30 seconds to stop it.**"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${DRY}" == true ]]; then echo "dry run: no wait"; else sleep 30; fi

  rollback:
    name: Move latest back
    needs: window
    runs-on: ubuntu-26.04
    # the same group as publish-latest.yml for this image: one move of its latest at a time, a running one is never cancelled
    concurrency:
      group: publish-latest-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout with the full history (the main commit of an image is checked against it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Verify the image and move its latest back
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_BACKWARDS: "true"
          # writes only on main; any other ref is a dry run whatever the input says
          WRITE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          [[ -n "${TAG}" && -n "${REASON}" ]] || { echo "::error::tag and reason are required"; exit 1; }
          .github/scripts/publish-latest.sh
