---
name: Build dx image
# The developer image (ghcr.io/<owner>/octarine-os-dx): the published default image plus the developer toolchain of the
# owner's dev-toolbox, in three channels that follow the default image's own:
#   octarine-os:testing  -> octarine-os-dx:testing   (called by "Build container image" on `testing`)
#   octarine-os:latest   -> octarine-os-dx:latest    (called by "Build container image" on `main`: promotes the tested testing
#                                                     image when base digest and dx inputs match, else builds)
#   octarine-os:beta     -> octarine-os-dx:beta      (called by "Build beta image" on `main`)
# A REUSABLE workflow (workflow_call), called by build.yml and build-beta.yml AFTER their base jobs succeeded (one-way
# `needs`: the base never depends on dx). It runs the version of this file that is on the branch being built, so a change
# here is tried on `testing` like every other pipeline change. It is also kept as a manual dispatch on `main` (latest or
# beta, optionally forced). It never runs for pull requests or feature branches: every job has the plan job's guard. The plan
# job (.github/scripts/plan-dx.sh) resolves the base digest, verifies its signature and skips, promotes or builds by
# comparing the published image's labels (base digest and dx-inputs) with the current ones. Tags: `<channel>` and
# `<channel>-<date>-<sha>` (testing: `testing` and `testing-<sha>`), signed with the repository key in the `signing`
# environment (the caller passes `secrets: inherit`). The REQUIRED check `Build dx and push image` is NOT here: the job
# checks of a called workflow are named `<caller job> / <job>`, so build.yml has the aggregate job of that exact name. This
# workflow ends with `collect`, which hands the job results to the caller. Design in CLAUDE.md ("dx image").
on:
  workflow_call:
    inputs:
      channel:
        description: "Channel to build: testing (ref testing), latest or beta (ref main)"
        type: string
        required: true
      force:
        description: "Build even when the base digest is unchanged"
        type: boolean
        default: false
    outputs:
      plan:
        description: "Result of the plan job"
        value: ${{ jobs.collect.outputs.plan }}
      build_wanted:
        description: "Plan output: build"
        value: ${{ jobs.collect.outputs.build_wanted }}
      promote_wanted:
        description: "Plan output: promote"
        value: ${{ jobs.collect.outputs.promote_wanted }}
      build:
        description: "Result of the build job"
        value: ${{ jobs.collect.outputs.build }}
      promote:
        description: "Result of the promote job"
        value: ${{ jobs.collect.outputs.promote }}
      sign:
        description: "Result of the sign job"
        value: ${{ jobs.collect.outputs.sign }}
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to build"
        type: choice
        options:
          - latest
          - beta
        default: latest
      force:
        description: "Build even when the base digest is unchanged"
        type: boolean
        default: false

env:
  CHANNEL: ${{ inputs.channel }}
  FORCE: ${{ inputs.force || false }}

# One group per channel, shared with the earlier workflow_run version of this workflow (it used the same names, so during
# the transition the two serialize); a run that is already building is never cancelled (a newer trigger waits, only one can wait)
concurrency:
  group: build-dx-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan the dx build
    # Only for a push, schedule or dispatch of `main` (latest, beta) or `testing` (testing): never a pull request or a feature
    # branch (a called workflow inherits the caller's event and ref); the channel must belong to the ref
    if: >-
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) &&
      ((github.ref == 'refs/heads/testing' && inputs.channel == 'testing') ||
      (github.ref == 'refs/heads/main' && contains(fromJSON('["latest","beta"]'), inputs.channel)))
    runs-on: ubuntu-26.04

    outputs:
      build: ${{ steps.plan.outputs.build }}
      promote: ${{ steps.plan.outputs.promote }}
      channel: ${{ steps.plan.outputs.channel }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      dx_inputs: ${{ steps.plan.outputs.dx_inputs }}
      source_tag: ${{ steps.plan.outputs.source_tag }}
      source_digest: ${{ steps.plan.outputs.source_digest }}

    permissions:
      contents: read
      packages: read

    steps:
      # The commit being built (the caller's: the pushed commit, or the tip of main); history for the promotion search
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Reads of a package that is not public yet need the token; harmless when it is public
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Resolve the base, verify it, compare with the published dx image, look for a tested one
        id: plan
        run: .github/scripts/plan-dx.sh

  build:
    name: Build dx image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04

    outputs:
      image: ${{ steps.names.outputs.image }}
      digests: ${{ steps.push.outputs.digests }}
      alias_tags: ${{ steps.tags.outputs.alias_tags }}

    permissions:
      contents: read
      packages: write

    env:
      BASE_DIGEST: ${{ needs.plan.outputs.base_digest }}
      BASE_TAG: ${{ needs.plan.outputs.base_tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      DX_INPUTS: ${{ needs.plan.outputs.dx_inputs }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Check Just Syntax
        run: |
          just check

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BASE_IMAGE=ghcr.io/${owner}/octarine-os" >> "${GITHUB_ENV}"
          echo "DX_IMAGE=ghcr.io/${owner}/octarine-os-dx" >> "${GITHUB_ENV}"
          echo "image=ghcr.io/${owner}/octarine-os-dx" >> "${GITHUB_OUTPUT}"

      # The shared developer package list is pinned by digest in the Containerfile: format check, then the signature
      - name: Check the dev-packages pin
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^ARG DEV_PACKAGES_TAG=//p' variants/dx/Containerfile)
          digest=$(sed -n 's/^ARG DEV_PACKAGES_DIGEST=//p' variants/dx/Containerfile)
          [[ "${tag}" =~ ^(latest|latest-[0-9]{8}-[0-9a-f]{7})$ ]] || { echo "::error::DEV_PACKAGES_TAG missing or not latest or latest-YYYYMMDD-<sha> in variants/dx/Containerfile"; exit 1; }
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::DEV_PACKAGES_DIGEST missing or not sha256:<64 hex> in variants/dx/Containerfile"; exit 1; }
          ref="ghcr.io/redcodeworks/dev-packages@${digest}"
          cosign verify --key keys/redcodeworks-toolbox-cosign.pub "${ref}" > /dev/null
          echo "dev-packages pinned: ${tag} ${ref} (signature valid)"
          echo "DEV_PACKAGES_REF=${ref}" >> "${GITHUB_ENV}"

      # The digest comes from the plan job; verify it again here, then pull it and read its kernel
      - name: Verify and pull the base image, read its kernel
        run: |
          set -euo pipefail
          [[ "${BASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::The plan job gave no base digest"; exit 1; }
          cosign verify --key cosign.pub "${BASE_IMAGE}@${BASE_DIGEST}" > /dev/null
          echo "Base image ${BASE_IMAGE}:${BASE_TAG} = ${BASE_DIGEST} (signature valid)"
          podman pull "${BASE_IMAGE}@${BASE_DIGEST}" > /dev/null
          kernel=$(podman run --rm "${BASE_IMAGE}@${BASE_DIGEST}" rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core)
          echo "Kernel of the base image: ${kernel}"
          echo "BASE_KERNEL=${kernel}" >> "${GITHUB_ENV}"

      # The same label set as `just build`, set explicitly (nothing about the base's maintainers is inherited); the labels
      # that describe the base image's own build are unset, the rechunk step passes the rest on
      - name: Build the image
        run: |
          set -euo pipefail
          set -a; . ./image-template.env; set +a
          version=$(.github/scripts/image-version.sh)
          sha=$(git rev-parse HEAD)
          # os-release IMAGE_VERSION: this build's version, `beta-` prefixed on the beta channel (never promoted)
          os_version="${version}"
          [[ "${CHANNEL}" != beta ]] || os_version="beta-${version}"
          podman build -f variants/dx/Containerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "BASE_TAG=${BASE_TAG}" \
            --build-arg "BASE_DIGEST=${BASE_DIGEST}" \
            --build-arg "IMAGE_VERSION=${os_version}" \
            --unsetlabel io.github.redcodeworks.octarine-os.base-index-digest \
            --unsetlabel io.github.redcodeworks.octarine-os.vanilla-inputs \
            --unsetlabel org.opencontainers.image.maintainer \
            --unsetlabel org.opencontainers.image.authors \
            --unsetlabel io.artifacthub.package.maintainers \
            --label "org.opencontainers.image.title=octarine-os-dx" \
            --label "org.opencontainers.image.description=octarineOS with the developer toolchain of dev-toolbox, VM tooling and tracing tools (developer image, ${CHANNEL} channel)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.vendor=${REPO_ORGANIZATION}" \
            --label "org.opencontainers.image.revision=${sha}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY}/tree/${sha:0:7}" \
            --label "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha:0:7}/README.md" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}:${BASE_TAG}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --label "io.github.redcodeworks.octarine-os.dx-tree=$(git rev-parse HEAD:variants/dx)" \
            --label "io.github.redcodeworks.octarine-os.dx-inputs=${DX_INPUTS}" \
            --label "io.github.redcodeworks.octarine-os.dev-packages=${DEV_PACKAGES_REF}" \
            --label "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha:0:7}/README.md" \
            --label "io.artifacthub.package.deprecated=false" \
            --label "io.artifacthub.package.keywords=${IMAGE_KEYWORDS},developer" \
            --label "io.artifacthub.package.license=Apache-2.0" \
            --label "io.artifacthub.package.logo-url=${IMAGE_LOGO_URL}" \
            --label "io.artifacthub.package.prerelease=false" \
            --tag "octarine-os-dx:${CHANNEL}" .
          echo "Built octarine-os-dx:${CHANNEL} from ${BASE_IMAGE}@${BASE_DIGEST} (${BASE_TAG}), dx inputs ${DX_INPUTS}"

      - name: Check image size
        env:
          MAX_IMAGE_GIB: 15
        run: |
          size=$(podman image inspect "octarine-os-dx:${CHANNEL}" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MiB (limit $((MAX_IMAGE_GIB * 1024)) MiB)"
          if (( size > MAX_IMAGE_GIB * 1024 * 1024 * 1024 )); then
            echo "::error::The image is larger than ${MAX_IMAGE_GIB} GiB; check what was added"
            exit 1
          fi

      # Anything missing fails the build before anything is pushed
      - name: Smoke test the image
        run: |
          podman run --rm -e BASE_KERNEL="${BASE_KERNEL}" -e IMAGE_CHANNEL="${CHANNEL}" -v "${PWD}/.github/scripts/dx-smoke.sh:/smoke.sh:ro" \
            "octarine-os-dx:${CHANNEL}" bash /smoke.sh

      - name: Rechunk with rpm-ostree
        run: |
          just ostree-rechunk octarine-os-dx "${CHANNEL}"

      - name: Check the version is channel-neutral
        run: |
          # the labels plus os-release IMAGE_VERSION of the rechunked image (a beta build's must start with beta-)
          {
            podman image inspect "octarine-os-dx:${CHANNEL}" \
              | jq -r '.[0].Config.Labels // {} | to_entries[] | "\(.key)=\(.value)"'
            podman run --rm "octarine-os-dx:${CHANNEL}" sh -c '. /etc/os-release && echo "IMAGE_VERSION=${IMAGE_VERSION:-}"'
          } | BETA=$([[ "${CHANNEL}" == beta ]] && echo true || echo false) .github/scripts/check-version-neutral.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only `<channel>` and `<channel>-<date>-<sha>` are pushed; the testing channel pushes `testing` and `testing-<sha>`
      # (the tag the promotion search and the prune rule look for)
      - name: Tags
        id: tags
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          if [[ "${CHANNEL}" == testing ]]; then
            alias_tags="testing-${sha} testing"
          else
            alias_tags="${CHANNEL}-$(date +%Y%m%d)-${sha} ${CHANNEL}"
          fi
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Push to GHCR
        id: push
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # One push, the other tag is a registry-side copy of its digest (one manifest digest for every tag)
          .github/scripts/push-tags.sh "octarine-os-dx:${CHANNEL}" "${DX_IMAGE}" ${ALIAS_TAGS}

  # Build once, promote: retag the tested and signed testing image as latest and its dated alias, no rebuild. The digest
  # is compared before and after every copy; the signature belongs to the digest and is verified by the sign job.
  promote:
    name: Promote tested dx image
    needs: plan
    if: needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.tags.outputs.image }}
      digests: ${{ needs.plan.outputs.source_digest }}
      alias_tags: ${{ steps.tags.outputs.alias_tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/octarine-os-dx" >> "${GITHUB_OUTPUT}"
          alias_tags="latest-$(date +%Y%m%d)-$(git rev-parse --short=7 HEAD) latest"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Retag the tested digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/octarine-os-dx
          SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
          SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          export IMAGE
          lookup=.github/scripts/registry-digest.sh
          now=$("${lookup}" "${SOURCE_TAG}")
          [[ "${now}" == "${SOURCE_DIGEST}" ]] || { echo "::error::${SOURCE_TAG} is ${now}, the plan saw ${SOURCE_DIGEST}"; exit 1; }
          for tag in ${ALIAS_TAGS}; do
            skopeo copy --all --preserve-digests "docker://${IMAGE}:${SOURCE_TAG}" "docker://${IMAGE}:${tag}"
            after=$("${lookup}" "${tag}")
            [[ "${after}" == "${SOURCE_DIGEST}" ]] || { echo "::error::${tag} is ${after}, expected ${SOURCE_DIGEST}"; exit 1; }
            echo "promoted ${tag} -> ${after}"
          done

  sign:
    name: Sign and verify dx image
    needs: [build, promote]
    if: always() && (needs.build.result == 'success' || needs.promote.result == 'success')
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      # Promote path: the digest was signed when the testing image was published; check it, never sign it again
      - name: Verify the digest that was promoted is signed
        if: needs.promote.result == 'success'
        env:
          IMAGE: ${{ needs.promote.outputs.image }}
          DIGESTS: ${{ needs.promote.outputs.digests }}
        run: |
          set -euo pipefail
          for digest in ${DIGESTS}; do
            cosign verify --key cosign.pub "${IMAGE}@${digest}" > /dev/null
            echo "signed: ${digest}"
          done

      - name: Sign every pushed digest
        if: needs.build.result == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          [[ -n "${DIGESTS// /}" ]] || { echo "::error::No pushed digests to sign"; exit 1; }
          # old bundle format, as in build.yml (https://github.com/containers/container-libs/issues/388)
          for digest in ${DIGESTS}; do
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          done

      - name: Verify every pushed tag is signed
        env:
          IMAGE: ${{ needs.build.outputs.image || needs.promote.outputs.image }}
          ALIAS_TAGS: ${{ needs.build.outputs.alias_tags || needs.promote.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            cosign verify --key cosign.pub "${IMAGE}:${tag}" > /dev/null
            echo "signed: ${tag}"
          done

  # Last in the graph, always runs: hands the job results and the plan decision to the caller, whose aggregate job
  # `Build dx and push image` (build.yml) applies .github/scripts/aggregate-dx.sh to them. It cannot be that job itself:
  # a called workflow's job checks are named `<caller job> / <job>`, and the required check name must be exact.
  collect:
    name: Collect the dx results
    needs: [plan, build, promote, sign]
    if: always()
    runs-on: ubuntu-26.04
    outputs:
      plan: ${{ needs.plan.result }}
      build_wanted: ${{ needs.plan.outputs.build }}
      promote_wanted: ${{ needs.plan.outputs.promote }}
      build: ${{ needs.build.result }}
      promote: ${{ needs.promote.result }}
      sign: ${{ needs.sign.result }}
    steps:
      - name: Report
        run: echo "plan=${{ needs.plan.result }} build=${{ needs.build.result }} promote=${{ needs.promote.result }} sign=${{ needs.sign.result }}"
