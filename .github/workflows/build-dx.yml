---
name: Build dx image
run-name: dx ${{ inputs.channel }} ${{ inputs.sha || github.sha }}
# The developer image (ghcr.io/<owner>/octarine-os-dx): the published default image plus the developer toolchain of the
# owner's dev-toolbox, in two channels that follow the default image's own:
#   octarine-os:testing  -> octarine-os-dx:testing   (dispatched by "Build container image" on `testing`)
#   octarine-os:latest   -> octarine-os-dx:latest    (dispatched by "Build container image" on `main`: promotes the tested testing
#                                                     image when base digest and dx inputs match, else builds)
# A SEPARATE workflow that is started by the last job of those pipelines (`gh workflow run build-dx.yml --ref <ref> -f
# channel=<channel> -f sha=<built commit>`, .github/scripts/dispatch-dx.sh) after the base succeeded, and that can be re-run on
# its own. A dispatched run uses the file of the ref it was dispatched on and is recorded on that branch, so a change here runs
# on `testing` before it is promoted and the README can show a dx badge per branch. It never runs for pull requests or feature
# branches (the plan job's guard). `sha` is the commit the pipeline built: the ref may have moved on since, so every job checks
# out exactly that commit, and the plan job refuses a commit that is not an ancestor of the ref. The plan job
# (.github/scripts/plan-dx.sh) resolves the base digest, verifies its signature and skips, promotes or builds by comparing the
# published image's labels (base digest and dx-inputs) with the current ones. Tags: `<channel>` and `<channel>-<date>-<sha>`
# (testing: `testing` and `testing-<sha>`), signed with the repository key in the `signing` environment. The aggregate job is the
# check `Build dx and push image` ONLY when the built commit is the tip of the ref (otherwise it is named `Build dx (older
# commit)`, so a green check can never appear on a commit whose own dx build has not run); the commit status of the same
# name is always posted on the built commit and is what a pull request into main can rely on. Design in CLAUDE.md ("dx image").
# This file is the THIN CALLER: plan, build, promote and sign are the reusable dx-image.yml (shared with build-nvidia-dx.yml); the triggers, the
# concurrency group, the run-name (dispatch-dx.sh finds the run by it), the result job with its required name and commit status, `publish` and
# `alert` stay here, because only this workflow may post the context `Build dx and push image`.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to build: testing (ref testing) or latest (ref main)"
        type: choice
        options:
          - testing
          - latest
        default: latest
      sha:
        description: "Commit to build (default: the tip of the ref); the pipeline passes the commit it just built"
        type: string
        default: ""
      base_digest:
        description: "Channel latest on main: the digest of the default image this run is built on (the pipeline passes the one it just published); empty = no new default image"
        type: string
        default: ""
      force:
        description: "Build even when the base digest is unchanged"
        type: boolean
        default: false
      dry_run:
        description: "Plan and report only: nothing is built, pushed or signed, no commit status is posted"
        type: boolean
        default: false

env:
  SHA: ${{ inputs.sha || github.sha }}

# testing: one group per channel and a newer run CANCELS the older one (a superseded tip needs no dx image; the newest tip's run is the one that
# counts, and a cancelled run posts no commit status, see the status step). latest on main: one group per COMMIT and never cancelled, because with
# one group a third run would cancel the PENDING second one, silently dropping a default image that then never gets its dx pair; runs of different
# commits build side by side and Publish latest serializes the moves
concurrency:
  group: build-dx-${{ inputs.dry_run && 'dry-' || '' }}${{ inputs.channel == 'latest' && format('latest-{0}', inputs.sha || github.sha) || inputs.channel }}
  cancel-in-progress: ${{ inputs.channel == 'testing' }}

permissions:
  contents: read

jobs:
  # plan, build, promote and sign: the reusable workflow (see its header). Only `testing` (channel testing) or `main` (channel latest) run it: never a
  # feature branch; a dispatch is the only trigger. The signing key is the `signing` environment secret of its sign job.
  dx:
    name: dx
    if: >-
      (github.ref == 'refs/heads/testing' && inputs.channel == 'testing') ||
      (github.ref == 'refs/heads/main' && inputs.channel == 'latest')
    uses: ./.github/workflows/dx-image.yml
    permissions:
      contents: read
      packages: write
    with:
      base_name: octarine-os
      dx_name: octarine-os-dx
      channel: ${{ inputs.channel }}
      sha: ${{ inputs.sha || github.sha }}
      base_digest: ${{ inputs.base_digest }}
      force: ${{ inputs.force }}
      dry_run: ${{ inputs.dry_run }}
      promote_from_testing: true
      tags: ${{ inputs.channel == 'testing' && 'testing-{sha} testing' || 'latest-{date}-{sha}' }}
      description: octarineOS with the developer toolchain of dev-toolbox, VM tooling and tracing tools (developer image, ${{ inputs.channel }} channel)

  # The one result of a run, last in the graph (plan -> build or promote -> sign -> this); always runs. Green when the dx
  # image was built, promoted or legitimately skipped (base and dx inputs unchanged). It is the required check
  # `Build dx and push image` only when the built commit is the tip of the ref the run was dispatched on (a check run attaches to
  # that tip): for an older commit it is named `Build dx (older commit)`, so a green check never appears on a commit whose
  # own dx build has not run. The commit status of the same name on the BUILT commit is always posted (a pull request into
  # main can require it; both come from this one result, so they never disagree). A plan that was skipped (a ref or channel
  # that dx is not built for) posts nothing.
  dx_result:
    # a dry run never carries the required name (it must not satisfy the check on the tip)
    name: ${{ inputs.dry_run && 'Build dx (dry run)' || ((inputs.sha || github.sha) == github.sha && 'Build dx and push image' || 'Build dx (older commit)') }}
    needs: dx
    if: always()
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the dx result
        id: result
        env:
          # a skipped call (not a ref and channel dx is built for) means every job was skipped; a call that failed before its summary has no outputs: failure
          PLAN: ${{ needs.dx.result == 'skipped' && 'skipped' || needs.dx.outputs.plan || 'failure' }}
          BUILD_WANTED: ${{ needs.dx.outputs.build_wanted }}
          PROMOTE_WANTED: ${{ needs.dx.outputs.promote_wanted }}
          BUILD: ${{ needs.dx.result == 'skipped' && 'skipped' || needs.dx.outputs.build || 'failure' }}
          PROMOTE: ${{ needs.dx.result == 'skipped' && 'skipped' || needs.dx.outputs.promote || 'failure' }}
          SIGN: ${{ needs.dx.result == 'skipped' && 'skipped' || needs.dx.outputs.sign || 'failure' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: .github/scripts/aggregate-dx.sh

      - name: Post the result as a commit status on the built commit
        # a superseded (cancelled) run posts nothing: no failing status may appear on a commit because a newer tip replaced its run
        if: always() && !contains(needs.*.result, 'cancelled') && needs.dx.result != 'skipped' && inputs.channel == 'testing' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.result.outcome }}
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no valid commit to post a status on (${SHA})"; exit 1; }
          state=failure; text="dx image build, promotion or check failed"
          if [[ "${OUTCOME}" == success ]]; then state=success; text="dx image built, promoted or unchanged"; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" -f context="Build dx and push image" -f description="${text}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # Channel latest on main: the pair (default image digest the run was built on, dx digest built or promoted here, or empty when dx was
  # unchanged) is verified and BOTH `latest` tags move in one step; a green run that built nothing new is a no-op. Called, not dispatched:
  # the digests are handed over, the job is re-run with "re-run failed jobs" and lives in this run.
  publish:
    name: Publish latest
    needs: [dx, dx_result]
    if: >-
      always() && github.ref == 'refs/heads/main' && inputs.channel == 'latest' && !inputs.dry_run &&
      needs.dx.result == 'success' && needs.dx_result.result == 'success'
    uses: ./.github/workflows/publish-latest.yml
    permissions:
      contents: read
      packages: write
      issues: write
    with:
      vanilla_digest: ${{ needs.dx.outputs.base_digest }}
      dx_digest: ${{ needs.dx.outputs.digests }}
      main_sha: ${{ inputs.sha || github.sha }}

  # A failed dx run for latest on main: one issue with the label ci-failure-dx, a comment per further failure (a run started by a
  # dispatch with the default token probably e-mails nobody). A failed publish is reported by publish-latest.yml itself.
  alert:
    name: Report a failed dx run
    needs: [dx, dx_result]
    if: always() && github.ref == 'refs/heads/main' && inputs.channel == 'latest' && !inputs.dry_run && contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open the failure issue or comment on it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
          CHANNEL: latest
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: .github/scripts/ci-issue.sh fail
