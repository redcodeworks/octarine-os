---
name: Prune testing images

# GHCR has no retention policy, so old `testing` builds are removed here. Keeps the newest builds,
# deletes older ones together with their cosign signatures, and never touches anything tagged
# latest*; a second pass keeps only the newest three `beta-*` builds (and whatever carries `beta`); the developer image
# package (octarine-os-dx) keeps the newest KEEP testing builds and the newest three dated builds per channel (`latest-*`, `beta-*`). Scheduled runs only delete once the repository variable PRUNE_ENABLED is "true"; until
# then they are dry runs. Start it by hand with dry_run on to see the plan first.
on:
  schedule:
    - cron: '0 5 * * 0'  # Sundays 05:00 UTC (scheduled runs come from the default branch)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        type: boolean
        default: true
      keep:
        description: "Number of newest testing builds to keep"
        default: "10"

concurrency:
  group: prune-testing
  cancel-in-progress: false

jobs:
  prune:
    name: Prune testing images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_KEEP: ${{ inputs.keep }}
          PRUNE_ENABLED: ${{ vars.PRUNE_ENABLED }}
        run: |
          set -euo pipefail
          image=$(sed -n 's/^IMAGE_NAME=//p' config/image.env | tr -d '"')
          image="${image,,}"
          kind=$(gh api "users/${OWNER}" --jq '.type')
          if [[ "${kind}" == "Organization" ]]; then scope="orgs/${OWNER}"; else scope="users/${OWNER}"; fi
          export API_BASE="${scope}/packages/container/${image}"

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            dry="${INPUT_DRY_RUN}"
          elif [[ "${PRUNE_ENABLED}" == "true" ]]; then
            dry=false
          else
            dry=true
          fi
          export DRY_RUN="${dry}"
          export KEEP="${INPUT_KEEP:-10}"
          echo "Package ${API_BASE}, keep ${KEEP}, dry run: ${DRY_RUN}"

          # every pass runs even when an earlier one failed (a refusal above the limit in one kind must not skip the others); the run fails at the end
          failed=0
          pass() { # description, then env assignments for the pass (PRUNE_KIND=..., KEEP=...)
            local d=$1; shift
            echo "Package ${API_BASE}: ${d}, dry run: ${DRY_RUN}"
            if ! gh api --paginate "${API_BASE}/versions?per_page=100" | env "$@" python3 .github/scripts/prune-testing.py; then echo "::error::the prune pass '${d}' of ${API_BASE} failed"; failed=1; fi
          }

          pass "testing builds, keep ${KEEP}" PRUNE_KIND=testing

          # The beta channel (same package): keep the newest three dated beta-* builds, never the one with the beta tag
          pass "beta channel, keep 3" PRUNE_KIND=beta KEEP=3

          # The NVIDIA variant has no testing tags: prune its old released tags with the same keep-newest rule
          export API_BASE="${scope}/packages/container/${image}-nvidia"
          if gh api "${API_BASE}" > /dev/null 2>&1; then
            pass "released tags, keep ${KEEP}" PRUNE_KIND=released
          else
            echo "No ${image}-nvidia package yet; nothing to prune there"
          fi

          # The developer image (octarine-os-dx): two channels in one package, newest three dated builds of each,
          # never a version that holds the bare latest or beta tag
          export API_BASE="${scope}/packages/container/${image}-dx"
          if gh api "${API_BASE}" > /dev/null 2>&1; then
            # the dx testing builds (`testing`, `testing-<sha>`): the same rule and count as the default package
            pass "testing builds, keep ${KEEP}" PRUNE_KIND=testing
            pass "keep 3 per channel" PRUNE_KIND=dx KEEP=3
          else
            echo "No ${image}-dx package yet; nothing to prune there"
          fi
          exit "${failed}"

  # A failed weekly prune of old images: ONE issue (label ci-failure-prune, a comment per further failure, closed by the next green run), like the dx and publish alerts: a scheduled run
  # that fails e-mails nobody who is not watching Actions. A cancelled run raises nothing and closes nothing. Needs issues: write only.
  alert:
    name: Report a failed weekly prune of old images
    needs: [prune]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open the failure issue or comment on it
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          LABEL: ci-failure-prune
          LABEL_DESC: the weekly prune of old images failed (one open issue at a time)
          ISSUE_TITLE: "The weekly image prune failed"
          ISSUE_BODY: "The prune of old testing, beta and dx images failed or refused to delete more than its limit (the repository variable PRUNE_ENABLED makes scheduled runs delete). See the run for the failed job. Later failures are added to this issue as comments; it closes itself when a run succeeds. Where to look: CLAUDE.md, the prune workflow."
          FAIL_COMMENT: "weekly prune of old images failed again"
        run: .github/scripts/ci-issue.sh fail

      - name: Close the issue when the run succeeded
        if: needs.prune.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          LABEL: ci-failure-prune
          RECOVER_COMMENT: "the next weekly prune of old images succeeded"
        run: .github/scripts/ci-issue.sh recover
