---
name: Prune testing images

# GHCR has no retention policy, so old `testing` builds are removed here. Keeps the newest builds,
# deletes older ones together with their cosign signatures, and never touches anything tagged
# latest*; a second pass keeps only the newest three `beta-*` builds (and whatever carries `beta`); the developer image
# package (octarine-os-dx) keeps the newest three dated builds per channel (`latest-*`, `beta-*`). Scheduled runs only delete once the repository variable PRUNE_ENABLED is "true"; until
# then they are dry runs. Start it by hand with dry_run on to see the plan first.
on:
  schedule:
    - cron: '0 5 * * 0'  # Sundays 05:00 UTC (scheduled runs come from the default branch)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        type: boolean
        default: true
      keep:
        description: "Number of newest testing builds to keep"
        default: "10"

concurrency:
  group: prune-testing
  cancel-in-progress: false

jobs:
  prune:
    name: Prune testing images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_KEEP: ${{ inputs.keep }}
          PRUNE_ENABLED: ${{ vars.PRUNE_ENABLED }}
        run: |
          set -euo pipefail
          image=$(sed -n 's/^IMAGE_NAME=//p' image-template.env | tr -d '"')
          image="${image,,}"
          kind=$(gh api "users/${OWNER}" --jq '.type')
          if [[ "${kind}" == "Organization" ]]; then scope="orgs/${OWNER}"; else scope="users/${OWNER}"; fi
          export API_BASE="${scope}/packages/container/${image}"

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            dry="${INPUT_DRY_RUN}"
          elif [[ "${PRUNE_ENABLED}" == "true" ]]; then
            dry=false
          else
            dry=true
          fi
          export DRY_RUN="${dry}"
          export KEEP="${INPUT_KEEP:-10}"
          echo "Package ${API_BASE}, keep ${KEEP}, dry run: ${DRY_RUN}"

          gh api --paginate "${API_BASE}/versions?per_page=100" | python3 .github/scripts/prune-testing.py

          # The beta channel (same package): keep the newest three dated beta-* builds, never the one with the beta tag
          echo "Package ${API_BASE}, beta channel, keep 3, dry run: ${DRY_RUN}"
          gh api --paginate "${API_BASE}/versions?per_page=100" | PRUNE_KIND=beta KEEP=3 python3 .github/scripts/prune-testing.py

          # The NVIDIA variant has no testing tags: prune its old released tags with the same keep-newest rule
          export API_BASE="${scope}/packages/container/${image}-nvidia"
          if gh api "${API_BASE}" > /dev/null 2>&1; then
            echo "Package ${API_BASE}, keep ${KEEP}, dry run: ${DRY_RUN}"
            gh api --paginate "${API_BASE}/versions?per_page=100" | PRUNE_KIND=released python3 .github/scripts/prune-testing.py
          else
            echo "No ${image}-nvidia package yet; nothing to prune there"
          fi

          # The developer image (octarine-os-dx): two channels in one package, newest three dated builds of each,
          # never a version that holds the bare latest or beta tag
          export API_BASE="${scope}/packages/container/${image}-dx"
          if gh api "${API_BASE}" > /dev/null 2>&1; then
            echo "Package ${API_BASE}, keep 3 per channel, dry run: ${DRY_RUN}"
            gh api --paginate "${API_BASE}/versions?per_page=100" | PRUNE_KIND=dx KEEP=3 python3 .github/scripts/prune-testing.py
          else
            echo "No ${image}-dx package yet; nothing to prune there"
          fi
