---
name: Require testing branch

# main only changes through a pull request from the testing branch of this repository.
# The other required check, "Build and push image", proves the testing tip built successfully.
on:
  pull_request:
    branches:
      - main

jobs:
  require-testing-branch:
    name: require-testing-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only the testing branch may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [[ "${HEAD_REPO}" != "${THIS_REPO}" || "${HEAD_REF}" != "testing" ]]; then
            echo "::error::Pull requests into main must come from the testing branch of ${THIS_REPO} (this one is from ${HEAD_REPO}:${HEAD_REF})"
            exit 1
          fi
          echo "ok: ${HEAD_REPO}:${HEAD_REF}"
