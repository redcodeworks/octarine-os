name: Bump pins
# ONE weekly workflow for every external pin that is bumped automatically, ONE INDEPENDENT pull request into `testing` PER PIN that moved (branch bump/<pin>-YYYYMMDD cut
# from testing, one commit, only that pin's lines changed; the owner merges any subset in any order and closes the rest; nothing is built or published here). Monday 07:00 UTC;
# scheduled workflows run only from the default branch, so the schedule starts after the first promotion of this file into `main`; workflow_dispatch works from any branch
# that has the file (`gh workflow run bump-pins.yml --ref testing`; with `-f dry_run=true` it prints what it would open, keep or close, one pull request per pin, and
# pushes and opens nothing, and may be dispatched from any branch to try its scripts).
#
# One job PER PIN (a matrix, the only list of pins: chunkah, brew, bins (the octarine-bins image digest); a new pin is one more entry, and a failing pin turns only its own job red), all running one script (.github/scripts/bump_weekly.py with BUMP_PINS set to the job's pin) through bump_run.py; each pin that moved gets its own
# branch, commit and pull request, an open pull request of the same pin that already proposes the same value stays, an older one is closed with a pointer to the new one (no
# force-push, so a moved upstream means a new pull request), and a stale one (testing already has the value) is closed. A failing pin (a registry that cannot be reached, a
# signature that does not verify) changes nothing and turns the run red, which scripts/scheduled-runs.sh reports; the other pins still go in. The jobs dispatch the Test workflow for their own commits at the same time without colliding (the check runs and the Test run are keyed by the commit sha). Stay manual by the owner's decision: the
# tool versions (cosign, just, gitleaks, zizmor), the runner label, the repository variables and the signing key.
#
# Token: only the default GITHUB_TOKEN. Its pushes and pull requests start no workflow except workflow_dispatch, so bump_checks.py dispatches the Test workflow ON TESTING with
# `ref=<bump commit>` (`actions: write`; it tests that commit). A run dispatched on the bump branch would not count (found 2026-11-15 on #137: a dispatched run is not part of a
# PR's rollup, and check runs posted into its suite are not counted either), so bump_checks.py waits for the run and posts check runs named `test` and `secrets` with its real
# results on the bump commit (`checks: write`; a commit without a suite of its own takes them). "Allow GitHub Actions to create and approve pull requests" must be on (it is).
on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be opened, kept or closed (one pull request per pin); push and open nothing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump ${{ matrix.pin }}
    strategy:
      fail-fast: false
      matrix:
        pin: [chunkah, brew, bins]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUMP_PINS: ${{ matrix.pin }}
    steps:
      # testing, so the pins compared and the scripts run are testing's; a manual dry run from another branch checks that branch out to try its scripts
      - name: Check out testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.dry_run && github.ref_name || 'testing' }}
          fetch-depth: 0

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Check the pin and open its pull request
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --frozen --no-dev python -I .github/scripts/bump_weekly.py
