name: Bump pins
# ONE weekly workflow for every external pin that is bumped automatically, one pull request per pin (branch bump/<name>, into `testing`, created or updated in
# place, only the pin lines changed; nothing is built or published here; bump pull requests are merged by the owner). Monday 07:00 UTC (it replaces the
# separate upstream-check.yml of Monday and the Tuesday bump-pins.yml); scheduled workflows run only from the default branch, so the schedule starts after
# the first promotion of this file into `main`; workflow_dispatch works from any branch that has the file (`gh workflow run bump-pins.yml --ref testing`).
#
# Jobs, independent of each other (a failing pin does not stop the others; the final job fails the run when any pin failed, which scripts/scheduled-runs.sh reports):
#   sources  scx, extest, ghostty (and the Zig pin of binaries/ghostty/zig.env, moved by the Ghostty PR; a newer Zig patch of the pinned minor is its own low-priority PR)
#   digests  chunkah, dev-packages, datastore-images (the pointer to the list image of the four datastore container images; the images INSIDE the list are edited by hand in the fedora-toolbox repository and never bumped here)
#   external brew (ghcr.io/ublue-os/brew, Containerfile; the `just brew-bump` recipe is the pin writer) and builder (the Fedora builder digest of
#            binaries/builder.env; the same major, only once the digest has been the tag's value for 7 days; a builder bump rebuilds every binaries component)
# Every pin goes through .github/scripts/bump-run.sh (the decision scripts per kind, then .github/scripts/bump-pr.sh for the branch, the commit, the PR and the dispatch
# of the Test workflow); .github/scripts/bump-summary.sh writes the table. A registry that cannot be reached or a signature that does not verify fails that pin and changes
# nothing. Stay manual by the owner's decision: the tool versions (cosign, just, gitleaks, zizmor), bootc-image-builder, the runner label, the repository variables and the signing key.
#
# Token: only the default GITHUB_TOKEN. Its pushes and pull requests start no workflow except workflow_dispatch, so bump-pr.sh dispatches the Test workflow ON TESTING with
# `ref=<bump commit>` (`actions: write`; it tests that commit). A run dispatched on the bump branch would not count (found 2026-11-15 on #137: a dispatched run is not part of a
# PR's rollup, and check runs posted into its suite are not counted either), so bump-checks.sh waits for the run and posts check runs named `test` and `secrets` with its real
# results on the bump commit (`checks: write`; a commit without a suite of its own takes them). "Allow GitHub Actions to create and approve pull requests" must be on (it is).
on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sources:
    name: Bump ${{ matrix.pin }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        pin: [scx, extest, ghostty]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing
          fetch-depth: 0

      - name: Check the pin and open or update its pull request
        env:
          PIN: ${{ matrix.pin }}
          BUMP_ROW_DIR: ${{ runner.temp }}/rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-run.sh "${PIN}"

      - name: Hand the row to the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-row-${{ matrix.pin }}
          path: ${{ runner.temp }}/rows/${{ matrix.pin }}.tsv
          if-no-files-found: ignore
          retention-days: 3

  digests:
    name: Bump ${{ matrix.pin }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        pin: [chunkah, dev-packages, datastore-images]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing
          fetch-depth: 0

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Check the pin and open or update its pull request
        env:
          PIN: ${{ matrix.pin }}
          BUMP_ROW_DIR: ${{ runner.temp }}/rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-run.sh "${PIN}"

      - name: Hand the row to the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-row-${{ matrix.pin }}
          path: ${{ runner.temp }}/rows/${{ matrix.pin }}.tsv
          if-no-files-found: ignore
          retention-days: 3

  external:
    name: Bump ${{ matrix.pin }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        pin: [brew, builder]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing
          fetch-depth: 0

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Check the pin and open or update its pull request
        env:
          PIN: ${{ matrix.pin }}
          BUMP_ROW_DIR: ${{ runner.temp }}/rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-run.sh "${PIN}"

      - name: Hand the row to the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump-row-${{ matrix.pin }}
          path: ${{ runner.temp }}/rows/${{ matrix.pin }}.tsv
          if-no-files-found: ignore
          retention-days: 3

  summary:
    name: Summary of the pin bumps
    needs: [sources, digests, external]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch the rows
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bump-row-*
          merge-multiple: true
          path: ${{ runner.temp }}/rows

      - name: Table (red when any pin failed)
        run: .github/scripts/bump-summary.sh "${RUNNER_TEMP}/rows" scx extest ghostty chunkah dev-packages datastore-images brew builder
