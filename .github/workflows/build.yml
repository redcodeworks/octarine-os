---
name: Build container image
# Builds two images from the same Containerfile, build.sh and system_files; only the base tag differs:
#   octarine-os         on silverblue-main:45      daily (publishes `latest` from main)
#   octarine-os-stable  on silverblue-main:$STABLE_BASE_TAG (image-template.env) every second ISO week (publishes `stable` from main)
# The shared steps live in build-image.yml. Pushes, pull requests and manual runs build both; the
# schedules build one each (see .github/scripts/plan-builds.sh and tests/plan-builds.sh).
#
# Branch model: pushes to `testing` publish the `testing` image; `main` is protected and only changes
# through a pull request from `testing`, whose merge publishes the channel tags. Every push builds (no
# path filter) so the required "Build and push image" check always exists for the commit being promoted.
on:
  pull_request:
    branches:
      - testing
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday: octarine-os (runs on the default branch, so it refreshes latest)
    - cron: '35 10 * * 1'  # Mondays 10:35am UTC: octarine-os-stable, only on even ISO weeks (guard in plan-builds.sh)
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

# The schedule is part of the group so that the daily and the weekly run on the same day do not replace each other
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The every-second-week guard: a scheduled weekly run builds the stable image only on even ISO weeks.
      # Pushes, pull requests and manual runs always build both images.
      - name: Choose images
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          matrix=$(.github/scripts/plan-builds.sh "${EVENT}" "${SCHEDULE}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "any=$(jq '.include | length > 0' <<<"${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "Plan: ${matrix}"

  images:
    name: images (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: ${{ matrix.image }}
      base_tag: ${{ matrix.base_tag }}
      main_tag: ${{ matrix.main_tag }}
    secrets: inherit

  # The branch protection requires a check named "Build and push image". Matrix and reusable workflow
  # jobs get names of their own, so this job keeps the required name and passes only if every image
  # built (or the plan had nothing to build, as on an odd-week schedule run).
  result:
    name: Build and push image
    needs: [plan, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every planned image built, signed and verified
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          echo "plan: ${PLAN}, images: ${IMAGES}"
          [[ "${PLAN}" == "success" ]] || { echo "::error::Planning failed"; exit 1; }
          [[ "${IMAGES}" == "success" || "${IMAGES}" == "skipped" ]] || { echo "::error::An image build failed or was cancelled"; exit 1; }
