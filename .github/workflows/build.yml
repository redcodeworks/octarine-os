---
name: Build container image
# Branch model: pushes to `testing` publish the `testing` image (immutable tags first, `testing` moved after signing; a newer push cancels an older run); `main` is protected and only changes
# through a pull request from `testing`, whose merge publishes `latest`. Every push runs the workflow (no
# path filter) so the required "Build and push image" check always exists for the commit being promoted:
# the plan job skips the heavy build when only docs changed (list in .github/scripts/plan_build.py) and the
# aggregate job named "Build and push image" then passes without it. There is no pull_request trigger: a dev branch
# is checked by test.yml, the image is built when the change is merged into `testing`. A push whose default-image inputs
# (inputs_hash.py: everything but docs and the files only the dx or gx images use) equal those of an already published, signed `testing`
# image builds nothing (a dx-only or gx-only change), and on `main` promotes by the same rule. A manual dispatch from any
# other branch (`gh workflow run build.yml --ref <branch>`) builds as validation only: nothing is pushed or signed.
on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC every day (runs on the default branch, so it refreshes latest)
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

# every job sets its own permissions; the default of the workflow is read-only
permissions:
  contents: read

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # The base image is ${BASE_IMAGE}:${FEDORA_VERSION}. A repository variable of the same name overrides the default
  # (set with `gh variable set FEDORA_VERSION --body 46`, undo with `gh variable delete FEDORA_VERSION`); the
  # defaults repeat the Containerfile ARG defaults, keep them in sync. The build logs the resolved base and its
  # digest and records them as OCI labels.
  BASE_IMAGE: ${{ vars.BASE_IMAGE || 'ghcr.io/ublue-os/silverblue-main' }}
  FEDORA_VERSION: ${{ vars.FEDORA_VERSION || '45' }}
  # A scheduled run skips the build while the base image, the repository content and `latest` are all unchanged, but
  # never when `latest` is older than this many days: the build installs RPMs from live Fedora and RPM Fusion
  # repositories, so package updates arrive without a base image change (7 = a week of staleness at most)
  SCHEDULED_REBUILD_MAX_AGE_DAYS: '7'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # `testing`: a newer push cancels the older run (2026-11-16, Kevin). Safe because a testing build pushes only its immutable tags (`testing-<sha>`,
  # `testing-<date>-<sha>`), the sign job signs and verifies that digest, and only THEN moves the moving tags (`testing`, `testing-<date>`): a cancel at any
  # point leaves `testing` on the previous SIGNED image. Every other ref never cancels: the group is per ref, so a schedule run and a push run on main
  # queue behind each other (one running, the newest pending), and a dispatch from another branch has its own group.
  cancel-in-progress: ${{ github.ref == 'refs/heads/testing' }}

jobs:
  plan:
    name: Plan build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.final.outputs.build }}
      promote: ${{ steps.final.outputs.promote }}
      source_tag: ${{ steps.promote.outputs.source_tag || steps.reuse.outputs.source_tag }}
      source_digest: ${{ steps.promote.outputs.source_digest || steps.reuse.outputs.source_digest }}
      image: ${{ steps.names.outputs.image }}
      brew_pin_changed: ${{ steps.brewpin.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Decide whether the image needs building
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          build=$(uv run --frozen --no-dev python -I .github/scripts/plan_build.py "${EVENT}" "${BEFORE}" "${AFTER}" "${REF}")
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "Build image: ${build}"

      # The brew image pin is verified with cosign (in the build job) whenever it changed in this push, and on every
      # run without a usable before-commit (schedule, dispatch, new branch), so a hand-edited digest cannot ship unverified
      - name: Did the brew image pin change?
        id: brewpin
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed=true
          if [[ -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if ! git diff "${BEFORE}" "${AFTER}" -- Containerfile | grep -qE '^[+-]ARG BREW_(TAG|DIGEST)='; then changed=false; fi
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Brew pin changed: ${changed}"

      - name: Image name
        id: names
        run: |
          IMAGE_NAME=$(sed -n 's/^IMAGE_NAME=//p' config/image.env | head -n1 | tr -d '"')
          [[ -n "${IMAGE_NAME}" ]] || { echo "::error::IMAGE_NAME not found in config/image.env"; exit 1; }
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          echo "image=${registry,,}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # Scheduled refresh: skip the build when nothing changed since the published `latest` (decision rules and
      # failure modes in .github/scripts/plan_skip.py; any lookup that fails means build, never skip)
      - name: Set up cosign (scheduled skip check)
        if: github.event_name == 'schedule'
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Scheduled run, skip when nothing changed
        id: sched
        if: github.event_name == 'schedule'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          set +e
          label() { jq -r --arg k "$1" '.config.Labels[$k] // empty' <<<"${cfg}"; }
          base_now=$(skopeo inspect --raw "docker://${BASE_IMAGE}:${FEDORA_VERSION}" | sha256sum | sed 's/ .*//; s/^/sha256:/')
          [[ "${base_now}" == sha256:???*  && "${base_now}" != "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]] || base_now=""
          cfg=$(skopeo inspect --config "docker://${IMAGE}:latest" 2>/dev/null)
          latest_base=$(label io.github.redcodeworks.octarine-os.base-index-digest)
          latest_missing=$(label org.octarineos.optional-packages-missing)
          revision=$(label org.opencontainers.image.revision)
          created=$(label org.opencontainers.image.created)
          repo_same=false
          # equal default-image inputs count as the same repository (docs-only, dx-only and gx-only changes do not rebuild it)
          if [[ -n "${revision}" ]] && git cat-file -e "${revision}^{commit}" 2>/dev/null \
              && [[ "$(uv run --frozen --no-dev python -I .github/scripts/inputs_hash.py vanilla "${revision}")" == "$(uv run --frozen --no-dev python -I .github/scripts/inputs_hash.py vanilla HEAD)" ]]; then
            repo_same=true
          fi
          signed=false
          digest=$(skopeo inspect --raw "docker://${IMAGE}:latest" 2>/dev/null | sha256sum | sed 's/ .*//')
          if [[ -n "${cfg}" && -n "${digest}" ]] && cosign verify --key cosign.pub "${IMAGE}@sha256:${digest}" > /dev/null 2>&1; then
            signed=true
          fi
          decision=$(EVENT="${GITHUB_EVENT_NAME}" REF="${GITHUB_REF}" BASE_NOW="${base_now}" LATEST_BASE="${latest_base}" \
            REPO_SAME="${repo_same}" LATEST_CREATED="${created}" MAX_AGE_DAYS="${SCHEDULED_REBUILD_MAX_AGE_DAYS}" SIGNED="${signed}" \
            LATEST_MISSING="${latest_missing}" uv run --frozen --no-dev python -I .github/scripts/plan_skip.py)
          echo "${decision}"
          echo "${decision}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${decision}" == skipped:* ]]; then echo "skip=true" >> "${GITHUB_OUTPUT}"; fi

      # Build once, promote: a merge into main whose content equals an already published and signed
      # `testing` image retags that digest to `latest` instead of rebuilding (see CLAUDE.md "Promotion")
      - name: Look for a tested testing image to promote
        id: promote
        if: steps.plan.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROMOTE_ENABLED: ${{ vars.PROMOTE_ENABLED }}
          IMAGE: ${{ steps.names.outputs.image }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
        run: |
          uv run --frozen --no-dev python -I .github/scripts/plan_promote.py "${EVENT}" "${REF}" "${AFTER}" | tee -a "${GITHUB_OUTPUT}"

      # A push to testing whose default-image inputs equal those of a published testing image (a dx-only or gx-only change) needs no
      # build: the plan ends green and the aggregate check passes (see CLAUDE.md "dx image" and plan_vanilla_reuse.py)
      - name: Look for an identical default-image build on testing
        id: reuse
        if: steps.plan.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/testing'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.sha }}
        run: |
          uv run --frozen --no-dev python -I .github/scripts/plan_vanilla_reuse.py "${EVENT}" "${REF}" "${AFTER}" | tee -a "${GITHUB_OUTPUT}"

      - name: Set up cosign
        if: steps.promote.outputs.promote == 'true' || steps.reuse.outputs.reuse == 'true'
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      # The signature belongs to the digest and exists from the testing publish; without a valid one the
      # normal build and sign runs instead
      - name: Verify the signature of the image to promote or reuse
        id: verify
        if: steps.promote.outputs.promote == 'true' || steps.reuse.outputs.reuse == 'true'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.promote.outputs.source_digest || steps.reuse.outputs.source_digest }}
          REUSE_INPUTS: ${{ steps.reuse.outputs.inputs }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          set -euo pipefail
          # exit 5 of cosign_check.py = cosign said the signature is missing or wrong (building instead is the intended path); exit 4 = the registry could not be
          # read after the retries: that must NOT turn into a rebuild of untested content, so the Final decision fails the plan (unreadable=true)
          rc=0
          uv run --frozen --no-dev python -I .github/scripts/cosign_check.py --key cosign.pub "${IMAGE}@${DIGEST}" || rc=$?
          if [[ "${rc}" == 4 ]]; then echo "unreadable=true" >> "${GITHUB_OUTPUT}"; fi
          [[ "${rc}" == 0 ]] || exit 1
          echo "signature of ${DIGEST} is valid"
          # a reused image must not carry a different inputs label (an image from before the label has none: the commit decides)
          if [[ "${REUSE}" == true ]]; then
            cfg=$(uv run --frozen --no-dev python -I .github/scripts/registry_read.py config "${IMAGE}@${DIGEST}") || { echo "unreadable=true" >> "${GITHUB_OUTPUT}"; exit 1; }
            have=$(jq -r '.config.Labels["io.github.redcodeworks.octarine-os.vanilla-inputs"] // empty' <<<"${cfg}")
            [[ -z "${have}" || "${have}" == "${REUSE_INPUTS}" ]] || { echo "::error::${DIGEST} carries vanilla-inputs ${have}, this commit has ${REUSE_INPUTS}"; exit 1; }
          fi

      - name: Final decision
        id: final
        env:
          BUILD_PLAN: ${{ steps.plan.outputs.build }}
          SCHED_SKIP: ${{ steps.sched.outputs.skip }}
          CANDIDATE: ${{ steps.promote.outputs.promote }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
          VERIFY: ${{ steps.verify.outcome }}
          UNREADABLE: ${{ steps.verify.outputs.unreadable }}
        run: |
          if [[ "${UNREADABLE}" == true ]]; then
            echo "::error::The registry could not be read while verifying the image to promote or reuse (a read error, not a bad signature): failing the plan instead of building something untested. Re-run the workflow."
            exit 1
          fi
          if [[ "${CANDIDATE}" == true && "${VERIFY}" == success ]]; then
            build=false; promote=true
          elif [[ "${REUSE}" == true && "${VERIFY}" == success ]]; then
            build=false; promote=false
            echo "default-image inputs unchanged, nothing to build" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            [[ "${REUSE}" != true ]] || echo "::warning::The image of the same default-image inputs failed verification: building instead"
            build="${BUILD_PLAN}"; promote=false
            [[ "${SCHED_SKIP}" != true ]] || build=false
            [[ "${CANDIDATE}" != true ]] || echo "::warning::Signature verification of the testing image failed: building instead of promoting"
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "promote=${promote}" >> "${GITHUB_OUTPUT}"
          echo "build=${build} promote=${promote}"

  build_push:
    name: Build image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04

    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      image: ${{ steps.names.outputs.image }}
      digests: ${{ steps.push-image.outputs.digests }}
      alias_tags: ${{ steps.gen-build-tags.outputs.alias_tags }}
      moving_tags: ${{ steps.gen-build-tags.outputs.moving_tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # main publishes `latest`, testing publishes `testing`; a dispatch from any other branch builds and publishes nothing
      - name: Choose channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          publish=false
          tag=testing
          case "${REF}" in
            refs/heads/main) publish=true; tag=latest ;;
            refs/heads/testing) publish=true ;;
          esac
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Channel: tag=${tag} publish=${publish}"

      # The runner has a 145 GB root disk with about 88 GB free before anything is removed (measured 2026-11-14 on ubuntu-26.04: the default
      # image build peaks at 44 GB used, 18 GB more than the 26 GB left after the cleanup action), so the cleanup action (38 to 85 s) is
      # only the FALLBACK now: it runs when less than 60 GiB is free at the start.
      - name: Check disk space
        id: disk
        run: |
          free=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          df -h /
          echo "Free at the start: ${free} GiB"
          echo "low=$([ "${free}" -lt 60 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Maximize build space (fallback, only when the disk is low)
        if: steps.disk.outputs.low == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        env:
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          echo "DEFAULT_TAG=${TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        id: names
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # The Homebrew files image is pinned by digest in the Containerfile (ARG BREW_DIGEST), verified with cosign when
      # the pin is bumped (`just brew-bump`) and again in CI when the pin changed (verify-brew-pin step). Here:
      # the pinned reference goes into the log as the record of what the build used.
      - name: Check the brew image pin
        run: |
          tag=$(sed -n 's/^ARG BREW_TAG=//p' Containerfile)
          digest=$(sed -n 's/^ARG BREW_DIGEST=//p' Containerfile)
          echo "Brew image pinned: ghcr.io/ublue-os/brew:${tag}@${digest}"
          echo "BREW_PIN=ghcr.io/ublue-os/brew@${digest}" >> "${GITHUB_ENV}"

      - name: Set up cosign (brew pin check)
        if: needs.plan.outputs.brew_pin_changed == 'true'
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Verify the brew image signature (the pin changed)
        if: needs.plan.outputs.brew_pin_changed == 'true'
        run: |
          uv run --frozen --no-dev python -I .github/scripts/retry.py cosign verify --key keys/ublue-os-brew-cosign.pub "${BREW_PIN}" > /dev/null
          echo "Signature of ${BREW_PIN} is valid"

      # The prebuilt binaries image (octarine-bins, built and signed by the octarine-bins repository with its own key) is pinned by digest in the Containerfile
      # (ARG BINS_DIGEST, changed only by a bump PR). Every build verifies the PINNED digest with keys/octarine-bins.pub, logs the reference and sets the
      # image label to it (`just build` reads the pin itself): a hand-edited digest cannot ship unverified. No `latest` is read here.
      - name: Set up cosign (binaries image)
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry (to pull the binaries image)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the pinned binaries image
        run: |
          tag=$(sed -n 's/^ARG BINS_TAG=//p' Containerfile)
          digest=$(sed -n 's/^ARG BINS_DIGEST=//p' Containerfile)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::BINS_DIGEST in the Containerfile is missing or malformed"; exit 1; }
          ref="ghcr.io/redcodeworks/octarine-bins@${digest}"
          uv run --frozen --no-dev python -I .github/scripts/retry.py cosign verify --key keys/octarine-bins.pub "${ref}" > /dev/null || { echo "::error::the signature of ${ref} does not verify with keys/octarine-bins.pub"; exit 1; }
          echo "Binaries image pinned: ghcr.io/redcodeworks/octarine-bins:${tag}@${digest} (signature valid)"

      # Fail early and clearly if the base image (BASE_IMAGE:FEDORA_VERSION, see the env block) cannot be pulled
      - name: Check the base image can be pulled
        run: |
          [[ -n "${BASE_IMAGE}" && "${FEDORA_VERSION}" =~ ^[0-9]+$ ]] || { echo "::error::BASE_IMAGE or FEDORA_VERSION missing or invalid (repository variable or workflow default)"; exit 1; }
          base="${BASE_IMAGE}:${FEDORA_VERSION}"
          echo "BASE_REF=${base}" >> "${GITHUB_ENV}"
          # the floating tag is resolved to a digest ONCE here and its signature is verified with the pinned Universal Blue key (fail closed);
          # everything after this step uses that digest, so one run uses one base
          pin_line=$(uv run --frozen --no-dev python -I .github/scripts/base_pin.py)
          BASE_PIN=${pin_line#BASE_PIN=}
          [[ "${BASE_PIN}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no base digest from base_pin.py"; exit 1; }
          if ! uv run --frozen --no-dev python -I .github/scripts/retry.py podman pull "${BASE_IMAGE}@${BASE_PIN}" >/dev/null; then
            echo "::error::Cannot pull the base image ${base}: does that tag exist? (list tags with: skopeo list-tags docker://${BASE_IMAGE})"
            exit 1
          fi
          podman image inspect "${BASE_IMAGE}@${BASE_PIN}" --format 'Base image {{.Id}} created {{.Created}}'
          digest=$(podman image inspect "${BASE_IMAGE}@${BASE_PIN}" --format '{{.Digest}}')
          [[ "${digest}" == sha256:* ]] || { echo "::error::Cannot determine the digest of ${base}"; exit 1; }
          echo "Base image ${base} resolved to ${BASE_IMAGE}@${digest}"
          echo "BASE_DIGEST=${digest}" >> "${GITHUB_ENV}"
          # the manifest (list) digest is the pin itself: the same value the scheduled skip check computes without pulling
          echo "BASE_INDEX_DIGEST=${BASE_PIN}" >> "${GITHUB_ENV}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Catch accidental bloat (for example a disk image copied into the build) before anything is pushed
      - name: Check image size
        env:
          MAX_IMAGE_GIB: 15
        run: |
          size=$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MiB (limit $((MAX_IMAGE_GIB * 1024)) MiB)"
          if (( size > MAX_IMAGE_GIB * 1024 * 1024 * 1024 )); then
            echo "::error::The image is larger than ${MAX_IMAGE_GIB} GiB; check what was added"
            exit 1
          fi

      # Fail the build before anything is pushed if the image is missing what it should have
      - name: Smoke test image
        run: |
          podman run --rm -v "${PWD}/.github/scripts/default-smoke.sh:/default-smoke.sh:ro" -e REF="${IMAGE_REGISTRY}/${IMAGE_NAME}" -e BASE_TAG="${BASE_REF##*:}" "${IMAGE_NAME}:${DEFAULT_TAG}" bash /default-smoke.sh

      # The compilers and the linker the image ships (gcc, gcc-c++, make, binutils) must work: compile, link and run a C and a C++ program
      - name: Compiler smoke test
        run: |
          set -euo pipefail
          podman run --rm -v "${PWD}/.github/scripts/compiler-smoke.sh:/compiler-smoke.sh:ro" "${IMAGE_NAME}:${DEFAULT_TAG}" bash /compiler-smoke.sh

      # Tier 1 compatibility check: every shipped scheduler against the kernel of THIS image, statically (kernel config, the
      # kernel's own BTF read out of vmlinuz, the kernel symbols and struct sched_ext_ops members each scheduler's embedded BPF
      # object requires). It loads nothing; a failure here fails the build and so blocks the promotion of this build.
      - name: Check the shipped schedulers against the image kernel
        run: |
          set -euo pipefail
          podman run --rm -v "${PWD}/.github/scripts/scx-kernel-check.py:/scx-kernel-check.py:ro" "${IMAGE_NAME}:${DEFAULT_TAG}" \
            bash -c 'kver=$(ls /usr/lib/modules | head -n1); echo "kernel ${kver}"; python3 -I /scx-kernel-check.py --kernel-dir "/usr/lib/modules/${kver}"'

      # Optional packages that could not be installed (build.sh writes the list): a warning each, never a failure
      - name: Report missing optional packages
        run: |
          missing=$(podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" cat /usr/share/octarine-os/optional-packages-missing)
          {
            echo "### Optional packages"
            if [[ -z "${missing}" ]]; then
              echo "All optional packages are installed."
            else
              echo "These optional packages could not be installed (the build went on without them):"
              echo
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r name; do
            [[ -n "${name}" ]] || continue
            echo "::warning title=Optional package missing::${name}"
            echo "- \`${name}\`" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${missing}"

      # Smaller delta updates: chunkah (pinned by digest in config/chunkah.env, signature verified first); same recipe in every image workflow
      - name: Rechunk with chunkah
        id: rechunk
        run: |
          # the layers' epoch is the Created time of the base this build started FROM (pulled by the base check above)
          export CHUNKAH_EPOCH_BASE="${BASE_IMAGE}@${BASE_INDEX_DIGEST}"
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Secure Boot: the kernel image must verify with sbverify against Universal Blue's kernel key (downloaded from the akmods repository) (a base with an unsigned or differently
      # signed kernel would not boot on a Secure Boot machine); the signer of the real kernel is printed. Not verifiable here: a real boot.
      - name: Secure Boot check of the kernel
        run: |
          uv run --frozen --no-dev python -I .github/scripts/retry.py sudo apt-get update -qq
          uv run --frozen --no-dev python -I .github/scripts/retry.py sudo apt-get install -y --no-install-recommends sbsigntool
          uv run --frozen --no-dev python -I .github/scripts/secureboot_check.py "${IMAGE_NAME}:${DEFAULT_TAG}"

      # A promoted image keeps its build's version, so no version may name a channel
      - name: Check the version is channel-neutral
        run: |
          # the labels plus os-release IMAGE_VERSION of the rechunked image
          {
            podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" \
              | jq -r '.[0].Config.Labels // {} | to_entries[] | "\(.key)=\(.value)"'
            podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" sh -c '. /etc/os-release && echo "IMAGE_VERSION=${IMAGE_VERSION:-}"'
          } | uv run --frozen --no-dev python -I .github/scripts/check_version_neutral.py

      - name: Disk after the build
        run: |
          free=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          df -h /
          echo "Free after the build and rechunk: ${free} GiB" | tee -a "${GITHUB_STEP_SUMMARY}"
          if [ "${free}" -lt 15 ]; then echo "::warning::Only ${free} GiB free after the build: the cleanup of the runner may be needed again (see Check disk space)"; fi

      - name: Generate Build Tags
        id: gen-build-tags
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # main publishes only the dated tags; the bare `latest` is moved later by the publish job (publish-latest.yml: CLAUDE.md
          # "Publishing latest, one image at a time")
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG} \
                        false)"
          # the scheduled daily build (not a push, a promotion or a dispatch) also gets daily-YYYYMMDD (UTC), which prune-daily.yml counts
          if [[ "${EVENT}" == schedule ]]; then alias_tags="${alias_tags} daily-$(date -u +%Y%m%d)"; fi

          # testing: the moving tags (`testing`, `testing-<date>`) are NOT pushed here; the sign job moves them to the digest after it is signed and verified,
          # so only the immutable per-commit tags exist before the signature does
          moving_tags=""
          if [[ "${DEFAULT_TAG}" == testing ]]; then
            immutable=""
            for t in ${alias_tags}; do
              if [[ "${t}" =~ ^testing(-[0-9]{8})?$ ]]; then moving_tags="${moving_tags:+${moving_tags} }${t}"; else immutable="${immutable:+${immutable} }${t}"; fi
            done
            alias_tags="${immutable}"
          fi

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "Moving tags (after signing): ${moving_tags:-none}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT
          echo "moving_tags=${moving_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that a validation run (a dispatch from a dev branch) does not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.channel.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: steps.channel.outputs.publish == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # One push, the other tags are registry-side copies of its digest: every tag shares one manifest digest and
          # one signature, which is what lets the dx promotion match the tested image
          read -r first _ <<< "${ALIAS_TAGS}"
          uv run --frozen --no-dev python -I .github/scripts/push_tags.py "${IMAGE_NAME}:${first}" "${IMAGE_REGISTRY}/${IMAGE_NAME}" ${ALIAS_TAGS}

  # Build once, promote: retag the tested and signed `testing` digest as latest and its dated aliases, no
  # rebuild. The digest is compared before and after every copy.
  promote:
    name: Promote tested image
    needs: plan
    if: needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.plan.outputs.image }}
      digests: ${{ needs.plan.outputs.source_digest }}
      alias_tags: ${{ steps.tags.outputs.alias_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the tags a main build would publish
        id: tags
        run: |
          alias_tags="$(just generate-build-tags x latest false)"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Retag the tested digest
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          SOURCE_TAG: ${{ needs.plan.outputs.source_tag }}
          SOURCE_DIGEST: ${{ needs.plan.outputs.source_digest }}
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          now=$(uv run --frozen --no-dev python -I .github/scripts/registry_digest.py "${SOURCE_TAG}")
          [[ "${now}" == "${SOURCE_DIGEST}" ]] || { echo "::error::${SOURCE_TAG} is ${now}, the plan saw ${SOURCE_DIGEST}"; exit 1; }
          for tag in ${ALIAS_TAGS}; do
            uv run --frozen --no-dev python -I .github/scripts/retry.py skopeo copy --all --preserve-digests "docker://${IMAGE}:${SOURCE_TAG}" "docker://${IMAGE}:${tag}"
            # the read-back polls (registry_settled.py): a registry may show the previous manifest or fail a read for a moment after a copy
            uv run --frozen --no-dev python -I .github/scripts/registry_settled.py "${IMAGE}" "${tag}" "${SOURCE_DIGEST}"
            echo "promoted ${tag} -> ${SOURCE_DIGEST}"
          done

  # The required check, last in the graph (plan -> build or promote -> sign -> this). It runs unless the whole run was cancelled, and passes when the build passed (or the tested image was
  # promoted) or was skipped as docs-only, and fails when the plan, the build, the promotion or the signing failed.
  build_result:
    name: Build and push image
    needs: [plan, build_push, promote, sign]
    # not when the run was cancelled (a newer push to testing superseded it): a superseded run is not a failure and must not look like one
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Check the build result
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD_WANTED: ${{ needs.plan.outputs.build }}
          PROMOTE_WANTED: ${{ needs.plan.outputs.promote }}
          PUBLISH: ${{ needs.build_push.outputs.publish }}
          BUILD: ${{ needs.build_push.result }}
          PROMOTE: ${{ needs.promote.result }}
          SIGN: ${{ needs.sign.result }}
        run: uv run --frozen --no-dev python -I .github/scripts/aggregate_result.py

  sign:
    name: Sign and verify images
    needs: [build_push, promote]
    if: >-
      always() && (
      (needs.build_push.result == 'success' && needs.build_push.outputs.publish == 'true') ||
      needs.promote.result == 'success')
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python
        with:
          cache: false  # this job holds the signing key: no cache

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign
          cache: "false"   # the signing key is present in this job: install and verify cosign fresh, never restore it

      # Promote path: the digest was signed when `testing` was published; check it before and after
      # the retag (the promote job copies the tags in between) and never sign anything here
      - name: Verify the digest that was promoted is signed
        if: needs.promote.result == 'success'
        env:
          IMAGE: ${{ needs.promote.outputs.image }}
          DIGESTS: ${{ needs.promote.outputs.digests }}
        run: |
          set -euo pipefail
          for digest in ${DIGESTS}; do
            uv run --frozen --no-dev python -I .github/scripts/retry.py cosign verify --key cosign.pub "${IMAGE}@${digest}" > /dev/null
            echo "signed: ${digest}"
          done

      - name: Sign every pushed digest
        if: needs.build_push.result == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.build_push.outputs.image }}
          DIGESTS: ${{ needs.build_push.outputs.digests }}
        run: |
          set -euo pipefail
          [[ -n "${DIGESTS// /}" ]] || { echo "::error::No pushed digests to sign"; exit 1; }
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          for digest in ${DIGESTS}; do
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          done

      - name: Verify every pushed tag is signed
        env:
          IMAGE: ${{ needs.build_push.outputs.image || needs.promote.outputs.image }}
          ALIAS_TAGS: ${{ needs.build_push.outputs.alias_tags || needs.promote.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            uv run --frozen --no-dev python -I .github/scripts/retry.py cosign verify --key cosign.pub "${IMAGE}:${tag}" > /dev/null
            echo "signed: ${tag}"
          done

      # testing only (moving_tags is empty elsewhere): AFTER the digest is signed and verified, `testing` (and `testing-<date>`) move to it: a registry-side
      # copy that keeps the digest, a read-back, and a verification of the moved tags
      - name: Move the testing tags to the signed digest
        if: needs.build_push.outputs.moving_tags != ''
        env:
          IMAGE: ${{ needs.build_push.outputs.image }}
          DIGESTS: ${{ needs.build_push.outputs.digests }}
          MOVING_TAGS: ${{ needs.build_push.outputs.moving_tags }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev python -I .github/scripts/move_tags.py "${IMAGE}" "${DIGESTS}" ${MOVING_TAGS}
          for tag in ${MOVING_TAGS}; do
            uv run --frozen --no-dev python -I .github/scripts/retry.py cosign verify --key cosign.pub "${IMAGE}:${tag}" > /dev/null
            echo "signed: ${tag}"
          done

  # Starts the variant workflow (build-variant.yml, once per variant: dx and gx, each its OWN run that can be re-run on its own) for the commit just built, on the same
  # ref, so its run is recorded on that branch and its file is the branch's own. One-way: it needs the base's aggregate result,
  # nothing of the base needs it. always() because the implicit success() is false when any ancestor job was skipped (promote on
  # a testing push). It waits until the variant run EXISTS (not until it ends) and fails if none appears; re-running this job alone
  # (or one matrix leg: "re-run failed jobs") dispatches again. Only for main and testing; there is no pull_request trigger.
  # The two legs are independent (`fail-fast: false`): a failed dispatch of one leaves the other running, and neither waits for the other or for the
  # variant runs, which have their own concurrency groups, sign jobs and results (2026-11-17: one matrix job replaced dispatch_dx and dispatch_gx).
  dispatch_variant:
    name: Start the ${{ matrix.variant }} build
    needs: [build_result, build_push, promote]
    if: always() && needs.build_result.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    strategy:
      fail-fast: false
      matrix:
        variant: [dx, gx]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Dispatch the variant workflow on this ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          VARIANT: ${{ matrix.variant }}
          # main: the digest of the default image this run published or promoted (empty when nothing new was built: a docs-only
          # merge or an unchanged scheduled run); the variant builds on exactly that digest. The default image's own `latest` moves in the
          # `publish` job, which does not wait for the variants and which they do not wait for. Empty on testing.
          BASE_DIGEST: ${{ github.ref == 'refs/heads/main' && (needs.build_push.outputs.digests || needs.promote.outputs.digests) || '' }}
        run: uv run --frozen --no-dev python -I .github/scripts/dispatch_variant.py "${{ github.ref == 'refs/heads/testing' && 'testing' || 'latest' }}" "${GITHUB_SHA}" "${BASE_DIGEST}"

  # Main only: the default image's OWN `latest` moves to the digest this run built or promoted, after its signature was checked by the sign job (the dated tags
  # exist already). Independent of the dx image (2026-11-16): nothing waits for dx and dx never gates it. Nothing new (a docs-only merge, an unchanged
  # scheduled run) means no digest and no publish. Called, not dispatched: the digest is handed over and the job re-runs with "re-run failed jobs".
  publish:
    name: Publish latest
    needs: [build_result, build_push, promote, sign]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.build_result.result == 'success' &&
      (needs.build_push.outputs.digests != '' || needs.promote.outputs.digests != '')
    uses: ./.github/workflows/publish-latest.yml
    permissions:
      contents: read
      packages: write
    with:
      image: default
      digest: ${{ needs.build_push.outputs.digests || needs.promote.outputs.digests }}

  # A failed daily or promotion build of the default image (or of its publish step): ONE issue (label ci-failure-default, a comment per further failure, closed by the next green run), like the dx and publish alerts: a scheduled run
  # that fails e-mails nobody who is not watching Actions. A cancelled run raises nothing and closes nothing. Needs issues: write only.
  alert:
    name: Report a failed daily or promotion build of the default image
    needs: [plan, build_push, promote, build_result, publish]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Open the failure issue or comment on it
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          LABEL: ci-failure-default
          LABEL_DESC: the default image build on main failed (one open issue at a time)
          ISSUE_TITLE: "The default image build on main failed"
          ISSUE_BODY: "The scheduled or promotion build of octarine-os on main (or the move of its latest) failed, so latest may be stale (the daily rebuild refreshes it). See the run for the failed job. Later failures are added to this issue as comments; it closes itself when a run succeeds. Where to look: CLAUDE.md, CI and signing flow."
          FAIL_COMMENT: "daily or promotion build of the default image failed again"
        run: uv run --frozen --no-dev python -I .github/scripts/ci_issue.py fail

      - name: Close the issue when the run succeeded
        if: needs.build_result.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          LABEL: ci-failure-default
          RECOVER_COMMENT: "the next daily or promotion build of the default image succeeded"
        run: uv run --frozen --no-dev python -I .github/scripts/ci_issue.py recover
