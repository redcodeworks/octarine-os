---
name: Fedora base gap analysis
# A monthly experiment, never a product: the normal octarine-os Containerfile built on Fedora's OFFICIAL Silverblue base
# (quay.io/fedora-ostree-desktops/silverblue) instead of Universal Blue's, to learn what a move off the Universal Blue base would cost.
# The deliverable is the GAP REPORT (job summary, one issue labelled gap-fedora-base per run, complete diffs as an artifact kept 90 days):
# where the build stops (or that it builds), and the differences of packages, repositories, enabled units, the ublue-os files, dconf and
# Flatpak defaults between the two bases and, when the build works, between the result and the published default image.
# The image built here is NEVER pushed, tagged or signed, and nothing here touches `latest`, `testing`, `beta` or any other tag. A failed
# build of the image is an EXPECTED result: it is recorded in the report and the run still succeeds. The run fails only when the workflow
# could not produce a report. Scheduled workflows run from main only; workflow_dispatch also works from other branches (testing).
# Day 1 of the month at 15:00 UTC: after the daily build (11:00), away from the weekly slots. Design in CLAUDE.md.
on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Tag of the official base (45, 44, rawhide...)"
        default: "45"
        required: false
      base_image:
        description: "Official base image repository"
        default: "quay.io/fedora-ostree-desktops/silverblue"
        required: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: gap
  # os-release IMAGE_VERSION of this experiment is gap-<date>-<sha>; it is never published
  IMAGE_VERSION_PREFIX: gap-

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The prebuilt binaries (sched_ext schedulers, libextest.so, optional ghostty): the same image the other builds use, built once per tree
  # hash. Nothing of this workflow publishes it; it is the shared pipeline's own work.
  binaries:
    name: Prebuilt binaries image
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
      packages: write
      issues: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  gap:
    name: Build on the official base and write the gap report
    needs: binaries
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      issues: write
    env:
      OFFICIAL_IMAGE: ${{ inputs.base_image || 'quay.io/fedora-ostree-desktops/silverblue' }}
      OFFICIAL_TAG: ${{ inputs.fedora_version || '45' }}
      UBLUE_IMAGE: ghcr.io/ublue-os/silverblue-main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the inputs
        run: |
          [[ "${OFFICIAL_TAG}" =~ ^([0-9]+|rawhide)$ ]] || { echo "::error::fedora_version must be a number or rawhide"; exit 1; }
          [[ "${OFFICIAL_IMAGE}" =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$ ]] || { echo "::error::base_image is not an image repository name"; exit 1; }

      # Same disk policy as the image builds: the cleanup action only when less than 60 GiB are free
      - name: Check disk space
        id: disk
        run: |
          free=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          df -h /
          echo "Free at the start: ${free} GiB"
          echo "low=$([ "${free}" -lt 60 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Maximize build space (fallback, only when the disk is low)
        if: steps.disk.outputs.low == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Image Name
        run: |
          IMAGE_NAME=$(just image_name)
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"

      # As in the other image workflows: format check and cosign verification of the pinned brew image
      - name: Verify the brew image pin
        run: |
          tag=$(sed -n 's/^ARG BREW_TAG=//p' Containerfile)
          digest=$(sed -n 's/^ARG BREW_DIGEST=//p' Containerfile)
          [[ "${tag}" =~ ^[0-9]{8}$ ]] || { echo "::error::BREW_TAG missing or not a YYYYMMDD tag in the Containerfile"; exit 1; }
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::BREW_DIGEST missing or not sha256:<64 hex> in the Containerfile"; exit 1; }
          cosign verify --key keys/ublue-os-brew-cosign.pub "ghcr.io/ublue-os/brew@${digest}" > /dev/null
          echo "Brew image pinned and signed: ghcr.io/ublue-os/brew:${tag}@${digest}"

      - name: Login to GitHub Container Registry (to pull the binaries image and the published image)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the binaries image
        env:
          BIN_IMAGE: ${{ needs.binaries.outputs.image }}
          BIN_DIGEST: ${{ needs.binaries.outputs.digest }}
        run: .github/scripts/binaries-use.sh "${BIN_IMAGE}" "${BIN_DIGEST}"

      # The three reference points. The official tag is resolved to a digest once (the official images carry no cosign signature that this
      # repository pins a key for, so the digest is the record; the image is built and inspected, never published or run outside the build).
      # The Universal Blue base goes through base-pin.sh (digest plus signature, fail closed) like every other build; the published default image
      # is verified with this repository's key.
      - name: Resolve and pull the bases and the published default image
        run: |
          set -euo pipefail
          official="${OFFICIAL_IMAGE}:${OFFICIAL_TAG}"
          manifest=$(skopeo inspect --raw "docker://${official}") || { echo "::error::Cannot resolve ${official}"; exit 1; }
          OFFICIAL_PIN="sha256:$(printf '%s' "${manifest}" | sha256sum | sed 's/ .*//')"
          echo "OFFICIAL_PIN=${OFFICIAL_PIN}" >> "${GITHUB_ENV}"
          echo "Official base ${official} resolved to ${OFFICIAL_PIN}"
          podman pull "${OFFICIAL_IMAGE}@${OFFICIAL_PIN}" > /dev/null
          # Universal Blue has numbered tags only: for rawhide compare with the default Fedora release of the Containerfile
          ublue_tag=${OFFICIAL_TAG}
          [[ "${ublue_tag}" =~ ^[0-9]+$ ]] || ublue_tag=$(sed -n 's/^ARG FEDORA_VERSION=//p' Containerfile)
          pin_line=$(BASE_IMAGE="${UBLUE_IMAGE}" FEDORA_VERSION="${ublue_tag}" .github/scripts/base-pin.sh)
          UBLUE_PIN=${pin_line#BASE_PIN=}
          echo "UBLUE_PIN=${UBLUE_PIN}" >> "${GITHUB_ENV}"
          podman pull "${UBLUE_IMAGE}@${UBLUE_PIN}" > /dev/null
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          cosign verify --key cosign.pub "${ref}" > /dev/null
          podman pull "${ref}" > /dev/null
          echo "REFERENCE_IMAGE=${ref}" >> "${GITHUB_ENV}"
          echo "Reference (published default image): ${ref}"

      # The build may fail: that is a result. The step records the outcome and the log and always succeeds; only a problem before this
      # point (no base, no binaries) fails the run.
      - name: Build the image on the official base (a failure is recorded, not raised)
        id: build
        env:
          BASE_IMAGE: ${{ env.OFFICIAL_IMAGE }}
          FEDORA_VERSION: ${{ env.OFFICIAL_TAG }}
        run: |
          set +e
          mkdir -p gap
          BASE_PIN="${OFFICIAL_PIN}" just build "${IMAGE_NAME}" "${DEFAULT_TAG}" > gap/build.log 2>&1
          rc=$?
          if [[ ${rc} -eq 0 ]] && podman image exists "${IMAGE_NAME}:${DEFAULT_TAG}"; then outcome=built; else outcome=failed; fi
          echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"
          echo "Build outcome: ${outcome} (exit ${rc}); log lines: $(wc -l < gap/build.log)"
          exit 0

      - name: Collect the facts of every image
        env:
          OUTCOME: ${{ steps.build.outputs.outcome }}
        run: |
          set -euo pipefail
          collect() {
            podman run --rm --network none -v "${PWD}/.github/scripts/gap-collect.sh:/gap-collect.sh:ro" -v "${PWD}/gap/$1:/out" "$2" bash /gap-collect.sh /out
          }
          mkdir -p gap/official gap/ublue gap/reference gap/built
          collect official "${OFFICIAL_IMAGE}@${OFFICIAL_PIN}"
          collect ublue "${UBLUE_IMAGE}@${UBLUE_PIN}"
          collect reference "${REFERENCE_IMAGE}"
          if [[ "${OUTCOME}" == built ]]; then collect built "${IMAGE_NAME}:${DEFAULT_TAG}"; fi
          wc -l gap/*/packages.txt

      - name: Write the report
        id: report
        env:
          OUTCOME: ${{ steps.build.outputs.outcome }}
        run: |
          set -euo pipefail
          built=()
          [[ "${OUTCOME}" == built ]] && built=(--built gap/built)
          .github/scripts/gap-report.sh --out gap/report --ublue gap/ublue --official gap/official --reference gap/reference "${built[@]}" \
            --outcome "${OUTCOME}" --log gap/build.log \
            --meta "Official base=${OFFICIAL_IMAGE}:${OFFICIAL_TAG} (${OFFICIAL_PIN})" \
            --meta "Universal Blue base=${UBLUE_IMAGE} (${UBLUE_PIN})" \
            --meta "Reference=${REFERENCE_IMAGE}" \
            --meta "Commit=${GITHUB_SHA}" \
            --meta "Run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cp gap/build.log gap/report/build.log
          test -s gap/report/report.md
          cat gap/report/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the complete diffs and the log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gap-report
          path: gap/report
          retention-days: 90

      # One issue per run, the older open ones are closed with a pointer
      - name: Open the issue of this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.build.outputs.outcome }}
        run: |
          .github/scripts/gap-issue.sh "Official Fedora base gap analysis $(date -u +%Y-%m-%d): build ${OUTCOME} on ${OFFICIAL_TAG}" gap/report/report.md
