name: Prebuilt binaries
# Builds ghcr.io/redcodeworks/octarine-os-binaries from the components of binaries/ (binaries/components.tsv: scx, extest and ghostty, all
# required) and hands its digest to the image build. Called by build.yml before its image build (the dx
# and NVIDIA variants inherit the binaries from the default image); it can also be dispatched by hand to validate a change on a branch.
#
# One build job per component (binaries-component.yml, a matrix over components.tsv): each has its own content key (binaries-key.sh) and
# its own signed component image (tag c-<component>-<key>, same package); a change to one component does not rebuild the others (a change
# to lib/ or the builder pin rebuilds all). The assemble job then puts what each component produced into ONE image, tagged with the
# assembled key (sha1 over the included "name key" lines; binaries-key.sh), which the image build copies from by digest. There is no
# fallback to an older image: a component that cannot be built fails the run (the previous `latest` stays, nothing is published;
# binaries-decide.sh and binaries-assemble.sh hold the rules).
#
# Only testing and main publish; on any other ref (a validation dispatch) components are built and checked but never pushed or signed,
# no digest is handed over, and the image build then stops with an instruction (binaries-use.sh).
#
# Nothing rebuilds the binaries on a timer: they and their pins (Zig and the builder included) change only through a pull request that is
# approved and merged, and then build.yml's call here builds them. To rebuild by hand: `gh workflow run binaries.yml --ref <branch>`.
on:
  workflow_call:
    secrets:
      SIGNING_SECRET:
        description: "the cosign private key of the images (the sign jobs need it); callers pass only this secret"
        required: false
    outputs:
      digest:
        description: "manifest digest of the published, signed assembled binaries image (empty when it was only built for validation)"
        value: ${{ jobs.result.outputs.digest }}
      image:
        description: registry path of the binaries image
        value: ${{ jobs.result.outputs.image }}
      action:
        description: "which path the assembled image took: reused (a signed image for the key existed), built (assembled, pushed and signed) or validated (nothing can be published on this ref)"
        value: ${{ jobs.result.outputs.action }}
      hash:
        description: the assembled key (the image tag)
        value: ${{ jobs.result.outputs.hash }}
  workflow_dispatch:

env:
  IMAGE_NAME: octarine-os-binaries

jobs:
  plan:
    name: Components
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Components of binaries/components.tsv
        id: matrix
        run: |
          set -euo pipefail
          m=$(grep -vE '^[[:space:]]*(#|$)' binaries/components.tsv | jq -Rsc '{include: [split("\n")[] | select(length > 0) | split("\t") | {name: .[0]}]}')
          echo "matrix=${m}" >> "${GITHUB_OUTPUT}"
          echo "${m}"

  component:
    name: Component ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/binaries-component.yml
    with:
      component: ${{ matrix.name }}
    permissions:
      contents: read
      packages: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  assemble:
    name: Assemble the binaries image
    needs: [plan, component]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      key: ${{ steps.decide.outputs.key }}
      components: ${{ steps.decide.outputs.components }}
      image: ${{ steps.names.outputs.image }}
      usable: ${{ steps.final.outputs.usable }}
      published: ${{ steps.channel.outputs.publish }}
      ok: ${{ steps.record.outputs.ok }}
      digest: ${{ steps.final.outputs.digest }}
      pushed: ${{ steps.push.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a missing artifact is a component that did not finish: binaries-assemble.sh counts it (counted as failed). A FAILED DOWNLOAD is
      # different: it is retried twice, and when all three tries fail the job fails with "could not read the results" (a workflow problem), never as "a required component failed"
      - name: Fetch the results of the components
        id: fetch1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binres-*
          merge-multiple: true
          path: ${{ runner.temp }}/binres

      - name: Fetch the results of the components (retry 1)
        id: fetch2
        if: steps.fetch1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binres-*
          merge-multiple: true
          path: ${{ runner.temp }}/binres

      - name: Fetch the results of the components (retry 2)
        id: fetch3
        if: steps.fetch1.outcome == 'failure' && steps.fetch2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binres-*
          merge-multiple: true
          path: ${{ runner.temp }}/binres

      - name: The results could not be read
        if: steps.fetch1.outcome == 'failure' && steps.fetch2.outcome == 'failure' && steps.fetch3.outcome == 'failure'
        run: |
          echo "::error::could not read the results of the components: the artifact download failed three times. This is a problem of the workflow run (GitHub's artifact service), NOT a failed component build: re-run the failed jobs."
          exit 1

      - name: What goes into the image
        id: decide
        run: .github/scripts/binaries-assemble.sh binaries/components.tsv "${RUNNER_TEMP}/binres" "${RUNNER_TEMP}/image"

      - name: Choose channel
        id: channel
        env:
          REF: ${{ github.ref }}
        run: |
          publish=false
          case "${REF}" in
            refs/heads/main | refs/heads/testing) publish=true ;;
          esac
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish} (only testing and main publish; any other ref builds for validation)"

      - name: Published and signed already?
        id: lookup
        if: steps.decide.outputs.action == 'assemble'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          KEY: ${{ steps.decide.outputs.key }}
        run: .github/scripts/binaries-lookup.sh "${IMAGE}" "${KEY}"

      # the assembled image of this key is reused when it exists and verifies
      - name: Usable
        id: final
        env:
          LOOKUP: ${{ steps.lookup.outputs.usable }}
          LOOKUP_DIGEST: ${{ steps.lookup.outputs.digest }}
        run: |
          usable=${LOOKUP:-false}
          echo "usable=${usable}" >> "${GITHUB_OUTPUT}"
          [[ "${usable}" != true ]] || echo "digest=${LOOKUP_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "usable=${usable}"

      # Assemble from the component images by digest (each verified again), layout check, push. A failure does not fail the job:
      # the record step says, the result job decides.
      - name: Assemble
        id: assemble
        if: steps.decide.outputs.action == 'assemble' && steps.final.outputs.usable != 'true'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          KEY: ${{ steps.decide.outputs.key }}
          COMPONENTS: ${{ steps.decide.outputs.components }}
        run: |
          set -euo pipefail
          content="${RUNNER_TEMP}/image"
          names=()
          while IFS=$'\t' read -r name _ _ _ digest; do
              [[ -n "${name}" ]] || continue
              [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${name}"; exit 1; }
              cosign verify --key cosign.pub "${IMAGE}@${digest}" > /dev/null
              id=$(podman create "${IMAGE}@${digest}" /nonexistent)
              podman export "${id}" | tar -x -C "${content}"
              podman rm "${id}" > /dev/null
              names+=("${name}")
          done < "${content}/COMPONENTS"
          binaries/lib/assemble.sh "${content}"
          podman build \
            --build-arg "IMAGE_VERSION=${KEY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_COMPONENTS=${COMPONENTS}" \
            --tag "${IMAGE_NAME}:${KEY}" \
            --file binaries/lib/assemble.Containerfile "${content}"
          id=$(podman create "${IMAGE_NAME}:${KEY}" /nonexistent)
          podman export "${id}" | tar -t > "${RUNNER_TEMP}/listing.txt"
          podman rm "${id}" > /dev/null
          .github/scripts/binaries-layout.sh --assembled "${RUNNER_TEMP}/listing.txt" binaries/scx/schedulers.tsv "${names[@]}"

      # One push under the assembled key: one manifest digest, which the signature belongs to
      - name: Push
        id: push
        if: steps.assemble.outcome == 'success' && steps.channel.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          KEY: ${{ steps.decide.outputs.key }}
        run: .github/scripts/push-tags.sh "${IMAGE_NAME}:${KEY}" "${IMAGE}" "${KEY}"

      - name: Record
        id: record
        if: always()
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          USABLE: ${{ steps.final.outputs.usable }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          PUSH: ${{ steps.push.outcome }}
          PUBLISH: ${{ steps.channel.outputs.publish }}
        run: |
          ok=false
          if [[ "${ACTION}" == assemble && ( "${USABLE}" == true || ( "${ASSEMBLE}" == success && ( "${PUBLISH}" != true || "${PUSH}" == success ) ) ) ]]; then ok=true; fi
          echo "ok=${ok}" >> "${GITHUB_OUTPUT}"

  sign:
    name: Sign the binaries image
    needs: assemble
    if: needs.assemble.result == 'success' && needs.assemble.outputs.ok == 'true' && needs.assemble.outputs.usable != 'true' && needs.assemble.outputs.published == 'true'
    runs-on: ubuntu-26.04
    environment: signing
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.sign.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Sign and verify
        id: sign
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.assemble.outputs.image }}
          KEY: ${{ needs.assemble.outputs.key }}
          DIGEST: ${{ needs.assemble.outputs.pushed }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No pushed digest to sign"; exit 1; }
          # the old bundle format, as for the images (https://github.com/containers/container-libs/issues/388)
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify --key cosign.pub "${IMAGE}:${KEY}" > /dev/null
          echo "signed: ${IMAGE}:${KEY} = ${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  result:
    name: Binaries image digest
    needs: [assemble, sign]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pick.outputs.digest }}
      action: ${{ steps.pick.outputs.action }}
      hash: ${{ needs.assemble.outputs.key }}
      image: ${{ needs.assemble.outputs.image }}
    steps:
      - name: Pick the digest
        id: pick
        env:
          ASSEMBLE: ${{ needs.assemble.result }}
          ACTION: ${{ needs.assemble.outputs.action }}
          OK: ${{ needs.assemble.outputs.ok }}
          USABLE: ${{ needs.assemble.outputs.usable }}
          REUSE_DIGEST: ${{ needs.assemble.outputs.digest }}
          PUBLISHED: ${{ needs.assemble.outputs.published }}
          KEY: ${{ needs.assemble.outputs.key }}
          SIGN: ${{ needs.sign.result }}
          SIGN_DIGEST: ${{ needs.sign.outputs.digest }}
        run: |
          set -euo pipefail
          err() { echo "::error::$*"; exit 1; }
          [[ "${ASSEMBLE}" == success ]] || err "The binaries could not be put together (${ASSEMBLE}): a component failed or has no result, see the component jobs"
          if [[ "${ACTION}" == validated ]]; then
            echo "Binaries image: components built for validation only (a ref that cannot publish), nothing is assembled, pushed or signed" >> "${GITHUB_STEP_SUMMARY}"
            { echo "digest="; echo "action=validated"; } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${ACTION}" == assemble ]] || err "Unexpected decision '${ACTION}'"
          [[ "${OK}" == true ]] || err "Assembling or pushing the binaries image failed (see the assemble job)"
          if [[ "${USABLE}" == true ]]; then
            echo "Binaries image: reused \`${KEY}\` (digest \`${REUSE_DIGEST}\`, signature verified, no assembly)" >> "${GITHUB_STEP_SUMMARY}"
            { echo "digest=${REUSE_DIGEST}"; echo "action=reused"; } >> "${GITHUB_OUTPUT}"
          elif [[ "${PUBLISHED}" == true ]]; then
            [[ "${SIGN}" == success ]] || err "Signing the binaries image failed (${SIGN})"
            echo "Binaries image: assembled \`${KEY}\`, signed and published (digest \`${SIGN_DIGEST}\`)" >> "${GITHUB_STEP_SUMMARY}"
            { echo "digest=${SIGN_DIGEST}"; echo "action=built"; } >> "${GITHUB_OUTPUT}"
          else
            echo "Binaries image: assembled \`${KEY}\` for validation only (this ref does not publish), nothing was pushed or signed" >> "${GITHUB_STEP_SUMMARY}"
            { echo "digest="; echo "action=validated"; } >> "${GITHUB_OUTPUT}"
          fi
