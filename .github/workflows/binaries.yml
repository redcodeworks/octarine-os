name: Prebuilt binaries
# Builds ghcr.io/redcodeworks/octarine-binaries and promotes it. ONE build: binaries/Containerfile is a multi-stage build with a stage per component
# (binaries/components.tsv: scx, extest and ghostty, all required) and an assemble stage; a component that cannot be built fails the whole build, nothing is
# pushed and `testing` stays where it was (atomic). The image build (build.yml) does not call this workflow: on testing it installs from octarine-binaries:testing,
# elsewhere from octarine-binaries:latest, which only the promote job below moves.
#
# On testing (a push that touches binaries/ or this pipeline, or a dispatch): `build` builds the image, checks its layout and pushes it under its key tag (the git tree
# id of binaries/, binaries-key.sh, also its version label); `sign` signs that digest and only THEN moves `testing` to it, so the image build never sees an unsigned `testing`.
#
# On main (the promotion of testing into main, or a dispatch): the promote job retags the tested, signed `testing` image to `latest` (binaries-promote.sh; no rebuild;
# it fails unless `testing` was built from exactly the binaries/ of this commit). It starts no image build: main promotes the tested image, which already carries these binaries.
#
# Any other ref (a dispatch from a branch) builds for validation only and publishes nothing. Nothing rebuilds the binaries on a timer: they and their pins
# change only through a pull request the owner approves. To rebuild by hand: `gh workflow run binaries.yml --ref testing`; to promote by hand: `--ref main`.
on:
  push:
    branches:
      - testing
      - main
    paths:
      - 'binaries/**'
      - '.github/workflows/binaries.yml'
      - '.github/scripts/binaries-*.sh'
  workflow_dispatch:

# one run per ref at a time, none cancelled: two runs never push `testing` out of order
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: octarine-binaries

jobs:
  build:
    name: Build the binaries image
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.channel.outputs.publish }}
      image: ${{ steps.names.outputs.image }}
      key: ${{ steps.key.outputs.key }}
      digest: ${{ steps.push.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Key
        id: key
        run: echo "key=$(.github/scripts/binaries-key.sh)" >> "${GITHUB_OUTPUT}"

      - name: Channel
        id: channel
        env:
          REF: ${{ github.ref }}
        run: |
          publish=false
          [[ "${REF}" != refs/heads/testing ]] || publish=true
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish} (only testing publishes; any other ref builds for validation)"

      # the pinned builder, every component in its own stage; any failing stage fails this step and the run
      - name: Build
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          builder=$(sed -n 's/^BUILDER=//p' binaries/builder.env)
          [[ "${builder}" =~ ^registry\.fedoraproject\.org/fedora:[0-9]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::binaries/builder.env has no digest-pinned BUILDER"; exit 1; }
          podman build \
            --build-arg "BUILDER=${builder}" \
            --build-arg "IMAGE_VERSION=${KEY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE_NAME}:${KEY}" \
            --file binaries/Containerfile binaries
          id=$(podman create "${IMAGE_NAME}:${KEY}" /nonexistent)
          podman export "${id}" | tar -t > "${RUNNER_TEMP}/listing.txt"
          podman rm "${id}" > /dev/null
          .github/scripts/binaries-layout.sh --assembled "${RUNNER_TEMP}/listing.txt" binaries/scx/schedulers.tsv $(grep -vE '^[[:space:]]*(#|$)' binaries/components.tsv | cut -f1)

      - name: Login to GitHub Container Registry
        if: steps.channel.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One push under the key tag: one manifest digest, which the signature belongs to. `testing` is not touched here (the sign job moves it after signing).
      - name: Push under the key tag
        id: push
        if: steps.channel.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          KEY: ${{ steps.key.outputs.key }}
        run: .github/scripts/push-tags.sh "${IMAGE_NAME}:${KEY}" "${IMAGE}" "${KEY}"

  sign:
    name: Sign the binaries image and move testing
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    environment: signing
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Sign, then move testing
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          KEY: ${{ needs.build.outputs.key }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No pushed digest to sign"; exit 1; }
          # the old bundle format, as for the images (https://github.com/containers/container-libs/issues/388)
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null
          # signed: now `testing` may point at it (a registry-side copy, the same digest)
          .github/scripts/retry.sh skopeo copy --all --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:testing"
          .github/scripts/registry-settled.sh "${IMAGE}" testing "${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}:testing" > /dev/null
          echo "signed: ${IMAGE}:${KEY} and :testing = ${DIGEST}"
          echo "Binaries image: key \`${KEY}\`, signed and published as \`testing\` (digest \`${DIGEST}\`)" >> "${GITHUB_STEP_SUMMARY}"

  # main: the testing image becomes latest (see binaries-promote.sh). Nothing else moves latest.
  promote:
    name: Promote the tested binaries image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Retag testing to latest
        id: promote
        run: .github/scripts/binaries-promote.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
