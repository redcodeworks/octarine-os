---
name: Publish latest
# Moves the bare `latest` tag of ONE image: the default image (octarine-os) or the dx image (octarine-os-dx); gx joins the `image` choice when it exists.
# Every image publishes its OWN `latest`, after its own signed build or its own promotion, independently of the others (2026-11-16). The main build and the
# promotion publish dated tags only. Details and the failure table: CLAUDE.md "Publishing latest (one image at a time)".
#
#   workflow_call      from the build run of that image on main (build.yml for the default image, build-dx.yml for dx): the image and its digest
#   workflow_dispatch  by hand, on main: the image and (for the default image optionally) a dated tag of it; dry_run (or any ref but main) only
#                      plans and reports: nothing is written
#
# No `signing` environment: the workflow only copies manifests and verifies signatures, it never signs, so the secret is not needed and an
# environment would be a gate without a safety property (the dispatch is already a write action). It writes only on main (the script is
# forced to a dry run on any other ref), never cancels a running publish, and is idempotent.
on:
  workflow_call:
    inputs:
      image:
        description: "Which image: default or dx"
        type: string
        required: true
      digest:
        description: "Digest of that image to publish"
        type: string
        required: true
      dry_run:
        description: "Plan only"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image:
        description: "Which image's latest moves"
        type: choice
        options:
          - default
          - dx
        default: default
      tag:
        description: "Dated tag of that image (latest-<sha7>, latest-<date>-<sha7>, <date>-<sha7>); empty = for the default image the newest main commit with a published image, a variant needs its tag"
        type: string
        default: ""
      reason:
        description: "Why (free text, goes into the run summary)"
        type: string
        default: ""
      dry_run:
        description: "Plan and report only"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Move latest
    runs-on: ubuntu-26.04
    # one publish per image at a time, a running one is never cancelled (a pending one may be replaced by a newer one: each carries its whole target);
    # the images do not wait for each other
    concurrency:
      group: publish-latest-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout with the full history (the main commit of an image is checked against it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      # a checkout of another ref has no origin/main of its own: fetch it, the ancestor checks read it
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Verify the image and move its latest
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          # in a called workflow github.event_name is the CALLER's event, so the inputs of each trigger are told apart by name: an input
          # the trigger does not declare is empty
          DIGEST: ${{ inputs.digest || '' }}
          TAG: ${{ inputs.tag || '' }}
          REASON: ${{ inputs.reason || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          # writes only on main; any other ref is a dry run whatever the input says
          WRITE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: .github/scripts/publish-latest.sh
