---
name: Build beta image
# The beta channel: the normal octarine-os image built on Universal Blue's beta base (ghcr.io/ublue-os/silverblue-main:beta)
# and published as the moving tag `ghcr.io/<owner>/octarine-os:beta` plus a dated tag `beta-<date>-<sha>` (the daily
# build's naming; prune-testing.yml keeps the newest three dated beta builds), so a failure that a coming Fedora release
# would cause shows up as a red scheduled run before the base moves. Weekly (Wednesday 14:00 UTC: the daily build.yml runs
# at 11:00 UTC, build-nvidia.yml on Sunday 12:00 and prune-testing.yml on Sunday 05:00, so nothing overlaps) plus manual
# dispatch. Never runs on pushes or pull requests and is not a required check. Never touches `latest`, `testing` or dated tags. A separate small workflow because build.yml is built around
# testing/promote/docs-only semantics; setup, base check, build, smoke test, rechunk, push and signing are the same
# steps (the smoke test is a copy, tests/beta-channel.sh fails when the two drift). Design in CLAUDE.md.
on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # For this workflow only (the repository variables BASE_IMAGE/FEDORA_VERSION belong to the daily build and are ignored here).
  # FEDORA_VERSION is the tag of the base image: the Containerfile builds FROM ${BASE_IMAGE}:${FEDORA_VERSION}.
  BASE_IMAGE: ghcr.io/ublue-os/silverblue-main
  FEDORA_VERSION: beta
  DEFAULT_TAG: beta
  # os-release IMAGE_VERSION of this channel is beta-<date>-<sha>: the beta image is never promoted (`just build` reads this)
  IMAGE_VERSION_PREFIX: beta-

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The prebuilt binaries (sched_ext schedulers, libextest.so) from binaries/: built once per tree hash, signed, reused. The
  # job gates the image build only; it has no required check name (see binaries.yml).
  binaries:
    name: Prebuilt binaries image
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
      packages: write
    # the signing secret is a repository secret, which a called workflow only gets when it is passed on
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  # The repository's own tests, run INSIDE the beta base the image is built on (the same test-suite action as the required `test` check, which runs on the stable base): a
  # change that only a coming Fedora or a new Universal Blue beta breaks fails here, in that Fedora, BEFORE the expensive build, and blocks the beta publish (the build job
  # needs this job). The base is resolved by the same base-pin.sh as the build step below (one beta base per run except in the rare race of a base published between the two).
  base:
    name: Beta base for the tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Resolve the beta base to a digest and verify it
        id: pin
        run: |
          pin_line=$(.github/scripts/base-pin.sh)
          BASE_PIN=${pin_line#BASE_PIN=}
          [[ "${BASE_PIN}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no base digest from base-pin.sh"; exit 1; }
          echo "image=${BASE_IMAGE}@${BASE_PIN}" >> "${GITHUB_OUTPUT}"
          echo "Tests run on ${BASE_IMAGE}:${FEDORA_VERSION} = ${BASE_PIN}" | tee -a "${GITHUB_STEP_SUMMARY}"

  tests:
    name: Tests on the beta base
    needs: base
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: ${{ needs.base.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the tests
        uses: ./.github/actions/test-suite

  build:
    name: Build beta image
    needs: [binaries, tests]
    runs-on: ubuntu-26.04

    outputs:
      image: ${{ steps.names.outputs.image }}
      digests: ${{ steps.push-image.outputs.digests }}
      alias_tags: ${{ steps.tags.outputs.alias_tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The runner has a 145 GB root disk with about 88 GB free before anything is removed (measured 2026-11-14 on ubuntu-26.04: the default
      # image build peaks at 44 GB used, 18 GB more than the 26 GB left after the cleanup action), so the cleanup action (38 to 85 s) is
      # only the FALLBACK now: it runs when less than 60 GiB is free at the start.
      - name: Check disk space
        id: disk
        run: |
          free=$(df --output=avail -BG / | tail -n1 | tr -dc 0-9)
          df -h /
          echo "Free at the start: ${free} GiB"
          echo "low=$([ "${free}" -lt 60 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

      - name: Maximize build space (fallback, only when the disk is low)
        if: steps.disk.outputs.low == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Prepare environment
        id: names
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # As in build.yml: a format check of the pinned brew image, and always a cosign verify (a scheduled run has no before-commit)
      - name: Check the brew image pin
        run: |
          tag=$(sed -n 's/^ARG BREW_TAG=//p' Containerfile)
          digest=$(sed -n 's/^ARG BREW_DIGEST=//p' Containerfile)
          [[ "${tag}" =~ ^[0-9]{8}$ ]] || { echo "::error::BREW_TAG missing or not a YYYYMMDD tag in the Containerfile"; exit 1; }
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::BREW_DIGEST missing or not sha256:<64 hex> in the Containerfile"; exit 1; }
          echo "Brew image pinned: ghcr.io/ublue-os/brew:${tag}@${digest}"
          echo "BREW_PIN=ghcr.io/ublue-os/brew@${digest}" >> "${GITHUB_ENV}"

      - name: Verify the brew image signature
        run: |
          .github/scripts/retry.sh cosign verify --key keys/ublue-os-brew-cosign.pub "${BREW_PIN}" > /dev/null
          echo "Signature of ${BREW_PIN} is valid"

      # The prebuilt binaries image (octarine-os-binaries, built from binaries/ by the binaries job): verify the digest it
      # handed over with this repository's key, log it and pass it to the build as BINARIES_IMAGE
      - name: Set up cosign (binaries image)
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry (to pull the binaries image)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the binaries image
        env:
          BIN_IMAGE: ${{ needs.binaries.outputs.image }}
          BIN_DIGEST: ${{ needs.binaries.outputs.digest }}
        run: .github/scripts/binaries-use.sh "${BIN_IMAGE}" "${BIN_DIGEST}"

      - name: Say which path the binaries image took
        env:
          ACTION: ${{ needs.binaries.outputs.action }}
          HASH: ${{ needs.binaries.outputs.hash }}
        run: echo "Binaries image ${ACTION} (\`${HASH}\`, digest \`${BINARIES_IMAGE##*@}\`)" >> "${GITHUB_STEP_SUMMARY}"

      # Fail early and clearly if the beta base cannot be pulled (the tag only exists while Universal Blue builds a beta)
      - name: Check the base image can be pulled
        run: |
          base="${BASE_IMAGE}:${FEDORA_VERSION}"
          echo "BASE_REF=${base}" >> "${GITHUB_ENV}"
          # the floating tag is resolved to a digest ONCE here and its signature is verified with the pinned Universal Blue key (fail closed);
          # everything after this step uses that digest, so one run uses one base
          pin_line=$(.github/scripts/base-pin.sh)
          BASE_PIN=${pin_line#BASE_PIN=}
          [[ "${BASE_PIN}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no base digest from base-pin.sh"; exit 1; }
          if ! .github/scripts/retry.sh podman pull "${BASE_IMAGE}@${BASE_PIN}" >/dev/null; then
            echo "::error::Cannot pull the base image ${base}: does that tag exist? (list tags with: skopeo list-tags docker://${BASE_IMAGE})"
            exit 1
          fi
          podman image inspect "${BASE_IMAGE}@${BASE_PIN}" --format 'Base image {{.Id}} created {{.Created}}'
          digest=$(podman image inspect "${BASE_IMAGE}@${BASE_PIN}" --format '{{.Digest}}')
          [[ "${digest}" == sha256:* ]] || { echo "::error::Cannot determine the digest of ${base}"; exit 1; }
          echo "Base image ${base} resolved to ${BASE_IMAGE}@${digest}"
          echo "BASE_DIGEST=${digest}" >> "${GITHUB_ENV}"
          # the manifest (list) digest is the pin itself: the same value the scheduled skip check computes without pulling
          echo "BASE_INDEX_DIGEST=${BASE_PIN}" >> "${GITHUB_ENV}"

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Check image size
        env:
          MAX_IMAGE_GIB: 15
        run: |
          size=$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MiB (limit $((MAX_IMAGE_GIB * 1024)) MiB)"
          if (( size > MAX_IMAGE_GIB * 1024 * 1024 * 1024 )); then
            echo "::error::The image is larger than ${MAX_IMAGE_GIB} GiB; check what was added"
            exit 1
          fi

      # Fail the build before anything is pushed if the image is missing what it should have
      - name: Smoke test image
        run: |
          podman run --rm -v "${PWD}/.github/scripts/default-smoke.sh:/default-smoke.sh:ro" -e REF="${IMAGE_REGISTRY}/${IMAGE_NAME}" -e BASE_TAG="${BASE_REF##*:}" -e VERSION_RE='beta-[0-9]{8}-[0-9a-f]{7,}' "${IMAGE_NAME}:${DEFAULT_TAG}" bash /default-smoke.sh

      # The compilers and the linker the image ships (gcc, gcc-c++, make, binutils) must work: compile, link and run a C and a C++ program
      - name: Compiler smoke test
        run: |
          set -euo pipefail
          podman run --rm -v "${PWD}/.github/scripts/compiler-smoke.sh:/compiler-smoke.sh:ro" "${IMAGE_NAME}:${DEFAULT_TAG}" bash /compiler-smoke.sh

      # Tier 1 compatibility check: every shipped scheduler against the kernel of THIS image, statically (kernel config, the
      # kernel's own BTF read out of vmlinuz, the kernel symbols and struct sched_ext_ops members each scheduler's embedded BPF
      # object requires). It loads nothing; a failure here fails the build and so blocks the promotion of this build.
      - name: Check the shipped schedulers against the image kernel
        run: |
          set -euo pipefail
          podman run --rm -v "${PWD}/.github/scripts/scx-kernel-check.py:/scx-kernel-check.py:ro" "${IMAGE_NAME}:${DEFAULT_TAG}" \
            bash -c 'kver=$(ls /usr/lib/modules | head -n1); echo "kernel ${kver}"; python3 -I /scx-kernel-check.py --kernel-dir "/usr/lib/modules/${kver}"'

      - name: Rechunk with chunkah
        id: rechunk
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Secure Boot: the kernel image must verify with sbverify against Universal Blue's kernel key (downloaded from the akmods repository) (a base with an unsigned or differently
      # signed kernel would not boot on a Secure Boot machine); the signer of the real kernel is printed. Not verifiable here: a real boot.
      - name: Secure Boot check of the kernel
        run: |
          .github/scripts/retry.sh sudo apt-get update -qq
          .github/scripts/retry.sh sudo apt-get install -y --no-install-recommends sbsigntool
          .github/scripts/secureboot-check.sh "${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Check the version is channel-neutral
        run: |
          # the labels plus os-release IMAGE_VERSION of the rechunked image (a beta build's must start with beta-)
          {
            podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" \
              | jq -r '.[0].Config.Labels // {} | to_entries[] | "\(.key)=\(.value)"'
            podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" sh -c '. /etc/os-release && echo "IMAGE_VERSION=${IMAGE_VERSION:-}"'
          } | BETA=true .github/scripts/check-version-neutral.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only `beta` and `beta-<date>-<sha>` are pushed, nothing else (the dated name follows build.yml's `latest-<date>-<sha>`)
      - name: Tags
        id: tags
        run: |
          alias_tags="${DEFAULT_TAG}-$(date +%Y%m%d)-$(git rev-parse --short HEAD) ${DEFAULT_TAG}"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # One push, the other tag is a registry-side copy of its digest (one manifest digest for every tag)
          .github/scripts/push-tags.sh "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}" ${ALIAS_TAGS}

  sign:
    name: Sign and verify beta image
    needs: build
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Sign every pushed digest
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          [[ -n "${DIGESTS// /}" ]] || { echo "::error::No pushed digests to sign"; exit 1; }
          # old bundle format, as in build.yml (https://github.com/containers/container-libs/issues/388)
          for digest in ${DIGESTS}; do
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          done

      - name: Verify every pushed tag is signed
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          ALIAS_TAGS: ${{ needs.build.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            .github/scripts/retry.sh cosign verify --key cosign.pub "${IMAGE}:${tag}" > /dev/null
            echo "signed: ${tag}"
          done

  # Starts the beta dx build (build-dx.yml, a separate re-runnable run) on main after the beta image is signed; one-way (nothing
  # of the beta base needs this job). Fails when no dx run appears; re-running this job alone dispatches again.
  dispatch_dx:
    name: Start the dx build (beta)
    needs: sign
    if: always() && needs.sign.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dispatch the dx workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: .github/scripts/dispatch-dx.sh beta "${GITHUB_SHA}"

  # A failed weekly beta image build: ONE issue (label ci-failure-beta, a comment per further failure, closed by the next green run), like the dx and publish alerts: a scheduled run
  # that fails e-mails nobody who is not watching Actions. A cancelled run raises nothing and closes nothing. Needs issues: write only.
  alert:
    name: Report a failed weekly beta image build
    needs: [binaries, tests, build, sign]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Open the failure issue or comment on it
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          LABEL: ci-failure-beta
          LABEL_DESC: the weekly beta image build failed (one open issue at a time)
          ISSUE_TITLE: "The beta image build failed"
          ISSUE_BODY: "The weekly build of octarine-os:beta failed: a coming Fedora release or a new Universal Blue beta base may break the image. See the run for the failed job. Later failures are added to this issue as comments; it closes itself when a run succeeds. Where to look: CLAUDE.md, Beta channel."
          FAIL_COMMENT: "weekly beta image build failed again"
        run: .github/scripts/ci-issue.sh fail

      - name: Close the issue when the run succeeded
        if: needs.sign.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          LABEL: ci-failure-beta
          RECOVER_COMMENT: "the next weekly beta image build succeeded"
        run: .github/scripts/ci-issue.sh recover
