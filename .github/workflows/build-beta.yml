---
name: Build beta image
# The beta channel: the normal octarine-os image built on Universal Blue's beta base (ghcr.io/ublue-os/silverblue-main:beta)
# and published as the moving tag `ghcr.io/<owner>/octarine-os:beta` plus a dated tag `beta-<date>-<sha>` (the daily
# build's naming; prune-testing.yml keeps the newest three dated beta builds), so a failure that a coming Fedora release
# would cause shows up as a red scheduled run before the base moves. Weekly (Wednesday 14:00 UTC: the daily build.yml runs
# at 11:00 UTC, build-nvidia.yml on Sunday 12:00 and prune-testing.yml on Sunday 05:00, so nothing overlaps) plus manual
# dispatch. Never runs on pushes or pull requests and is not a required check. Never touches `latest`, `testing` or dated tags. A separate small workflow because build.yml is built around
# testing/promote/docs-only semantics; setup, base check, build, smoke test, rechunk, push and signing are the same
# steps (the smoke test is a copy, tests/beta-channel.sh fails when the two drift). Design in CLAUDE.md.
on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # For this workflow only (the repository variables BASE_IMAGE/FEDORA_VERSION belong to the daily build and are ignored here).
  # FEDORA_VERSION is the tag of the base image: the Containerfile builds FROM ${BASE_IMAGE}:${FEDORA_VERSION}.
  BASE_IMAGE: ghcr.io/ublue-os/silverblue-main
  FEDORA_VERSION: beta
  DEFAULT_TAG: beta
  # os-release IMAGE_VERSION of this channel is beta-<date>-<sha>: the beta image is never promoted (`just build` reads this)
  IMAGE_VERSION_PREFIX: beta-

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The prebuilt binaries (sched_ext schedulers, libextest.so) from binaries/: built once per tree hash, signed, reused. The
  # job gates the image build only; it has no required check name (see binaries.yml).
  binaries:
    name: Prebuilt binaries image
    uses: ./.github/workflows/binaries.yml
    permissions:
      contents: read
      packages: write
    # the signing secret is a repository secret, which a called workflow only gets when it is passed on
    secrets: inherit

  build:
    name: Build beta image
    needs: binaries
    runs-on: ubuntu-26.04

    outputs:
      image: ${{ steps.names.outputs.image }}
      digests: ${{ steps.push-image.outputs.digests }}
      alias_tags: ${{ steps.tags.outputs.alias_tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Set up just
        uses: ./.github/actions/setup-tool
        with:
          tool: just

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Prepare environment
        id: names
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "image=${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      # As in build.yml: a format check of the pinned brew image, and always a cosign verify (a scheduled run has no before-commit)
      - name: Check the brew image pin
        run: |
          tag=$(sed -n 's/^ARG BREW_TAG=//p' Containerfile)
          digest=$(sed -n 's/^ARG BREW_DIGEST=//p' Containerfile)
          [[ "${tag}" =~ ^[0-9]{8}$ ]] || { echo "::error::BREW_TAG missing or not a YYYYMMDD tag in the Containerfile"; exit 1; }
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::BREW_DIGEST missing or not sha256:<64 hex> in the Containerfile"; exit 1; }
          echo "Brew image pinned: ghcr.io/ublue-os/brew:${tag}@${digest}"
          echo "BREW_PIN=ghcr.io/ublue-os/brew@${digest}" >> "${GITHUB_ENV}"

      - name: Verify the brew image signature
        run: |
          cosign verify --key keys/ublue-os-brew-cosign.pub "${BREW_PIN}" > /dev/null
          echo "Signature of ${BREW_PIN} is valid"

      # The prebuilt binaries image (octarine-os-binaries, built from binaries/ by the binaries job): verify the digest it
      # handed over with this repository's key, log it and pass it to the build as BINARIES_IMAGE
      - name: Set up cosign (binaries image)
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Login to GitHub Container Registry (to pull the binaries image)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the binaries image
        run: .github/scripts/binaries-use.sh "${{ needs.binaries.outputs.image }}" "${{ needs.binaries.outputs.digest }}"

      - name: Say which path the binaries image took
        env:
          ACTION: ${{ needs.binaries.outputs.action }}
          HASH: ${{ needs.binaries.outputs.hash }}
        run: echo "Binaries image ${ACTION} (\`${HASH}\`, digest \`${BINARIES_IMAGE##*@}\`)" >> "${GITHUB_STEP_SUMMARY}"

      # Fail early and clearly if the beta base cannot be pulled (the tag only exists while Universal Blue builds a beta)
      - name: Check the base image can be pulled
        run: |
          base="${BASE_IMAGE}:${FEDORA_VERSION}"
          echo "BASE_REF=${base}" >> "${GITHUB_ENV}"
          if ! podman pull "${base}" >/dev/null; then
            echo "::error::Cannot pull the base image ${base}: does that tag exist? (list tags with: skopeo list-tags docker://${BASE_IMAGE})"
            exit 1
          fi
          podman image inspect "${base}" --format 'Base image {{.Id}} created {{.Created}}'
          digest=$(podman image inspect "${base}" --format '{{.Digest}}')
          [[ "${digest}" == sha256:* ]] || { echo "::error::Cannot determine the digest of ${base}"; exit 1; }
          echo "Base image ${base} resolved to ${BASE_IMAGE}@${digest}"
          echo "BASE_DIGEST=${digest}" >> "${GITHUB_ENV}"
          index=$(skopeo inspect --raw "docker://${base}" | sha256sum | sed 's/ .*//')
          [[ -n "${index}" ]] || { echo "::error::Cannot determine the manifest digest of ${base}"; exit 1; }
          echo "BASE_INDEX_DIGEST=sha256:${index}" >> "${GITHUB_ENV}"

      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Check image size
        env:
          MAX_IMAGE_GIB: 15
        run: |
          size=$(podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MiB (limit $((MAX_IMAGE_GIB * 1024)) MiB)"
          if (( size > MAX_IMAGE_GIB * 1024 * 1024 * 1024 )); then
            echo "::error::The image is larger than ${MAX_IMAGE_GIB} GiB; check what was added"
            exit 1
          fi

      # Fail the build before anything is pushed if the image is missing what it should have
      - name: Smoke test image
        run: |
          podman run --rm -e REF="${IMAGE_REGISTRY}/${IMAGE_NAME}" -e BASE_TAG="${BASE_REF##*:}" -e VERSION_RE='beta-[0-9]{8}-[0-9a-f]{7,}' "${IMAGE_NAME}:${DEFAULT_TAG}" bash -c '
            fail=0
            check() { if eval "$2" >/dev/null 2>&1; then echo "PASS $1"; else echo "FAIL $1"; fail=1; fi; }

            echo "== os-release (the Fedora release the base tag resolved to)"
            cat /etc/os-release
            echo "== enabled system units"
            systemctl list-unit-files --state=enabled --no-legend --no-pager || true
            echo "== enabled user units (global)"
            systemctl --global list-unit-files --state=enabled --no-legend --no-pager || true
            echo "== checks"

            check "no flatpak-preinstall.service enabled (the recipe replaces it)" "! systemctl is-enabled flatpak-preinstall.service 2>/dev/null"
            check "menu helper library shipped" "test -s /usr/share/octarine-os/lib/menu.sh"
            # prebuilt binaries (binaries/: scx, extest): installed only; whether a scheduler loads is for a real machine to say
            check "schedulers.tsv manifest shipped and not empty" "test -s /usr/share/octarine-os/schedulers.tsv"
            for n in $(cut -f1 /usr/share/octarine-os/schedulers.tsv); do
                check "scheduler $n is executable and runs --version" "test -x /usr/bin/$n && /usr/bin/$n --version"
                check "scheduler $n resolves every shared library (ldd shows no not found)" "out=\$(ldd /usr/bin/$n) && ! grep -q \"not found\" <<<\"\$out\""
            done
            check "extest 32-bit library is a 32-bit ELF" "file -L /usr/lib/extest/lib/libextest.so | grep -q \"ELF 32-bit\""
            check "extest 64-bit library is a 64-bit ELF" "file -L /usr/lib/extest/lib64/libextest.so | grep -q \"ELF 64-bit\""
            check "extest libraries are executable files" "test -x /usr/lib/extest/lib/libextest.so && test -x /usr/lib/extest/lib64/libextest.so"
            check "GPL-2.0 text ships with the schedulers" "grep -rqF \"GNU GENERAL PUBLIC LICENSE\" /usr/share/licenses/octarine-os-binaries/scx"
            check "MIT text ships with extest" "grep -rqF \"MIT License\" /usr/share/licenses/octarine-os-binaries/extest"
            check "scheduler units: the template and the polkit rule ship, the helpers and the GameMode hooks are executable" "test -f /usr/lib/systemd/system/scx@.service && test -f /usr/share/polkit-1/rules.d/50-octarine-scx.rules && for f in scx-preflight scx-run scx-verify gamemode-start gamemode-end; do test -x /usr/libexec/octarine-os/\$f || exit 1; done"
            check "polkit rule: generated from the registry (every instance in the unit regex, no generic character class) and the scx@ template it depends on exists" "test -f /usr/lib/systemd/system/scx@.service && ! grep -q A-Za-z0-9 /usr/share/polkit-1/rules.d/50-octarine-scx.rules && for c in /usr/share/octarine-os/schedulers.d/*.conf; do i=\$(basename \$c .conf); grep -Eq \"scx@.*[(|]\$i[|)]\" /usr/share/polkit-1/rules.d/50-octarine-scx.rules || exit 1; done"
            check "scheduler registry: one file per manifest line, every instance has a conflicts drop-in" "test \"\$(ls /usr/share/octarine-os/schedulers.d | wc -l)\" = \"\$(wc -l < /usr/share/octarine-os/schedulers.tsv)\" && for c in /usr/share/octarine-os/schedulers.d/*.conf; do i=\$(basename \$c .conf); test -s /usr/lib/systemd/system/scx@\$i.service.d/10-conflicts.conf || exit 1; done"
            check "no scheduler is enabled or started by the image (preset disables, no wants link)" "grep -qx \"disable scx@\\*.service\" /usr/lib/systemd/system-preset/00-octarine-scx.preset && ! ls /etc/systemd/system/*.wants/ 2>/dev/null | grep -q ^scx@"
            check "source and build records ship for both binary images" "for i in scx extest; do test -s /usr/share/licenses/octarine-os-binaries/\$i/SOURCE && test -s /usr/share/licenses/octarine-os-binaries/\$i/BUILDINFO || exit 1; done"
            check "flatpak-preinstall recipe exists" "grep -q ^flatpak-preinstall /usr/share/ublue-os/just/60-custom.just"
            # pcp is an optional package: its units are enabled only when it is installed
            check "pcp units enabled when pcp is installed" "! rpm -q pcp || (systemctl is-enabled pmcd.service && systemctl is-enabled pmlogger.service)"
            check "enabled brew-setup.service" "systemctl is-enabled brew-setup.service"
            check "enabled brew-update.timer" "systemctl is-enabled brew-update.timer"
            check "brew-upgrade.timer stays disabled" "! systemctl is-enabled brew-upgrade.timer"
            check "brew tarball present" "test -s /usr/share/homebrew.tar.zst"
            check "brew profile script present" "test -f /etc/profile.d/brew.sh"
            check "our brew preset present" "grep -qx \"disable brew-upgrade.timer\" /usr/lib/systemd/system-preset/00-octarine-brew.preset"
            check "enabled (global) podman.socket" "systemctl --global is-enabled podman.socket"

            # CRITICAL packages (build.sh, first dnf5 transaction): a missing one fails the build
            CRITICAL="pam-u2f snapper fuse-libs tailscale gnome-shell-extension-user-theme borgbackup steam-devices zsh jq skopeo"
            for p in $CRITICAL; do
              check "package $p" "rpm -q $p"
              # standing policy: critical packages come from Fedora itself (outside repos only in optional groups)
              check "critical package $p has vendor Fedora Project" "test \"\$(rpm -q --qf %{VENDOR} $p)\" = \"Fedora Project\""
            done
            # The VM-hosting set lives in the dx variant only: the meta packages must be absent here (the libguestfs tools stay)
            for p in libvirt qemu-kvm cockpit-machines virt-manager virt-viewer libvirt-nss; do
              check "VM-hosting package $p is NOT installed (dx only)" "! rpm -q $p"
            done
            check "libguestfs tools stay (guestfish)" "rpm -q guestfs-tools"
            # OPTIONAL packages: informational only, never fail (the missing list is reported below)
            for p in gstreamer1-plugins-bad gstreamer1-plugins-ugly fish gum niri noctalia btrfs-assistant nautilus-python wtype socat gnome-shell-extension-gsconnect gnome-shell-extension-appindicator gnome-shell-extension-auto-move-windows \
                     gnome-shell-extension-blur-my-shell gnome-shell-extension-caffeine gnome-shell-extension-dash-to-dock gpaste gnome-shell-extension-gpaste gnome-shell-extension-just-perfection gnome-shell-extension-ddterm gnome-shell-extension-freon \
                     nautilus-gsconnect cockpit cockpit-podman cockpit-storaged cockpit-networkmanager \
                     cockpit-ostree cockpit-selinux cockpit-files cockpit-packagekit cockpit-sosreport cockpit-kdump \
                     pcp python3-pcp powertop iotop-c lm_sensors usbip podman-compose kind podman-docker podman-tui \
                     restic rclone guestfs-tools libguestfs \
                     libguestfs-xfs virt-v2v; do
              if rpm -q $p >/dev/null 2>&1; then echo "INFO optional package $p installed"; else echo "INFO optional package $p NOT installed"; fi
            done
            # GPaste (optional, shipped but not enabled): when installed, the extension directory, its UUID and the compiled schema must be there
            if rpm -q gnome-shell-extension-gpaste >/dev/null 2>&1; then
              check "GPaste extension directory and UUID" "grep -qF GPaste@gnome-shell-extensions.gnome.org /usr/share/gnome-shell/extensions/GPaste@gnome-shell-extensions.gnome.org/metadata.json"
              check "GPaste schema compiled" "GSETTINGS_BACKEND=memory gsettings --schemadir /usr/share/glib-2.0/schemas get org.gnome.GPaste show-history | grep -q Alt"
              check "GPaste daemon is D-Bus activated" "test -f /usr/share/dbus-1/services/org.gnome.GPaste.service"
              check "GPaste is not enabled by default" "! grep -q GPaste /etc/dconf/db/distro.d/90-octarine-os"
            else
              echo "INFO GPaste not installed (listed in optional-packages-missing)"
            fi
            for e in just-perfection-desktop@just-perfection:just-perfection ddterm@amezin.github.com:ddterm freon@UshakovVasilii_Github.yahoo.com:freon; do
              u=${e%%:*}; k=${e#*:}
              if [ -d /usr/share/gnome-shell/extensions/$u ]; then
                check "extension $u: UUID in metadata.json" "grep -qF $u /usr/share/gnome-shell/extensions/$u/metadata.json"
                check "extension $u: schema compiled" "GSETTINGS_BACKEND=memory gsettings --schemadir /usr/share/glib-2.0/schemas list-keys org.gnome.shell.extensions.$k"
              else echo "INFO extension $u not installed (listed in optional-packages-missing)"; fi
            done
            check "extensions are not enabled by default" "! grep -q just-perfection\\|ddterm\\|freon /etc/dconf/db/distro.d/90-octarine-os"
            check "optional-packages-missing file exists" "test -f /usr/share/octarine-os/optional-packages-missing"
            check "zsh in /etc/shells" "grep -qx /usr/bin/zsh /etc/shells"
            check "new users do not default to zsh (opt-in through ujust user-setup)" "! grep -qx SHELL=/usr/bin/zsh /etc/default/useradd"
            check "zsh login files source /etc/profile (brew.sh relies on it)" "grep -q /etc/profile /etc/zprofile"
            check "skel zshrc" "test -s /etc/skel/.zshrc"
            check "sudo keeps a wheel rule" "grep -qE \"^%wheel[[:space:]]\" /etc/sudoers"
            check "sudo PAM keeps the password fallback" "grep -qE \"^auth[[:space:]]+include[[:space:]]+system-auth\" /etc/pam.d/sudo"
            check "polkit PAM keeps the password fallback" "grep -qE \"^auth[[:space:]]+include[[:space:]]+system-auth\" /etc/pam.d/polkit-1"
            check "pam_u2f module present" "test -e /usr/lib64/security/pam_u2f.so"
            check "firefox removed" "! rpm -q firefox"
            check "toolbox removed" "! rpm -q toolbox"
            check "distrobox present" "rpm -q distrobox"
            check "gnome-software removed" "! rpm -q gnome-software"
            for p in fwupd flatpak gnome-shell; do check "package $p still installed" "rpm -q $p"; done
            check "Bazaar in the preinstall list" "grep -qF \"[Flatpak Preinstall io.github.kolunmi.Bazaar]\" /usr/share/flatpak/preinstall.d/tools.preinstall"
            check "pretty name" "grep -qx \"PRETTY_NAME=\\\"octarineOS\\\"\" /etc/os-release"
            check "image id" "grep -qx \"IMAGE_ID=\\\"octarine-os\\\"\" /etc/os-release"
            check "image version format" "grep -qE \"^IMAGE_VERSION=\\\"\$VERSION_RE\\\"\\\$\" /etc/os-release"

            check "signature policy parses" "python3 -m json.tool /etc/containers/policy.json"
            check "signature policy covers this image" "grep -q $REF /etc/containers/policy.json"
            check "signature policy also covers the NVIDIA variant repository" "grep -q $REF-nvidia /etc/containers/policy.json"
            check "signature policy also covers the dx variant repository" "grep -q $REF-dx /etc/containers/policy.json"
            check "signature policy also covers the NVIDIA dx repository" "grep -q $REF-nvidia-dx /etc/containers/policy.json"
            check "release is Fedora" "grep -qx ID=fedora /etc/os-release"
            check "release matches a numeric base tag ($BASE_TAG)" "case \"$BASE_TAG\" in [0-9]*) grep -qx \"VERSION_ID=$BASE_TAG\" /etc/os-release;; esac"
            check "sudoers valid" "visudo -c"
            check "sudo timestamp_timeout is 30 (minutes, not seconds)" "grep -qx \"Defaults timestamp_timeout=30\" /etc/sudoers.d/10-timestamp-timeout"
            check "sudoers fragment valid" "visudo -c -f /etc/sudoers.d/10-timestamp-timeout"
            check "firewalld config valid" "firewall-offline-cmd --check-config"
            check "no iommu karg file (no image ships one; it is opt-in)" "! test -e /usr/lib/bootc/kargs.d/10-iommu.toml"
            check "ujust custom recipes" "test -f /usr/share/ublue-os/just/60-custom.just"
            check "dev-toolbox definition" "grep -q \"^\\[dev-toolbox\\]\" /usr/share/ublue-os/distrobox/dev-toolbox.ini"
            check "dev-toolbox definition has no per-user keys" "! grep -qE \"^(exported_bins|home)\" /usr/share/ublue-os/distrobox/dev-toolbox.ini"
            check "rocm toolbox definition and the box-export helper" "grep -q \"^\\[rocm\\]\" /usr/share/ublue-os/distrobox/rocm.ini && grep -q additional_packages /usr/share/ublue-os/distrobox/rocm.ini && test -s /usr/share/octarine-os/lib/box-export.sh"
            check "gaming toolbox definition" "grep -q \"^\\[gaming\\]\" /usr/share/ublue-os/distrobox/gaming.ini"
            check "gaming toolbox isolates its home" "grep -qx ISOLATED_HOME=true /usr/share/ublue-os/distrobox/gaming.conf"
            check "dev-toolbox settings" "grep -q ^TOOLS= /usr/share/ublue-os/distrobox/dev-toolbox.conf"
            check "logo files" "test -s /usr/share/octarine-os/logo/octarine-logo.png && test -s /usr/share/octarine-os/logo/octarine-logo-neutral-512.png"
            check "GDM logo override file" "grep -qF octarine-logo.png /usr/share/glib-2.0/schemas/zz-octarine-login-screen.gschema.override"
            check "GDM logo override compiled" "GSETTINGS_BACKEND=memory gsettings --schemadir /usr/share/glib-2.0/schemas get org.gnome.login-screen logo | grep -qF octarine-logo.png"
            check "plymouth theme file" "grep -qx ModuleName=two-step /usr/share/plymouth/themes/octarine/octarine.plymouth"
            check "plymouth watermark is ours" "cmp /usr/share/plymouth/themes/octarine/watermark.png /usr/share/octarine-os/logo/octarine-logo.png"
            check "plymouth theme selected" "grep -qx Theme=octarine /etc/plymouth/plymouthd.conf"
            check "initramfs holds the watermark" "lsinitrd /usr/lib/modules/*/initramfs.img | grep -qF usr/share/plymouth/themes/octarine/watermark.png"
            check "dconf profile lists the distro database" "grep -qx system-db:distro /etc/dconf/profile/user"
            check "dconf keyfile of the image shipped" "grep -q ^enabled-extensions= /etc/dconf/db/distro.d/90-octarine-os"
            check "dconf distro database is newer than our keyfile (dconf update ran)" "test /etc/dconf/db/distro -nt /etc/dconf/db/distro.d/90-octarine-os"
            check "dconf distro database holds our hot corner default" "grep -aq enable-hot-corners /etc/dconf/db/distro"
            for f in /usr/share/fish/vendor_conf.d/octarine-os-*.fish /usr/share/fish/vendor_functions.d/y.fish; do
              check "fish accepts $f" "fish --no-execute $f"
            done
            check "gamemode defaults file shipped" "grep -qx renice=10 /etc/gamemode.ini"
            check "niri config parts shipped (/etc/niri)" "test -s /etc/niri/config.kdl && test -s /etc/niri/40-binds.kdl && test -s /etc/niri/50-noctalia.kdl"
            check "niri-setup source files shipped" "test -s /usr/share/octarine-os/niri-setup/niri-portals.conf && test -s /usr/share/octarine-os/niri-setup/10-octarine-os.toml && test -s /usr/share/octarine-os/niri-setup/keybinds/standard.kdl.in && test -s /usr/share/octarine-os/niri-setup/keybinds/compact.kdl.in && test -s /usr/share/octarine-os/niri-setup/keybinds/hhkb.kdl.in"
            check "niri accepts the shipped config when niri is installed" "! command -v niri || niri validate -c /etc/niri/config.kdl"
            check "niri-setup recipe exists" "grep -q ^niri-setup /usr/share/ublue-os/just/60-custom.just"

            # ujust recipes added with switch-image, toggle-updates, update and luks-tpm-unlock (jq and skopeo are in CRITICAL above)
            for f in 10-update 10-update-base 30-distrobox 30-distrobox-base 15-luks 40-nvidia 50-akmods 60-custom; do
              check "just file $f.just exists" "test -f /usr/share/ublue-os/just/$f.just"
            done
            check "update helper library shipped" "test -s /usr/share/octarine-os/lib/update-services.sh"
            for u in rpm-ostreed-automatic.timer flatpak-system-update.timer brew-update.timer brew-upgrade.timer; do
              check "update unit $u exists" "systemctl cat $u"
            done
            for u in flatpak-user-update.timer octarine-distrobox-upgrade.timer octarine-distrobox-upgrade.service; do
              check "user update unit $u exists" "test -f /usr/lib/systemd/user/$u"
            done
            check "jq and skopeo run" "jq --version && skopeo --version"
            check "staged automatic image updates are on by default (ujust toggle-updates is the user switch)" "systemctl is-enabled rpm-ostreed-automatic.timer && grep -qx AutomaticUpdatePolicy=stage /etc/rpm-ostreed.conf"
            check "mcelog is not masked and has the Intel-only drop-in" "! systemctl is-enabled mcelog.service 2>&1 | grep -qx masked && grep -q GenuineIntel /usr/lib/systemd/system/mcelog.service.d/50-octarine-intel-only.conf"
            check "automatic update retry drop-in: bounded on-failure restart" "grep -qx Restart=on-failure /usr/lib/systemd/system/rpm-ostreed-automatic.service.d/50-octarine-retry.conf && grep -qx RestartSec=60 /usr/lib/systemd/system/rpm-ostreed-automatic.service.d/50-octarine-retry.conf && grep -qx StartLimitBurst=5 /usr/lib/systemd/system/rpm-ostreed-automatic.service.d/50-octarine-retry.conf"
            check "automatic update service waits for the network (base drop-in) and NetworkManager-wait-online is enabled" "grep -q After=network-online.target /usr/lib/systemd/system/rpm-ostreed-automatic.service.d/override.conf && systemctl is-enabled NetworkManager-wait-online.service"
            summary=$(just --justfile /usr/share/ublue-os/justfile --summary 2>&1)
            check "the assembled justfile parses (just --summary)" "just --justfile /usr/share/ublue-os/justfile --summary"
            has_recipe() { printf "%s\n" $summary | grep -qx -- "$1"; }
            for r in switch-image toggle-updates update luks-tpm-unlock; do
              check "assembled justfile lists $r" "has_recipe $r"
            done
            for r in toggle-nvk setup-luks-tpm-unlock remove-luks-tpm-unlock; do
              check "assembled justfile does not list the base recipe $r" "! has_recipe $r"
            done
            check "flatpak preinstall list""test -s /usr/share/flatpak/preinstall.d/gnome.preinstall"
            exit $fail
          '

      # Tier 1 compatibility check: every shipped scheduler against the kernel of THIS image, statically (kernel config, the
      # kernel's own BTF read out of vmlinuz, the kernel symbols and struct sched_ext_ops members each scheduler's embedded BPF
      # object requires). It loads nothing; a failure here fails the build and so blocks the promotion of this build.
      - name: Check the shipped schedulers against the image kernel
        run: |
          set -euo pipefail
          podman run --rm -v "${PWD}/.github/scripts/scx-kernel-check.py:/scx-kernel-check.py:ro" "${IMAGE_NAME}:${DEFAULT_TAG}" \
            bash -c 'kver=$(ls /usr/lib/modules | head -n1); echo "kernel ${kver}"; python3 -I /scx-kernel-check.py --kernel-dir "/usr/lib/modules/${kver}"'

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Check the version is channel-neutral
        run: |
          # the labels plus os-release IMAGE_VERSION of the rechunked image (a beta build's must start with beta-)
          {
            podman image inspect "${IMAGE_NAME}:${DEFAULT_TAG}" \
              | jq -r '.[0].Config.Labels // {} | to_entries[] | "\(.key)=\(.value)"'
            podman run --rm "${IMAGE_NAME}:${DEFAULT_TAG}" sh -c '. /etc/os-release && echo "IMAGE_VERSION=${IMAGE_VERSION:-}"'
          } | BETA=true .github/scripts/check-version-neutral.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only `beta` and `beta-<date>-<sha>` are pushed, nothing else (the dated name follows build.yml's `latest-<date>-<sha>`)
      - name: Tags
        id: tags
        run: |
          alias_tags="${DEFAULT_TAG}-$(date +%Y%m%d)-$(git rev-parse --short HEAD) ${DEFAULT_TAG}"
          echo "Tags: ${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Push To GHCR
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # One push, the other tag is a registry-side copy of its digest (one manifest digest for every tag)
          .github/scripts/push-tags.sh "${IMAGE_NAME}:${DEFAULT_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}" ${ALIAS_TAGS}

  sign:
    name: Sign and verify beta image
    needs: build
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cosign
        uses: ./.github/actions/setup-tool
        with:
          tool: cosign

      - name: Sign every pushed digest
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          [[ -n "${DIGESTS// /}" ]] || { echo "::error::No pushed digests to sign"; exit 1; }
          # old bundle format, as in build.yml (https://github.com/containers/container-libs/issues/388)
          for digest in ${DIGESTS}; do
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${digest}"
          done

      - name: Verify every pushed tag is signed
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          ALIAS_TAGS: ${{ needs.build.outputs.alias_tags }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            cosign verify --key cosign.pub "${IMAGE}:${tag}" > /dev/null
            echo "signed: ${tag}"
          done
