name: Build testing hourly
# Scheduled workflows run from the default branch, so this takes effect once it is on main. Every hour it
# dispatches build.yml on `testing` when testing has a commit that no build has seen yet; several pushes in
# the same window just update the open pull request, and one build covers them. A dispatch of build.yml
# publishes the `testing` tags and creates the checks the pull request needs on its head commit.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: build-testing
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch a testing build when due
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout (for the decision script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide and dispatch
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/testing" --jq .sha 2>/dev/null || true)
          files=0
          runs=""
          if [[ -n "${sha}" ]]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...testing" --jq '.files | length')
            # queued, in progress or finished all count; cancelled runs do not
            runs=$(gh run list --workflow build.yml --branch testing --limit 100 --json headSha,conclusion \
              --jq '.[] | select(.conclusion != "cancelled") | .headSha')
          fi
          # shellcheck disable=SC2086
          decision=$(.github/scripts/testing-due.sh "${sha}" "${files}" ${runs})
          echo "${decision}"
          if [[ "${decision}" == due ]]; then
            gh workflow run build.yml --ref testing
            echo "Dispatched build.yml on testing at ${sha}"
          fi
