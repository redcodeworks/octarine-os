---
name: Build NVIDIA gx image
# The NVIDIA gamer image (ghcr.io/<owner>/octarine-os-nvidia-gx): the SAME gx layer as octarine-os-gx (variants/gx, the lists of the pinned octarine-bins-gx image) on top of the
# NVIDIA variant octarine-os-nvidia instead of octarine-os. Built beside octarine-os-nvidia-dx, never with it: its own concurrency group, so the two never cancel
# each other. The variant has only a `latest` channel (manual dispatch on main only, no schedule since 2026-11-16), so this image has only `latest` and the dated tags: it starts when
# "Build NVIDIA variant" finishes on `main` (workflow_run, which always runs the workflow file of the default branch) or by manual dispatch on `main`; it never
# runs on pushes, pull requests or `testing`. The plan job (.github/scripts/plan-dx.sh, variant gx, promote_from_testing off) skips when the NVIDIA base digest and the
# gx inputs are unchanged. A THIN CALLER of the reusable dx-image.yml (like build-nvidia-dx.yml): plan, build and promote are shared, signing is this file's own `sign`
# job (an environment secret did not reach a reusable-workflow job), the triggers, the concurrency group and the result job stay here. It never posts the required check
# `Build gx and push image` or a commit status (its result job has another name), so it can neither satisfy nor block a promotion pull request. Design in CLAUDE.md
# ("NVIDIA gx image"). Whether the gx layer installs on the NVIDIA base is untested (Mesa and 32-bit libraries, see CLAUDE.md).
on:
  workflow_run:
    workflows: ["Build NVIDIA variant"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when the base digest and the gx inputs are unchanged"
        type: boolean
        default: false

# A run that is already building is never cancelled (a newer trigger waits, only one can wait)
concurrency:
  group: build-nvidia-gx
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # plan and build: the reusable workflow. The workflow file of `main` only: a dispatch, or a successful dispatched NVIDIA
  # build of `main`. Signing is the `sign` job below.
  nvidia_gx:
    name: nvidia-gx
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'))
    uses: ./.github/workflows/dx-image.yml
    permissions:
      contents: read
      packages: write
    with:
      base_name: octarine-os-nvidia
      dx_name: octarine-os-nvidia-gx
      variant: gx
      channel: latest
      # the commit the triggering build ran for (for a dispatch: main's tip)
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      promote_from_testing: false
      tags: latest-{sha} latest-{date}-{sha} {date}-{sha} {date} latest latest-{date}
      description: octarineOS with the proprietary NVIDIA driver, Steam, gamescope, MangoHud, GameMode and Sunshine (NVIDIA gamer image, built on request from the NVIDIA variant)
      # the driver, the kernel module, the initramfs, and no CUDA toolkit anywhere in the image
      extra_smoke: .github/scripts/nvidia-smoke.sh present

  # Signing lives here, not in the reusable workflow: an environment secret did not reach a job inside dx-image.yml (observed 2026-11-16 on two runs).
  # A build signs every pushed digest, a promotion only verifies the digest that was signed when the testing image was published; both then
  # verify every tag. Skipped when nothing was built or promoted (plan skipped, nothing to do, dry run, failures before it).
  sign:
    name: Sign and verify nvidia-gx image
    needs: nvidia_gx
    if: >-
      always() && needs.nvidia_gx.result == 'success' &&
      (needs.nvidia_gx.outputs.build == 'success' || needs.nvidia_gx.outputs.promote == 'success')
    runs-on: ubuntu-26.04
    environment: signing

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify
        uses: ./.github/actions/sign-images
        with:
          image: ${{ needs.nvidia_gx.outputs.image }}
          digests: ${{ needs.nvidia_gx.outputs.digests }}
          tags: ${{ needs.nvidia_gx.outputs.alias_tags }}
          mode: ${{ needs.nvidia_gx.outputs.build == 'success' && 'sign' || 'verify' }}
          private-key: ${{ secrets.SIGNING_SECRET }}

  # The one result of a run; always runs. Green when the image was built and signed or legitimately skipped (NVIDIA base digest and gx inputs
  # unchanged). It is NOT named `Build dx and push image` and posts no commit status: that context belongs to build-dx.yml and is a required check on main.
  nvidia_gx_result:
    name: NVIDIA gx build result
    needs: [nvidia_gx, sign]
    if: always()
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the result
        env:
          PLAN: ${{ needs.nvidia_gx.result == 'skipped' && 'skipped' || needs.nvidia_gx.outputs.plan || 'failure' }}
          BUILD_WANTED: ${{ needs.nvidia_gx.outputs.build_wanted }}
          PROMOTE_WANTED: "false"
          BUILD: ${{ needs.nvidia_gx.result == 'skipped' && 'skipped' || needs.nvidia_gx.outputs.build || 'failure' }}
          PROMOTE: skipped
          SIGN: ${{ needs.sign.result }}
        run: .github/scripts/aggregate-dx.sh
