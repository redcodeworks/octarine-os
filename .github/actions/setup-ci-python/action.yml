name: Set up the Python of the CI scripts
description: >-
  Installs uv (pinned) and the exact Python of .python-version as a uv-MANAGED interpreter (never the runner image's system Python: UV_PYTHON_PREFERENCE is only-managed).
  There is NO cache of any kind (neither uv's nor the interpreter's): every job installs from the frozen lock, so the jobs that hold a signing key run only what was
  just downloaded. The scripts then run with `uv run --frozen --no-dev python -I .github/scripts/<name>.py`: nothing is resolved at run time. The caller checks out the
  repository first.
runs:
  using: composite
  steps:
    - name: Use only the uv-managed Python
      shell: bash
      run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "${GITHUB_ENV}"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
        enable-cache: false
        cache-python: false
