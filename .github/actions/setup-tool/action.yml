name: Set up a pinned CI tool
description: >-
  Puts cosign or just on PATH. A binary cached under the pinned version is reused without a download; otherwise the
  pinned installer runs, and if it fails (GitHub release downloads return 504 now and then) it is retried once after
  60 seconds. The job fails only when both attempts fail. The binary is cached after a successful install.
inputs:
  tool:
    description: cosign or just
    required: true
runs:
  using: composite
  steps:
    - name: Resolve the pinned version
      id: cfg
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
      run: |
        case "${TOOL}" in
          cosign) ver=v3.1.4; check=version ;;   # keep in step with the cosign version the signing policy was tested with
          just) ver=1.59.0; check=--version ;;
          *) echo "::error::setup-tool: unknown tool '${TOOL}' (cosign or just)"; exit 1 ;;
        esac
        {
          echo "version=${ver}"
          echo "dir=${HOME}/.cache/octarine-tools/${TOOL}-${ver}"
          echo "key=octarine-tool-${TOOL}-${ver}-linux-amd64"
          echo "check=${check}"
        } >> "${GITHUB_OUTPUT}"

    - name: Restore the cached binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cfg.outputs.dir }}
        key: ${{ steps.cfg.outputs.key }}

    - name: Use the cached binary
      id: hit
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        DIR: ${{ steps.cfg.outputs.dir }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CHECK: ${{ steps.cfg.outputs.check }}
      run: |
        need=true
        if [[ "${CACHE_HIT}" == true && -x "${DIR}/${TOOL}" ]] && "${DIR}/${TOOL}" "${CHECK}" >/dev/null 2>&1; then
          need=false
          echo "${DIR}" >> "${GITHUB_PATH}"
          echo "${TOOL} restored from the cache (${DIR})"
        fi
        echo "install=${need}" >> "${GITHUB_OUTPUT}"

    # --- cosign: the pinned installer, then one retry after 60 s
    - name: Install cosign
      id: cosign1
      if: steps.hit.outputs.install == 'true' && inputs.tool == 'cosign'
      continue-on-error: true
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: 'v3.1.4'

    - name: Wait before retrying the cosign install
      if: steps.cosign1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::cosign install failed; retrying once in 60 s"
        sleep 60

    - name: Install cosign (retry)
      id: cosign2
      if: steps.cosign1.outcome == 'failure'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: 'v3.1.4'

    # --- just: the pinned installer, then one retry after 60 s
    - name: Install just
      id: just1
      if: steps.hit.outputs.install == 'true' && inputs.tool == 'just'
      continue-on-error: true
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '1.59.0'

    - name: Wait before retrying the just install
      if: steps.just1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::just install failed; retrying once in 60 s"
        sleep 60

    - name: Install just (retry)
      id: just2
      if: steps.just1.outcome == 'failure'
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '1.59.0'

    # After a fresh install keep the binary for the cache (saved when the job ends, only after a miss and a green job)
    - name: Keep the binary for the cache
      if: steps.hit.outputs.install == 'true'
      shell: bash
      env:
        TOOL: ${{ inputs.tool }}
        DIR: ${{ steps.cfg.outputs.dir }}
        CHECK: ${{ steps.cfg.outputs.check }}
      run: |
        bin=$(command -v "${TOOL}") || { echo "::error::${TOOL} is not on PATH after the install"; exit 1; }
        mkdir -p "${DIR}"
        cp -- "${bin}" "${DIR}/${TOOL}"
        echo "${TOOL} installed: $("${DIR}/${TOOL}" "${CHECK}" 2>&1 | head -n1)"
