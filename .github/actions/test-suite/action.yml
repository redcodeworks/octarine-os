name: Run the repository tests on the checked-out tree
description: >-
  The body of the required `test` check: install the tools the tests need that the container does not ship
  (with retries), print the version of every tool, run the quick checks and every tests/*.sh as an ordinary user. The caller checks the
  repository out first and runs this inside a container job whose image is the base the images are built on (test.yml), so the tests see the Fedora, niri, fish and shellcheck the image build sees.
runs:
  using: composite
  steps:
    # Only what the base image does not already ship is installed (dnf, with the retry helper); the real niri, fish, shellcheck... of the base's Fedora are the point.
    - name: Install the tools the tests need that the base lacks
      shell: bash
      run: |
        wanted="just jq fish zsh niri git python3 python3-pyyaml ShellCheck gawk dconf bash-completion findutils diffutils which tar gzip zstd curl ca-certificates util-linux shadow-utils binutils nodejs openssl"
        missing=""
        for p in ${wanted}; do rpm -q "${p}" > /dev/null 2>&1 || missing+=" ${p}"; done
        # package names differ in case between releases (shellcheck/ShellCheck): the binary decides
        command -v shellcheck > /dev/null 2>&1 && missing=${missing// ShellCheck/}
        echo "Already in the base: $(echo "${wanted}" | wc -w) wanted, missing:${missing:- none}"
        if [[ -n "${missing// /}" ]]; then
          .github/scripts/retry.sh -d 20 dnf -y install --setopt=install_weak_deps=False --setopt=retries=5 ${missing}
        fi

    - name: Versions of the environment (read this first when a run is red)
      shell: bash
      run: |
        . /etc/os-release && echo "OS: ${PRETTY_NAME} (${VERSION_ID}), image: $(rpm -q --qf '%{NAME}-%{VERSION}' fedora-release-identity-basic fedora-release-silverblue 2> /dev/null | tr '\n' ' ')"
        for c in "bash --version" "git --version" "python3 --version" "jq --version" "fish --version" "zsh --version" "niri --version" "shellcheck --version" "dnf5 --version" "skopeo --version"; do
          set -- ${c}
          if command -v "$1" > /dev/null 2>&1; then echo "$($c 2>&1 | head -n 2 | tr '\n' ' ')"; else echo "$1: not installed"; fi
        done

    # The container runs as root, but recipes and tests check that they are not run as root (no session bus), so
    # everything after the install runs as an ordinary user, like on the desktop.
    - name: Create the ordinary user the checks run as
      shell: bash
      run: |
        useradd --create-home ci
        git config --system --add safe.directory "${GITHUB_WORKSPACE}"
        chown -R ci: "${GITHUB_WORKSPACE}"

    - name: Install the pinned just
      uses: ./.github/actions/setup-tool
      with:
        tool: just

    - name: Make the pinned just usable by that user
      shell: bash
      # /usr/bin, not /usr/local/bin: on the ostree base /usr/local is a symlink to ../var/usrlocal, which does not exist in a container (found by the first runs on the base: a
      # mkdir -p of it fails with "File exists" too)
      run: install -m 0755 "$(command -v just)" /usr/bin/just && just --version

    - name: just check
      shell: bash
      run: runuser -u ci -- just check

    - name: bash -n on every script
      shell: bash
      run: |
        fail=0
        while IFS= read -r f; do
          if ! bash -n "$f"; then echo "FAIL bash -n $f"; fail=1; fi
        done < <(git ls-files '*.sh' githooks/pre-push)
        # shell blocks of the workflows are checked by the tests that read them; scripts only here
        [ "$fail" = 0 ] && echo "bash -n: all scripts parse"
        exit "$fail"

    # four at a time, output buffered per test, results in a fixed order (.github/scripts/run-tests.sh)
    - name: Run every tests/*.sh
      shell: runuser -u ci -- bash -e {0}
      run: .github/scripts/run-tests.sh --jobs 4
