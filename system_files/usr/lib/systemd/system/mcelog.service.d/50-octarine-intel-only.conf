# mcelog is for Intel machine-check logging; on AMD CPUs it has no use (it only knows the old AMD families) and AMD
# machines report errors through EDAC (edac_mce_amd). The image used to mask the unit for everybody, which took the logging
# away from Intel users too. The packaged unit already skips itself without /dev/mcelog (the kernel's legacy interface)
# and when edac_mce_amd is loaded; this adds the one missing case: an AMD CPU without that module. ExecCondition exits 1
# when the CPU is not Intel, which systemd treats as "skipped", not as a failure.
[Service]
ExecCondition=/usr/bin/grep -q -m1 GenuineIntel /proc/cpuinfo
