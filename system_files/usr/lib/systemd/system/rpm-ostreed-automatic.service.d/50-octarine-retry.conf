# Automatic image staging on nox failed once on wake from a long sleep ("pinging container registry": the network
# was not up yet; network-online.target is already reached then, so the base's Wants/After in override.conf cannot wait).
# Retry a failed run a few times instead of waiting for the next timer. Bounded: five starts per hour, then it gives up
# until the timer fires again. ExecCondition (the base's metered-connection check) skips the unit without a failure, so a
# metered connection is not retried. The base's override.conf is untouched; this is a separate drop-in.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=60
