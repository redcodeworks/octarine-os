# Fedora's shipped defaults leave both of these at 0. A compromised local app, game or
# extension could otherwise ptrace another of your own processes (for example dump a
# browser's or ssh-agent's memory for session cookies or keys), or use leaked kernel
# pointers to aid a local privilege escalation. ptrace_scope=1 still allows the normal
# "debugger launches its own child" workflow (gdb, lldb, IDEs); it only blocks attaching
# to an unrelated, already-running process.
kernel.yama.ptrace_scope=1
kernel.kptr_restrict=1
