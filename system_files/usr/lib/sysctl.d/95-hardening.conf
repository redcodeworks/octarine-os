# Fedora's own shipped defaults leave both of these at 0. Hardening pass
# (2026-09-12): a compromised local app/game/extension running as kevin
# could otherwise ptrace another of kevin's own processes (e.g. dump a
# browser's or ssh-agent's memory for session cookies/keys), or use leaked
# kernel pointers to aid a local privesc. ptrace_scope=1 still allows the
# normal "debugger launches its own child" workflow (gdb/lldb/IDEs) -- it
# only blocks attaching to an unrelated already-running process.
kernel.yama.ptrace_scope=1
kernel.kptr_restrict=1
