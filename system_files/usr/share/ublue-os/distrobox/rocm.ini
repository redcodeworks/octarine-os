# The `rocm` toolbox for `distrobox assemble`: AMD GPU compute tools (ROCm) in a rootless container, so nothing is layered on
# the host. The section name is the container name and the toolbox name for `ujust toolbox rocm`; `ujust hardware-setup`
# (step rocm) calls that. Create it by hand with: distrobox assemble create --file /usr/share/ublue-os/distrobox/rocm.ini
#
# - The image is Fedora's own toolbox image for the host release (45 at last check; bump it with the base). Its tag exists on
#   registry.fedoraproject.org (checked 2026-11). The packages come from Fedora's official repositories, no extra repository:
#   rocminfo, rocm-smi, rocm-hip, rocm-opencl and hipcc (about 3 GiB with their LLVM dependencies, inside the container only).
# - init=false and nvidia=false: no systemd inside, no NVIDIA driver injection. The AMD GPU nodes (/dev/kfd, /dev/dri/render*)
#   are mode 0666 through udev on Fedora, so no group (render) is needed inside the container.
# - No exported host commands by default; `ujust hardware-setup --only rocm-export` (or --export) exports hipcc, rocminfo and
#   rocm-smi to ~/.local/bin on request. Undo: distrobox rm --force rocm.
# - Whether Fedora's ROCm build covers every GPU (for example RDNA4, gfx1201) is not verified; check with
#   `distrobox enter rocm -- rocminfo`.
[rocm]
image=registry.fedoraproject.org/fedora-toolbox:45
pull=true
replace=false
start_now=true
init=false
nvidia=false
additional_packages="rocminfo rocm-smi rocm-hip rocm-opencl hipcc"
