# Settings for `ujust toolbox dev`, read as plain KEY=value data (never run as code).
# Allowed characters in a value: letters, digits, space and . _ + -
# Tools offered in the checklist (all preselected): uv rustup sdkman nvm
TOOLS="uv rustup sdkman nvm"
# Commands exported to ~/.local/bin with distrobox-export when they exist in the box
EXPORT_BINS="cc gcc g++ c++ make cmake ninja meson ld as ar nm objdump strip ranlib pkg-config lsscsi nicstat waypipe evtest guestfish virt-v2v flatpak-builder"
# IDE launchers `ujust toolbox dev --ide` offers
IDES="pycharm idea datagrip rustrover clion goland webstorm vscode"
