# Settings for `ujust toolbox gaming`, read as plain KEY=value data (never run as code).
# Allowed characters in a value: letters, digits, space and . _ + -
# No tools, exported commands or IDE launchers: everything is baked into the image.
TOOLS=""
EXPORT_BINS=""
IDES=""
# The container gets its own HOME (home=<TOOLBOX_HOMES_DIR>/gaming), so it shares no library folders with
# the host's Flatpak Steam. `--remove` keeps it; `--remove --purge-home` deletes it.
ISOLATED_HOME=true
# App launchers exported to the host with `distrobox-export --app` (~/.local/share/applications)
EXPORT_APPS="steam"
