# Development toolbox for `distrobox assemble`. The image carries no compilers or build tools;
# they live here instead. Create the box with `ujust dev-toolbox`, or by hand:
#   distrobox assemble create --file /usr/share/ublue-os/distrobox/fedora-toolbox.ini
#
# - The image is Universal Blue's toolbox (github.com/ublue-os/toolboxes). At last check it was
#   Fedora 44 and shipped Terra's mesa.
# - There is no home= key on purpose: the container's $HOME is the host's. ~/.cargo, ~/.rustup,
#   caches and dotfiles are shared, and /var/home/<user> paths resolve inside the box.
# - exported_bins and exported_bins_path are not set because the path is per user. The recipe
#   exports the build chain and CLI tools to ~/.local/bin with distrobox-export instead.
# - The volume makes brew's prefix visible read-only (so Python source builds can see brew's
#   Python). The directory must exist when the box is created, so `ujust dev-toolbox` drops this
#   line from a temporary copy while /home/linuxbrew does not exist. A box created before brew
#   was installed lacks the mount: run `ujust dev-toolbox --recreate` after `ujust brew`.
# - Inside the box, software comes from dnf packages (uv and rustup are in the list below, unverified
#   package names). Only SDKMAN and nvm have no Fedora package; `ujust dev-toolbox` installs those
#   with vendor installer scripts that are shown to you first, and nothing here needs sudo on the host.
# - To test this file before the image ships it: DEV_TOOLBOX_DEFINITION=<this file> just --justfile
#   system_files/usr/share/ublue-os/just/60-custom.just dev-toolbox
# - Package notes: libgit2-devel is the Fedora 44 name; Fedora 45 renames it libgit2_1.9-devel.
#   ffmpeg-free-devel is left out because libGLU cannot install with Terra's mesa.
[fedora-toolbox]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true
replace=false
start_now=true
volume="/home/linuxbrew:/home/linuxbrew:ro"
additional_packages="@c-development @development-tools autoconf automake binutils bison byacc ccache cscope ctags diffstat direnv doxygen elfutils fastfetch fish flex gcc gcc-c++ gdb gettext glibc-devel glibc-locale-source indent libffi-devel libtool ltrace make patch patchutils perf pinentry pkgconf pkgconf-pkg-config strace subversion systemtap util-linux-script valgrind zoxide cmake ninja-build meson gcc-gfortran clang protobuf-compiler protobuf-devel python3-devel openssl-devel zlib-ng-compat-devel bzip2-devel xz-devel readline-devel sqlite-devel ncurses-devel libxml2-devel libxslt-devel libcurl-devel libuuid-devel libyaml-devel gdbm-devel libzstd-devel lz4-devel snappy-devel pcre2-devel libicu-devel libpq-devel mariadb-connector-c-devel openldap-devel cyrus-sasl-devel krb5-devel libgit2-devel hdf5-devel flexiblas-devel openblas-devel glib2-devel cairo-devel cairo-gobject-devel gobject-introspection-devel libjpeg-turbo-devel libpng-devel freetype-devel libtiff-devel libwebp-devel lcms2-devel openjpeg-devel libva-devel libdrm-devel alsa-lib-devel pulseaudio-libs-devel pipewire-devel mesa-libGL-devel libX11-devel wayland-devel libxkbcommon-devel systemd-devel dbus-devel libusb1-devel libselinux-devel pam-devel libcap-devel libseccomp-devel gnutls-devel libgcrypt-devel vulkan-tools libva-utils clinfo setools-console lm_sensors lsscsi nicstat traceroute waypipe evtest xset xrefresh dbus-tools debugedit dwz appstream-compose flatpak-builder guestfs-tools virt-v2v supermin osbuild rocminfo rocm-smi rocm-hip rocm-opencl hipcc uv rustup"
