# The `gaming` toolbox for `distrobox assemble`: a second Steam client in its own container, with its own home.
# The section name is the container name and the toolbox name for `ujust toolbox gaming`. Create the box with
# `ujust toolbox gaming`, or by hand: distrobox assemble create --file /usr/share/ublue-os/distrobox/gaming.ini
# What the recipe sets up around it (isolated home, exported launcher) is in gaming.conf next to this file.
#
# - The image is built in github.com/redcodeworks/fedora-toolbox as ghcr.io/redcodeworks/fedora-gaming:
#   Steam from RPM Fusion nonfree, gamescope, mangohud, gamemode, protontricks, winetricks, vulkan-tools,
#   mesa-demos and libva-utils are baked in, so there is no additional_packages key. Terra is dropped from the
#   base on purpose (out-of-tree packages; Fedora and RPM Fusion only). To change a package, change that repo
#   and run `ujust toolbox gaming --upgrade`.
# - init=false and nvidia=false: no systemd inside, no NVIDIA driver injection (an AMD machine).
# - There is no home= key here: with ISOLATED_HOME=true in gaming.conf the recipe adds home=<dir> to a
#   temporary copy of this file (the directory is TOOLBOX_HOMES_DIR/gaming, default
#   ~/.local/share/toolbox-homes/gaming). The Steam library, Proton prefixes and saves live there.
# - The container keeps distrobox's defaults: privileged, host network. If Steam shows `bwrap ... resolv.conf`
#   errors after a suspend, the box can be recreated with unshare_netns=true; it is not set here on purpose.
# - Extra binds (a games disk) come from the environment, not from this file:
#   TOOLBOX_VOLUMES="/srv/games:/mnt/games" ujust toolbox gaming
# - To use another tag of the image: TOOLBOX_IMAGE=ghcr.io/redcodeworks/fedora-gaming:testing ujust toolbox gaming
[gaming]
image=ghcr.io/redcodeworks/fedora-gaming:latest
pull=true
replace=false
start_now=true
init=false
nvidia=false
