# The `dev-toolbox` toolbox for `distrobox assemble`. The host image carries no compilers or build tools;
# they live here instead. The section name is the container name, and the toolbox name for
# `ujust toolbox <name>`. Create the box with `ujust toolbox dev-toolbox`, or by hand:
#   distrobox assemble create --file /usr/share/ublue-os/distrobox/dev-toolbox.ini
# Which tools, exported commands and IDE launchers the recipe sets up for it is in dev-toolbox.conf next to
# this file. To add a toolbox: another <name>.ini (section [<name>]) and an optional <name>.conf.
#
# - The image is our own toolbox image, github.com/redcodeworks/fedora-toolbox, built weekly on top of
#   ghcr.io/ublue-os/fedora-toolbox (Fedora 44 with Terra's mesa at last check). The package list
#   (compilers, -devel libraries, uv, rustup-init, CLI tools) is baked in and lives in that repo as
#   packages/dev.txt, so nothing is installed when the box is created and there is no additional_packages
#   key here. To change a package, change that repo; `ujust toolbox dev-toolbox --upgrade` then gets the new image.
# - There is no home= key on purpose: the container's $HOME is the host's. ~/.cargo, ~/.rustup,
#   caches and dotfiles are shared, and /var/home/<user> paths resolve inside the box.
# - exported_bins and exported_bins_path are not set because the path is per user. The recipe
#   exports the build chain and CLI tools to ~/.local/bin with distrobox-export instead.
# - The volume makes brew's prefix visible read-only (so Python source builds can see brew's
#   Python). The directory must exist when the box is created, so `ujust toolbox dev-toolbox` drops this
#   line from a temporary copy while /home/linuxbrew does not exist. A box created before brew
#   was installed lacks the mount: run `ujust toolbox dev-toolbox --recreate` after `ujust brew`.
# - Fedora's rustup package ships only rustup-init. `ujust toolbox dev-toolbox` runs it in your home (after
#   asking) to create ~/.cargo/bin/rustup and the proxies. Only SDKMAN and nvm use vendor installer
#   scripts, shown to you first; nothing here needs sudo on the host.
# - To use another tag of the image (for example `testing`) without editing this file:
#   TOOLBOX_IMAGE=ghcr.io/redcodeworks/fedora-toolbox:testing ujust toolbox dev-toolbox
# - To test from a checkout: TOOLBOX_DEFINITIONS=<this directory> just --justfile
#   system_files/usr/share/ublue-os/just/60-custom.just toolbox dev-toolbox
[dev-toolbox]
image=ghcr.io/redcodeworks/fedora-toolbox:latest
pull=true
replace=false
start_now=true
volume="/home/linuxbrew:/home/linuxbrew:ro"
