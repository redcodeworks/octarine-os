# Installed by `ujust niri-setup` as ~/.config/xdg-desktop-portal/niri-portals.conf (read when XDG_CURRENT_DESKTOP=niri).
# Why this file exists: niri's packaged /usr/share/xdg-desktop-portal/niri-portals.conf sends the Secret portal to
# gnome-keyring, but on this image the secret service (org.freedesktop.secrets) belongs to oo7, so Flatpak apps would ask
# a different store than the rest of the desktop. This file keeps the packaged choices and points the Secret portal at
# oo7-portal. A user file replaces the packaged one entirely, nothing is merged.
# Undo: delete this file (the packaged one applies again at the next login).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
