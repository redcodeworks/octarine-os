; GameMode tuning installed by `ujust gaming-setup gamemode` as ~/.config/gamemode.ini.
; A user's file overrides the system-wide /etc/gamemode.ini for the keys it sets.
; The [gpu] section is deliberately absent: gamemode only reads [gpu] from root-owned files (its GPU helper
; runs as root via polkit), so it belongs in /etc/gamemode.ini, a root-owned local choice.

[general]
; The start hook may switch the scheduler (up to about 6 s) next to the tuned profile: allow more than GameMode's default 10 s.
script_timeout=20
; Higher scheduling priority for the game process while gamemode is active.
; Needs the user in the `gamemode` group (grants nice -10 via
; /etc/security/limits.d/10-gamemode.conf; `ujust user-setup` adds the group) or this silently no-ops.
renice=10

; Keep the CPU governor at what amd-pstate-epp already uses (`powersave`) so
; gamemoded does not flip it to `performance`: with amd-pstate in active mode
; that also forces energy_performance_preference to `performance`, and GameMode
; never restores it (upstream FeralInteractive/gamemode#419, reproduced on 1.8.2).
; Undo: delete this line (the packaged default is `performance`).
desiredgov=powersave

[custom]
; Stock tuned latency-performance (performance governor, which forces EPP to
; performance on amd-pstate; clocks pinned; platform profile performance; deep C-states
; limited) only while a game runs. Needs tuned (`tuned-adm`).
; tuned-adm works unprivileged for the active session (polkit) and takes ~1 s, well
; under GameMode's 10 s script timeout. Order: GameMode sets desiredgov first and runs
; `start` last, so tuned wins during the game; on exit GameMode restores its own
; settings, then `end` returns to balanced (the ppd.conf default).
; If gamemoded dies mid-game the profile persists: run `tuned-adm profile balanced`.
; Undo: delete this [custom] section.
; The hooks run the same two tuned commands as separate steps and, only when ~/.config/octarine-os/scheduler.conf names one
; (`ujust scheduler`, GAMEMODE_SCHED=skip|none|<name>; absent means skip), switch the sched_ext scheduler for the game and back.
; They always exit 0 and finish within a few seconds.
start=/usr/libexec/octarine-os/gamemode-start
end=/usr/libexec/octarine-os/gamemode-end
