# Hardening pass (2026-09-12): kevin already has full sudo, so there's no
# legitimate reason for root to log in over SSH directly. Neither X11
# forwarding nor SSH tunneling/port-forwarding is actually used on this
# machine, so both are turned off to reduce attack surface.
#
# Named 45- (not 90-, alongside 90-key-only-auth.conf) specifically to sort
# before Fedora's own /etc/ssh/sshd_config.d/50-redhat.conf, which sets
# X11Forwarding yes -- sshd takes the first-loaded value for a directive,
# so a later file can't override an earlier one. Don't renumber this above
# 50 without re-verifying `sshd -T` still reports the values below.
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
