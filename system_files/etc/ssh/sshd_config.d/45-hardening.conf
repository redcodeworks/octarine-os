# Hardening: no direct root login over SSH (use sudo), and no X11 forwarding or TCP
# forwarding/tunneling. Remove these if you rely on them.
#
# Named 45- (not 90-) so it sorts before Fedora's own 50-redhat.conf, which sets
# X11Forwarding yes. sshd takes the first value it sees for a directive, so a later
# file cannot override an earlier one. Don't renumber this above 50 without
# re-verifying `sshd -T` still reports the values below.
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
