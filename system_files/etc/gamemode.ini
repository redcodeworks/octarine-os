; System-wide GameMode defaults. A user's ~/.config/gamemode.ini overrides these values key by key.
; The image's extra tuning (CPU governor, tuned profile) is NOT here: `ujust gaming-setup gamemode` installs it as
; ~/.config/gamemode.ini for people who want it.

[general]
; Higher scheduling priority for the game process while GameMode is active.
; Needs your user in the `gamemode` group (`ujust user-setup`, groups step; it grants nice -10 through
; /etc/security/limits.d/10-gamemode.conf), otherwise it silently does nothing.
renice=10

; GameMode reads [gpu] only from root-owned files (its GPU helper runs as root through polkit), so GPU tuning
; belongs here and not in ~/.config/gamemode.ini. Not set: it depends on the card.
