# Raise the locked-memory limit for kevin (adopted from Bazzite, 2026-10-17; docs/silverblue-parity.md).
# Some games and emulators lock large buffers; the default user limit is 8 MiB. Values are KiB (about 2 GiB).
# Applies at the next login (pam_limits); `ulimit -l` shows the result.
kevin  soft  memlock  2147484
kevin  hard  memlock  2147484
