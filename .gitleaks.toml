title = "octarineOS gitleaks config"

[extend]
useDefault = true

# A pam_u2f (pamu2fcfg) security key registration: user:keyhandle,publickey,algorithm,+options.
# Not a private key, but it identifies a person's hardware key and must not be published.
[[rules]]
id = "pam-u2f-registration"
description = "A pam_u2f security key registration line"
regex = '''[A-Za-z0-9._-]+:[A-Za-z0-9_\-+/=]{20,},[A-Za-z0-9_\-+/=]{20,},(es256|eddsa|rs256)(,|\s|$)'''
keywords = ["es256", "eddsa", "rs256"]

# The minisign PUBLIC key of the Zig release signatures (it was in binaries/ghostty/zig.env, now in the octarine-bins repository; the full-history scan still sees it in older commits): public by design, published on ziglang.org/download.
# Allowed by its exact value only; no other key-looking string is.
[[allowlists]]
description = "Zig release signing key (minisign public key)"
regexes = ['''RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti\+JO/wCYvhbAb/U''']
