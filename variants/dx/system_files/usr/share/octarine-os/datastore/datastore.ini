# The `datastore` box for `distrobox assemble`: ONE distrobox with its own systemd that runs PostgreSQL 17, Valkey, SeaweedFS and Kafka
# on the host's `lakehouse` podman network, under the aliases pgsql, postgresql, valkey, seaweedfs and kafka. Create it with
# `ujust datastore-box-create` (which first makes sure the network exists), or by hand:
#   podman network exists lakehouse || podman network create lakehouse
#   distrobox assemble create --file /usr/share/octarine-os/datastore/datastore.ini
# This file is NOT in /usr/share/ublue-os/distrobox on purpose: `ujust toolbox` lists every .ini there and would create the box without the network.
# Ports are published on loopback only. The SeaweedFS filer is 8888 inside the box and 8889 on the host.
# The image is built and signed by github.com/redcodeworks/octarine-images (datastore/); its contract is that repository's datastore/README.md.
[datastore]
image=ghcr.io/redcodeworks/datastore:latest
init=true
unshare_netns=true
pull=true
additional_flags="--network lakehouse --network-alias pgsql --network-alias postgresql --network-alias valkey --network-alias seaweedfs --network-alias kafka -p 127.0.0.1:5432:5432 -p 127.0.0.1:6379:6379 -p 127.0.0.1:8333:8333 -p 127.0.0.1:9333:9333 -p 127.0.0.1:8889:8888 -p 127.0.0.1:9092:9092"
