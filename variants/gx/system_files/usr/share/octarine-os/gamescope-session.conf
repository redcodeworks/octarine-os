# Steam Big Picture (gamescope) session of the octarineOS gamer image: the defaults and the list of every setting.
#
# HOW TO CHANGE A SETTING: do not edit this file (the image replaces it on every update). Put VAR=value lines into
#   ~/.config/environment.d/10-gamescope-session.conf          yours (`ujust gaming-setup gamescope-session` writes the display part of it)
#   /etc/environment.d/*.conf                                  the whole machine
# The session reads, in this order, later files overriding earlier ones: this file, /etc/environment.d/*.conf, ~/.config/environment.d/*.conf.
# Plain VAR=value lines, no spaces around the =, quotes optional. The same names and files Bazzite and ChimeraOS use.
# A setting that is not set (or empty) leaves its gamescope flag out: gamescope then takes the output's preferred mode. Nothing here assumes a display.
#
# HOW TO USE THE SESSION: at the GDM login screen click the gear and pick "Steam Big Picture (gamescope)". There is no switch back: leave Steam
# (power menu in Big Picture, or `steam -shutdown`) and the session ends at the GDM login screen, where you pick your desktop again.
# Log: journalctl -b -t octarine-gamescope-session
#
# Steam is started as `steam -steamos3 -gamepadui`. Bazzite adds `-steampal -steamdeck` (the Steam Deck look); not done here.
#
# Setting                  gamescope flag               Meaning
# OUTPUT_CONNECTOR         --prefer-output              display to use, for example DP-1 or HDMI-A-1 (ls /sys/class/drm shows the names)
# SCREEN_WIDTH             -W                           output width in pixels, for example 5120
# SCREEN_HEIGHT            -H                           output height in pixels, for example 2160
# REFRESH_RATE             -r                           output refresh rate in Hz, for example 120
# INTERNAL_WIDTH           -w                           width games render at (gamescope scales it up to the output)
# INTERNAL_HEIGHT          -h                           height games render at
# UPSCALER                 -F                           scaling filter: fsr, nis, linear, nearest or pixel (default below: fsr)
# ADAPTIVE_SYNC            --adaptive-sync              any value except 0, false, no or off turns variable refresh rate on
# MOUSE_SENSITIVITY        --mouse-sensitivity          mouse speed factor, for example 2
# CUSTOM_REFRESH_RATES     --custom-refresh-rates       refresh rates to offer, for example 60,120
# DRM_MODE                 --generate-drm-mode          how gamescope makes a mode: cvt, fixed or similar (see gamescope --help)
# ORIENTATION              --force-orientation          left, right, normal or upsidedown
# ENABLE_GAMESCOPE_HDR     --hdr-enabled --hdr-itm-enable   any value except 0, false, no or off turns HDR on (unverified on real hardware)
# GAMESCOPE_HDR_NITS       --hdr-itm-target-nits        HDR tone mapping target brightness (only with HDR on)
# GAMESCOPE_EXTRA_ARGS     (appended as given)          anything else for gamescope, one line, split at spaces; the session already passes --backend drm and -e
#
# Example, a 5120x2160 monitor on DP-1 at 120 Hz with variable refresh rate:
#   OUTPUT_CONNECTOR=DP-1
#   SCREEN_WIDTH=5120
#   SCREEN_HEIGHT=2160
#   REFRESH_RATE=120
#   ADAPTIVE_SYNC=1
#
# The image's defaults (everything else is unset):
UPSCALER=fsr
